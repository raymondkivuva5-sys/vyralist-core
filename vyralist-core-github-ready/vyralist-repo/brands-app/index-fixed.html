<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyralist — Turn Creator Marketing Into Your Most Profitable Growth Channel</title>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --lime: #A4F563;
            --lime-dark: #7fd93b;
            --black: #0a0a0a;
            --white: #ffffff;
            --gray-50: #f9fafa;
            --gray-100: #f2f3f3;
            --gray-200: #e4e6e6;
            --gray-400: #9ba1a1;
            --gray-600: #5c6363;
            --indigo: #6366F1;
            --green: #10B981;
            --red: #EF4444;
            --amber: #F59E0B;
        }

        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            color: var(--black);
            background: var(--white);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, .section-h2, .hero h1, .price-duration, .logo-text, .preview-stat-big {
            font-family: 'Syne', sans-serif;
        }

        /* ===================== LOADING ===================== */
        .app-loader {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--black);
        }
        .loader-ring {
            width: 48px; height: 48px;
            border: 3px solid rgba(164,245,99,0.2);
            border-top-color: var(--lime);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

        /* ===================== NAVBAR ===================== */
        .navbar {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(255,255,255,0.97);
            border-bottom: 1px solid var(--gray-200);
            transform: translateZ(0);
            will-change: transform;
        }
        .nav-inner {
            max-width: 1400px; margin: 0 auto;
            padding: 1.1rem 2.5rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-text {
            font-size: 1.8rem; font-weight: 800;
            letter-spacing: -0.5px; cursor: pointer;
        }
        .nav-links { display: flex; gap: 2.5rem; align-items: center; }
        .nav-link {
            color: var(--gray-600); font-weight: 500; font-size: 0.95rem;
            cursor: pointer; transition: color 0.2s; text-decoration: none;
        }
        .nav-link:hover { color: var(--black); }

        /* ===================== BUTTONS ===================== */
        .btn {
            font-family: 'DM Sans', sans-serif;
            padding: 0.75rem 1.75rem; border-radius: 50px;
            font-weight: 600; font-size: 0.95rem;
            cursor: pointer; border: none; transition: all 0.25s;
            display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .btn-black { background: var(--black); color: var(--white); }
        .btn-black:hover { background: #2a2a2a; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .btn-outline { background: transparent; border: 2px solid var(--black); color: var(--black); }
        .btn-outline:hover { background: var(--black); color: var(--white); }
        .btn-lime { background: var(--lime); color: var(--black); }
        .btn-lime:hover { background: var(--lime-dark); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(164,245,99,0.4); }
        .btn-lg { padding: 1rem 2.25rem; font-size: 1.05rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .btn-full { width: 100%; justify-content: center; }

        /* ===================== HERO ===================== */
        .hero {
            padding: 11rem 2.5rem 6rem;
            min-height: 100vh;
            display: flex; align-items: center;
            position: relative; overflow: hidden;
        }
        .blob-wrap { position: absolute; inset: 0; pointer-events: none; overflow: hidden; contain: strict; }
        .blob {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(164,245,99,0.25) 0%, rgba(164,245,99,0.05) 70%);
            filter: blur(40px);
            will-change: transform;
            transform: translateZ(0);
            animation: blobFloat 22s ease-in-out infinite;
        }
        .blob-a { width: 380px; height: 380px; top: -100px; left: -100px; animation-delay: 0s; }
        .blob-b { width: 300px; height: 300px; top: 40%; right: -120px; animation-delay: 8s; }
        .blob-c { width: 250px; height: 250px; bottom: -80px; left: 35%; animation-delay: 16s; }
        @keyframes blobFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(80px,-80px) scale(1.08); }
            66% { transform: translate(-80px,60px) scale(0.92); }
        }
        .hero-inner { max-width: 1400px; margin: 0 auto; text-align: center; position: relative; z-index: 1; width: 100%; }
        .platform-chips { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
        .chip {
            padding: 0.45rem 1.1rem; background: white;
            border: 1.5px solid var(--gray-200); border-radius: 50px;
            font-size: 0.875rem; font-weight: 600;
            display: flex; align-items: center; gap: 0.4rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .hero h1 {
            font-size: clamp(2.8rem, 6vw, 5.2rem);
            font-weight: 800; line-height: 1.08;
            margin-bottom: 1.75rem; letter-spacing: -0.5px;
        }
        .hero h1 em { font-style: normal; color: var(--lime-dark); }
        .hero-sub {
            font-size: clamp(1rem, 2vw, 1.3rem);
            color: var(--gray-600); max-width: 820px;
            margin: 0 auto 2.75rem; line-height: 1.75;
        }
        .hero-cta { display: flex; justify-content: center; gap: 1rem; margin-bottom: 4rem; flex-wrap: wrap; }

        /* Dashboard Preview */
        .preview-frame {
            max-width: 1100px; margin: 0 auto;
            background: white; border: 2px solid var(--gray-200);
            border-radius: 20px; padding: 1.75rem;
            box-shadow: 0 40px 120px rgba(0,0,0,0.1);
        }
        .preview-tabs { display: flex; gap: 2rem; border-bottom: 2px solid var(--gray-200); padding-bottom: 1rem; margin-bottom: 1.75rem; }
        .preview-tab { font-weight: 600; font-size: 0.9rem; color: var(--gray-400); padding-bottom: 0.25rem; cursor: pointer; border-bottom: 3px solid transparent; }
        .preview-tab.active { color: var(--black); border-bottom-color: var(--lime); }
        .preview-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2.5rem; }
        .preview-stat-big { font-family: 'DM Sans', sans-serif; font-size: 4.5rem; font-weight: 800; line-height: 1; }
        .preview-stat-label { font-size: 0.85rem; color: var(--gray-600); margin-top: 0.4rem; }

        /* ===================== TRUST ===================== */
        .trust-bar { padding: 4rem 2.5rem; background: white; text-align: center; }
        .trust-bar p { color: var(--gray-400); font-size: 0.9rem; font-weight: 500; margin-bottom: 2.5rem; letter-spacing: 0.05em; text-transform: uppercase; }
        .logos { display: flex; justify-content: center; align-items: center; gap: 3.5rem; flex-wrap: wrap; opacity: 0.5; }
        .logo-item { font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--black); }

        /* ===================== VALUE ===================== */
        .section-pad { padding: 7rem 2.5rem; }
        .section-center { text-align: center; }
        .section-tag {
            display: inline-block; padding: 0.35rem 1rem;
            background: rgba(164,245,99,0.2); border: 1.5px solid var(--lime);
            border-radius: 50px; font-size: 0.8rem; font-weight: 700;
            letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1.25rem;
            color: #3a8000;
        }
        .section-h2 {
            font-size: clamp(2rem, 4.5vw, 3.75rem);
            font-weight: 800; line-height: 1.15;
            letter-spacing: -0.25px; margin-bottom: 1.25rem;
        }
        .section-sub { font-size: 1.15rem; color: var(--gray-600); max-width: 750px; margin: 0 auto 4.5rem; line-height: 1.75; }

        .features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; max-width: 1300px; margin: 0 auto; }
        .feature-card {
            background: white; border: 2px solid var(--gray-200);
            border-radius: 24px; padding: 3.5rem;
            transition: all 0.3s; text-align: left;
        }
        .feature-card:hover { transform: translateY(-8px); box-shadow: 0 20px 60px rgba(0,0,0,0.08); }
        .feature-card.lime { background: linear-gradient(145deg, rgba(164,245,99,0.18), rgba(164,245,99,0.04)); border-color: #c3efaa; }
        .feature-icon { font-size: 2.5rem; margin-bottom: 1.25rem; }
        .feature-card h3 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.75rem; }
        .feature-card h4 { font-size: 1rem; color: var(--gray-600); font-weight: 500; margin-bottom: 1.5rem; }
        .feature-card p { font-size: 1.05rem; color: var(--gray-600); line-height: 1.8; }

        /* ===================== HOW IT WORKS ===================== */
        .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .step-card { text-align: center; padding: 2.5rem 2rem; }
        .step-num {
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--lime); color: var(--black);
            font-family: 'DM Sans', sans-serif; font-size: 1.25rem; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem;
        }
        .step-card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.75rem; }
        .step-card p { font-size: 0.95rem; color: var(--gray-600); line-height: 1.7; }

        /* ===================== PRICING ===================== */
        .pricing-wrap { background: var(--gray-50); }
        .tier-switch { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3.5rem; flex-wrap: wrap; }
        .tier-pill {
            padding: 0.8rem 2rem; border-radius: 50px;
            border: 2px solid var(--gray-200);
            background: white; font-weight: 700;
            cursor: pointer; transition: all 0.25s;
            font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
        }
        .tier-pill.active { background: var(--black); color: white; border-color: var(--black); }
        .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.75rem; max-width: 1300px; margin: 0 auto 3rem; }
        .price-card {
            background: white; padding: 2.75rem; border-radius: 20px;
            border: 2px solid var(--gray-200); transition: all 0.3s;
        }
        .price-card:hover { transform: translateY(-8px); box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .price-card.popular { border-color: var(--lime); position: relative; }
        .popular-badge {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            background: var(--lime); color: var(--black);
            padding: 0.3rem 1.2rem; border-radius: 50px;
            font-size: 0.8rem; font-weight: 700;
            white-space: nowrap;
        }
        .price-duration { font-family: 'DM Sans', sans-serif; font-size: 1.35rem; font-weight: 800; margin-bottom: 1.25rem; }
        .price-amount { font-family: 'DM Sans', sans-serif; font-size: 3rem; font-weight: 800; margin-bottom: 0.25rem; }
        .price-note { font-size: 0.85rem; color: var(--gray-400); margin-bottom: 2rem; }
        .price-feats { list-style: none; margin-bottom: 2rem; }
        .price-feats li { padding: 0.7rem 0; color: var(--gray-600); display: flex; align-items: center; gap: 0.65rem; font-size: 0.95rem; border-bottom: 1px solid var(--gray-100); }
        .price-feats li:last-child { border-bottom: none; }
        .feat-check { color: var(--lime-dark); font-weight: 900; font-size: 1rem; }

        .payment-box {
            max-width: 1300px; margin: 0 auto;
            background: white; border: 2px solid var(--gray-200);
            border-radius: 20px; padding: 2.5rem; text-align: center;
        }
        .payment-box h3 { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.75rem; }
        .payment-methods { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
        .pay-method {
            padding: 1.25rem 2.5rem; border: 2px solid var(--gray-200);
            border-radius: 14px; display: flex; align-items: center;
            gap: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .pay-method:hover { border-color: var(--lime); background: rgba(164,245,99,0.08); }
        .pay-method span:first-child { font-size: 1.75rem; }

        /* ===================== CTA BAND ===================== */
        .cta-band {
            background: var(--black); color: white;
            padding: 9rem 2.5rem; text-align: center; position: relative; overflow: hidden;
        }
        .cta-band::before {
            content: '';
            position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
            width: 800px; height: 800px; border-radius: 50%;
            background: radial-gradient(circle, rgba(164,245,99,0.12) 0%, transparent 70%);
        }
        .cta-band h2 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; letter-spacing: -0.5px; margin-bottom: 1.25rem; position: relative; }
        .cta-band p { font-size: 1.2rem; opacity: 0.75; margin-bottom: 2.75rem; max-width: 600px; margin-left: auto; margin-right: auto; position: relative; }

        /* ===================== FOOTER ===================== */
        .footer { background: white; padding: 5rem 2.5rem 2.5rem; border-top: 2px solid var(--gray-200); }
        .footer-grid { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 4rem; margin-bottom: 3rem; }
        .footer-col h4 { font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 700; margin-bottom: 1.25rem; }
        .footer-col p { color: var(--gray-600); line-height: 1.75; font-size: 0.9rem; }
        .footer-col ul { list-style: none; }
        .footer-col ul li { color: var(--gray-600); margin-bottom: 0.65rem; cursor: pointer; font-size: 0.9rem; transition: color 0.2s; }
        .footer-col ul li:hover { color: var(--black); }
        .footer-bottom { max-width: 1300px; margin: 0 auto; padding-top: 2rem; border-top: 1px solid var(--gray-200); color: var(--gray-400); font-size: 0.85rem; }

        /* ===================== AUTH MODAL ===================== */
        .overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.65);
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .auth-card {
            background: white; border-radius: 20px; padding: 3rem;
            width: 100%; max-width: 480px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.25);
            animation: slideUp 0.3s ease;
            position: relative;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .auth-card-close {
            position: absolute; top: 1.25rem; right: 1.5rem;
            background: none; border: none; font-size: 1.75rem;
            cursor: pointer; color: var(--gray-400); line-height: 1;
        }
        .auth-card-close:hover { color: var(--black); }
        .auth-title { font-family: 'DM Sans', sans-serif; font-size: 1.75rem; font-weight: 800; margin-bottom: 1.75rem; }
        .oauth-row { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; }
        .oauth-btn {
            flex: 1; padding: 0.75rem; border: 2px solid var(--gray-200);
            border-radius: 10px; background: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 0.5rem; font-weight: 600; font-size: 0.9rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
        }
        .oauth-btn:hover { border-color: var(--black); }
        .divider-line {
            display: flex; align-items: center; gap: 1rem;
            margin: 1.25rem 0; color: var(--gray-400); font-size: 0.85rem;
        }
        .divider-line::before, .divider-line::after {
            content: ''; flex: 1; height: 1px; background: var(--gray-200);
        }

        /* ===================== FORMS ===================== */
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; }
        .req { color: var(--red); }
        .form-input, .form-select {
            width: 100%; padding: 0.75rem 1rem;
            border: 2px solid var(--gray-200); border-radius: 10px;
            font-size: 0.95rem; font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s; background: white;
        }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--black); }
        .form-input.err { border-color: var(--red); }
        .err-msg { color: var(--red); font-size: 0.82rem; margin-top: 0.25rem; }
        .alert { padding: 0.9rem 1.1rem; border-radius: 10px; margin-bottom: 1rem; font-size: 0.9rem; font-weight: 500; }
        .alert-err { background: #FEE2E2; color: #991B1B; }
        .alert-ok { background: #D1FAE5; color: #065F46; }

        /* Multi-step signup card */
        .signup-wrap {
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a2a1a 100%);
        }
        .signup-card {
            background: white; border-radius: 24px; padding: 3rem;
            max-width: 520px; width: 100%;
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
        }
        .signup-card .logo-text { font-size: 1.5rem; margin-bottom: 0.5rem; display: block; }
        .signup-card .sub { color: var(--gray-600); margin-bottom: 2.25rem; font-size: 0.95rem; line-height: 1.6; }
        .step-pills { display: flex; gap: 0.4rem; margin-bottom: 2.25rem; }
        .step-pill {
            height: 4px; border-radius: 2px; flex: 1;
            background: var(--gray-200); transition: background 0.3s;
        }
        .step-pill.done { background: var(--lime-dark); }
        .step-pill.active { background: var(--black); }

        /* ===================== ONBOARDING ===================== */
        .onboard-wrap {
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            padding: 2rem;
            background: var(--gray-50);
        }
        .onboard-card {
            background: white; border-radius: 24px; padding: 3rem;
            max-width: 540px; width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            border: 2px solid var(--gray-200);
        }
        .onboard-header { margin-bottom: 2.25rem; }
        .onboard-header .logo-text { font-size: 1.4rem; margin-bottom: 0.75rem; display: block; }
        .onboard-header h2 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; }
        .onboard-header p { color: var(--gray-600); font-size: 0.92rem; line-height: 1.6; }
        .onboard-progress { display: flex; gap: 0.4rem; margin-bottom: 2rem; }
        .progress-seg { height: 4px; flex: 1; border-radius: 2px; background: var(--gray-200); }
        .progress-seg.filled { background: var(--lime-dark); }

        /* ===================== DASHBOARD ===================== */
        .dash-shell { min-height: 100vh; background: var(--gray-50); }
        .dash-topbar {
            background: white; border-bottom: 1px solid var(--gray-200);
            padding: 0 2.5rem; display: flex;
            justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; height: 64px;
        }
        .dash-topbar-left { display: flex; align-items: center; gap: 2rem; }
        .dash-nav { display: flex; gap: 0; }
        .dash-nav-item {
            padding: 0 1.25rem; height: 64px;
            display: flex; align-items: center;
            font-weight: 600; font-size: 0.9rem;
            color: var(--gray-400); cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .dash-nav-item:hover { color: var(--black); }
        .dash-nav-item.active { color: var(--black); border-bottom-color: var(--black); }
        .new-pill {
            margin-left: 0.45rem; padding: 0.1rem 0.4rem;
            background: var(--lime); color: var(--black);
            font-size: 0.65rem; border-radius: 4px; font-weight: 700;
        }
        .dash-topbar-right { display: flex; align-items: center; gap: 1.25rem; }
        .icon-action {
            background: none; border: none; cursor: pointer;
            font-size: 1.2rem; color: var(--gray-600); position: relative;
            padding: 0.4rem; border-radius: 8px; transition: background 0.2s;
        }
        .icon-action:hover { background: var(--gray-100); }
        .notif-dot {
            position: absolute; top: 0; right: 0;
            width: 8px; height: 8px; background: var(--red);
            border-radius: 50%; border: 2px solid white;
        }
        .wallet-chip {
            padding: 0.4rem 0.9rem; background: var(--gray-100);
            border-radius: 50px; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; border: 1.5px solid var(--gray-200);
            transition: all 0.2s; display: flex; align-items: center; gap: 0.4rem;
        }
        .wallet-chip:hover { border-color: var(--black); background: white; }
        /* ── Panel dropdown base ── */
        .panel-overlay {
            position: fixed; inset: 0; z-index: 900;
        }
        .top-panel {
            position: fixed; top: 68px; right: 16px; z-index: 1000;
            background: white; border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.16);
            border: 1px solid var(--gray-200);
            animation: slideDown 0.2s ease;
            overflow: hidden;
        }
        @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
        /* ── Inbox panel ── */
        .inbox-panel { width: 380px; max-height: 520px; display:flex; flex-direction:column; }
        .panel-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--gray-200); display:flex; justify-content:space-between; align-items:center; }
        .panel-header h3 { font-weight:800; font-size:1rem; }
        .panel-close { background:none; border:none; cursor:pointer; font-size:1.3rem; color:var(--gray-400); line-height:1; }
        .panel-close:hover { color:var(--black); }
        .panel-body { overflow-y:auto; flex:1; }
        .msg-item { display:flex; gap:0.85rem; padding:1rem 1.5rem; cursor:pointer; transition:background 0.15s; border-bottom:1px solid var(--gray-100); }
        .msg-item:hover { background:var(--gray-50); }
        .msg-item.unread { background:rgba(164,245,99,0.06); }
        .msg-avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--indigo),#9333ea); display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:0.9rem; flex-shrink:0; }
        .msg-info { flex:1; min-width:0; }

        .msg-time { font-size:0.75rem; color:var(--gray-400); font-weight:400; }
        .msg-preview { font-size:0.82rem; color:var(--gray-600); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .msg-unread-dot { width:8px; height:8px; background:var(--indigo); border-radius:50%; margin-top:4px; flex-shrink:0; }
        /* ── Notification panel ── */
        .notif-panel { width: 380px; max-height: 520px; display:flex; flex-direction:column; }
        .notif-tabs { display:flex; border-bottom:1px solid var(--gray-200); }
        .notif-tab { flex:1; padding:0.75rem; text-align:center; font-weight:600; font-size:0.83rem; cursor:pointer; color:var(--gray-400); border-bottom:2px solid transparent; transition:all 0.2s; }
        .notif-tab.active { color:var(--black); border-bottom-color:var(--black); }
        .notif-item { padding:1rem 1.5rem; display:flex; gap:0.85rem; border-bottom:1px solid var(--gray-100); cursor:pointer; transition:background 0.15s; }
        .notif-item:hover { background:var(--gray-50); }
        .notif-item.unread { background:rgba(164,245,99,0.06); }
        .notif-icon { width:36px; height:36px; border-radius:50%; background:var(--gray-100); display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; }
        .notif-text { flex:1; }
        .notif-title { font-size:0.85rem; font-weight:600; margin-bottom:0.1rem; }
        .notif-sub { font-size:0.78rem; color:var(--gray-600); }
        .notif-time { font-size:0.72rem; color:var(--gray-400); margin-top:0.2rem; }
        /* ── Profile dropdown ── */
        .profile-dropdown { width:280px; }
        .profile-dropdown-header { padding:1rem 1.25rem; border-bottom:1px solid var(--gray-200); display:flex; align-items:center; gap:0.75rem; }
        .profile-dd-avatar { width:40px; height:40px; border-radius:50%; background:var(--gray-200); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9rem; color:var(--gray-600); }
        .profile-dd-email { font-size:0.82rem; color:var(--gray-600); }
        .profile-dd-item { display:flex; align-items:center; gap:0.75rem; padding:0.85rem 1.25rem; cursor:pointer; font-size:0.88rem; font-weight:500; transition:background 0.15s; color:var(--black); border:none; background:none; width:100%; text-align:left; }
        .profile-dd-item:hover { background:var(--gray-50); }
        .profile-dd-item.danger { color:var(--red); }
        .profile-dd-item.danger:hover { background:#FEE2E2; }
        .profile-dd-divider { height:1px; background:var(--gray-200); margin:0.25rem 0; }
        .profile-dd-userid { padding:0.65rem 1.25rem; font-size:0.75rem; color:var(--gray-400); border-top:1px solid var(--gray-200); }
        /* ── Wallet page ── */
        .wallet-page { padding: 2.5rem; max-width: 1100px; margin: 0 auto; }
        .wallet-top-cards { display:grid; grid-template-columns:1fr 2fr; gap:1.5rem; margin-bottom:2.5rem; }
        .wallet-balance-card { background:var(--gray-50); border:1.5px solid var(--gray-200); border-radius:16px; padding:2rem; }
        .wallet-balance-label { display:flex; align-items:center; gap:0.4rem; font-weight:600; font-size:0.9rem; margin-bottom:0.5rem; color:var(--black); }
        .wallet-balance-amt { font-size:2.5rem; font-weight:800; color:var(--indigo); margin-bottom:1rem; }
        .wallet-add-btn { background:var(--indigo); color:white; border:none; border-radius:10px; padding:0.65rem 1.25rem; font-weight:700; font-size:0.85rem; cursor:pointer; font-family:'DM Sans',sans-serif; transition:background 0.2s; }
        .wallet-add-btn:hover { background:#4f46e5; }
        .wallet-promo-card { background:var(--gray-50); border:1.5px solid var(--gray-200); border-radius:16px; padding:2rem; }
        .wallet-promo-title { font-size:1.15rem; font-weight:800; margin-bottom:1.25rem; }
        .wallet-promo-item { display:flex; align-items:flex-start; gap:0.6rem; margin-bottom:0.75rem; font-size:0.9rem; }
        .wallet-promo-check { color:var(--green); font-size:1rem; flex-shrink:0; margin-top:1px; }
        .wallet-packs-title { font-size:1.35rem; font-weight:800; margin-bottom:0.3rem; }
        .wallet-packs-sub { font-size:0.88rem; color:var(--gray-600); margin-bottom:1.75rem; }
        .wallet-packs-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1.25rem; }
        .wallet-pack-card { border:2px solid var(--gray-200); border-radius:16px; padding:1.75rem; background:white; transition:all 0.2s; position:relative; }
        .wallet-pack-card:hover { border-color:var(--indigo); box-shadow:0 8px 24px rgba(99,102,241,0.12); }
        .wallet-pack-card.popular-pack { border-color:var(--indigo); }
        .popular-pack-badge { position:absolute; top:-13px; left:50%; transform:translateX(-50%); background:var(--indigo); color:white; padding:0.2rem 1rem; border-radius:50px; font-size:0.72rem; font-weight:700; white-space:nowrap; }
        .pack-name { font-size:1rem; font-weight:700; color:var(--gray-600); margin-bottom:0.75rem; }
        .pack-price { font-size:2rem; font-weight:800; margin-bottom:0.2rem; }
        .pack-price span { font-size:1rem; font-weight:500; color:var(--gray-400); }
        .pack-bonus { font-size:0.85rem; font-weight:700; color:var(--indigo); margin-bottom:0.25rem; }
        .pack-get { font-size:0.8rem; color:var(--gray-600); margin-bottom:1.25rem; }
        .pack-btn { width:100%; background:var(--indigo); color:white; border:none; border-radius:10px; padding:0.7rem; font-weight:700; font-size:0.875rem; cursor:pointer; font-family:'DM Sans',sans-serif; transition:background 0.2s; margin-bottom:0.75rem; }
        .pack-btn:hover { background:#4f46e5; }
        .pack-guarantee { display:flex; align-items:center; gap:0.35rem; font-size:0.75rem; color:var(--gray-600); justify-content:center; }
        .pack-feat { display:flex; align-items:center; gap:0.4rem; font-size:0.82rem; color:var(--gray-600); margin-top:0.5rem; }
        .pack-feat-check { color:var(--green); }
        /* ── Background hero with creator templates ── */
        .dash-shell-bg {
            min-height: 100vh;
            background: var(--gray-50);
            position: relative;
        }
        /* Creator templates background strips */
        .creator-bg-strip {
            position: fixed; top: 64px; left: 0; right: 0;
            height: calc(100vh - 64px); overflow: hidden;
            pointer-events: none; z-index: 0;
            background: #0d0d0d;
        }
        .creator-bg-strip::after {
            content:''; position:absolute; inset:0;
            background: linear-gradient(to bottom, rgba(13,13,13,0.1) 0%, rgba(13,13,13,0.65) 100%);
            z-index:1;
        }
        .template-row {
            display: flex; gap: 12px; padding: 6px 0;
            animation: scrollRow 40s linear infinite;
            width: max-content;
            will-change: transform;
            transform: translateZ(0);
        }
        .template-row.reverse { animation-direction: reverse; animation-duration: 50s; }
        .template-row.slow { animation-duration: 60s; }
        @keyframes scrollRow { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .template-thumb {
            width: 100px; height: 160px; border-radius: 10px;
            flex-shrink: 0; overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            position: relative; border: 1px solid rgba(255,255,255,0.08);
        }
        .template-thumb .t-play {
            position:absolute; bottom:8px; right:8px;
            width:28px; height:28px; background:rgba(255,255,255,0.85);
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:0.7rem;
        }
        .template-thumb .t-label {
            position:absolute; top:6px; left:6px;
            font-size:0.55rem; font-weight:700; color:white;
            background:rgba(0,0,0,0.5); padding:2px 6px; border-radius:4px;
        }
        .creators-content-wrap {
            position: relative; z-index: 2;
        }
        .creators-main {
            padding: 2.5rem; max-width: 1500px; margin: 0 auto;
            background: #ffffff;
            min-height: calc(100vh - 64px);
        }
        .brand-pill {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.45rem 1rem 0.45rem 0.65rem;
            border: 1.5px solid var(--gray-200); border-radius: 50px;
            cursor: pointer; font-weight: 600; font-size: 0.88rem;
            transition: all 0.2s;
        }
        .brand-pill:hover { border-color: var(--black); }
        .brand-avatar {
            width: 26px; height: 26px; border-radius: 50%;
            background: linear-gradient(135deg, var(--lime-dark), #3a9200);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 0.7rem; font-weight: 800;
        }

        /* ===================== CREATORS PAGE ===================== */
        .page-header { margin-bottom: 1.5rem; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.3rem; letter-spacing: -0.02em; }
        .page-header p { color: var(--gray-600); font-size: 0.875rem; }

        .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
        .filter-chip {
            padding: 0.45rem 1rem; border: 1.5px solid var(--gray-200);
            border-radius: 50px; background: white; cursor: pointer;
            font-weight: 500; font-size: 0.82rem; transition: all 0.15s;
            display: flex; align-items: center; gap: 0.3rem; color: var(--gray-700);
        }
        .filter-chip:hover { border-color: var(--gray-400); }
        .filter-chip.active { background: white; color: #6366f1; border-color: #6366f1; font-weight: 700; }
        .filter-chip.filters-all { background: var(--black); color: white; border-color: var(--black); font-weight: 600; }
        .filter-chip.filters-all:hover { background: #222; }

        .creators-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
        .creator-card {
            background: white; border: 1.5px solid var(--gray-200);
            border-radius: 12px; overflow: hidden;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .creator-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-color: var(--gray-300); }
        .creator-card-top { padding: 1rem 1rem 0; cursor: pointer; }
        .creator-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .creator-id { display: flex; gap: 0.65rem; align-items: center; }
        .c-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--indigo), #9333ea);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 1rem;
            font-family: 'DM Sans', sans-serif; flex-shrink: 0;
        }
        .c-name { font-weight: 700; font-size: 0.92rem; }
        .c-meta { display: flex; gap: 0.5rem; font-size: 0.76rem; color: var(--gray-500); flex-wrap: wrap; align-items: center; margin-top: 0.5rem; padding-bottom: 0.75rem; }
        .c-stat { display: flex; align-items: center; gap: 0.2rem; }
        .heart-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; transition: transform 0.2s; padding: 0.2rem; line-height: 1; }
        .heart-btn:hover { transform: scale(1.2); }
        .premium-tag {
            padding: 0.1rem 0.45rem; background: rgba(99,102,241,0.1);
            color: var(--indigo); border-radius: 4px;
            font-size: 0.68rem; font-weight: 700;
        }
        .creator-card-bot { padding: 0.75rem 1rem 1rem; }
        .invite-btn {
            width: 100%; background: var(--black); color: white;
            padding: 0.65rem; border: none; border-radius: 8px;
            font-weight: 700; font-size: 0.875rem; cursor: pointer;
            font-family: 'DM Sans', sans-serif; transition: background 0.2s;
        }
        .invite-btn:hover { background: #2a2a2a; }

        /* ===================== CREATOR MODAL ===================== */
        .modal-sheet {
            background: white; border-radius: 20px;
            max-width: 880px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        .modal-hdr {
            padding: 2rem; border-bottom: 1px solid var(--gray-200);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; background: white; z-index: 10;
        }
        .modal-creator-info { display: flex; align-items: center; gap: 1rem; }
        .modal-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, var(--indigo), #9333ea);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 1.4rem;
            font-family: 'DM Sans', sans-serif;
        }
        .modal-name { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.2rem; }
        .modal-rating { display: flex; align-items: center; gap: 0.4rem; color: var(--amber); font-weight: 600; font-size: 0.9rem; }
        .modal-close {
            background: var(--gray-100); border: none; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%; font-size: 1.25rem;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: var(--gray-200); }
        .modal-tabs { display: flex; gap: 2rem; padding: 0 2rem; border-bottom: 1px solid var(--gray-200); }
        .modal-tab {
            padding: 1rem 0; font-weight: 600; font-size: 0.9rem;
            color: var(--gray-400); cursor: pointer;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .modal-tab:hover { color: var(--black); }
        .modal-tab.active { color: var(--black); border-bottom-color: var(--black); }
        .modal-body { padding: 2rem; }
        .perf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
        .perf-cell { background: var(--gray-50); padding: 1.5rem; border-radius: 14px; text-align: center; }
        .perf-label { font-size: 0.78rem; color: var(--gray-600); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.5rem; }
        .perf-val { font-family: 'DM Sans', sans-serif; font-size: 2.25rem; font-weight: 800; }
        .perf-bar { height: 4px; background: var(--gray-200); border-radius: 2px; margin-top: 0.75rem; overflow: hidden; }
        .perf-fill { height: 100%; background: var(--lime-dark); border-radius: 2px; }
        .price-block { background: var(--gray-50); padding: 1.5rem; border-radius: 14px; margin-bottom: 1.75rem; display: flex; justify-content: space-between; align-items: center; }
        .price-block-label { font-size: 0.85rem; color: var(--gray-600); font-weight: 600; }
        .price-block-val { font-family: 'DM Sans', sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--indigo); }

        /* Brief Modal */
        .brief-form-wrap { padding: 2rem; }
        .brief-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .brief-sub { color: var(--gray-600); margin-bottom: 2rem; font-size: 0.9rem; }

        /* ===================== RESPONSIVE ===================== */
        @media (max-width: 1024px) {
            .features-grid, .pricing-grid { grid-template-columns: 1fr; }
            .steps-grid { grid-template-columns: 1fr; }
            .preview-grid { grid-template-columns: 1fr; }
            .footer-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .dash-nav { display: none; }
            .creators-grid { grid-template-columns: 1fr; }
            .perf-grid { grid-template-columns: 1fr; }
            .hero { padding: 9rem 1.5rem 5rem; }
            .section-pad { padding: 5rem 1.5rem; }
            .signup-card, .onboard-card, .auth-card { padding: 2rem; }

        /* ===== CAMPAIGN MANAGEMENT ===== */
        .campaigns-page{padding:2.5rem;max-width:1300px;margin:0 auto;}

        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        .s-published{background:#EDE8FD;color:#4C1D95;}
        .cc-meta{display:flex;gap:1.35rem;font-size:0.78rem;color:var(--gray-600);margin-bottom:1rem;flex-wrap:wrap;}

        /* ===== PAYMENT ===== */

        .pm-methods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.75rem;margin-bottom:1.5rem;}
        .pm-method{border:2px solid var(--gray-200);border-radius:12px;padding:1rem;cursor:pointer;transition:all 0.2s;text-align:center;background:white;}

        .perf-table tr:last-child td{border-bottom:none;}
        .perf-table tr:hover td{background:var(--gray-50);}

        /* ===== MISC ===== */
        .empty-state-wrap{text-align:center;padding:4rem 2rem;}
        .es-icon{font-size:3.5rem;margin-bottom:1rem;}
        .es-title{font-size:1.35rem;font-weight:800;margin-bottom:0.5rem;}

        .overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;padding:1.5rem;animation:fadeIn 0.2s ease;}

        .modal-wide{background:white;border-radius:20px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp2 0.3s ease;}

        .tag{display:inline-flex;align-items:center;gap:0.25rem;padding:0.15rem 0.55rem;border-radius:4px;font-size:0.72rem;font-weight:700;}
        .toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;}
        .toast{background:var(--black);color:white;padding:0.8rem 1.25rem;border-radius:10px;font-size:0.85rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.2);animation:toastIn 0.3s ease;display:flex;align-items:center;gap:0.6rem;}
        @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
        .toast.success{background:#065F46;border-left:3px solid var(--lime);}
        .toast.error{background:#991B1B;}

    </style>
</head>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ─── Error Boundary ──────────────────────────────────────────────────────────
    class DetailErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { error: null }; }
        static getDerivedStateFromError(error) { return { error }; }
        componentDidCatch(error, info) { console.error('[DetailPanel crash]', error, info); }
        render() {
            if (this.state.error) {
                return (
                    <div style={{padding:'2rem',textAlign:'center'}}>
                        <div style={{fontSize:'2.5rem',marginBottom:'1rem'}}>⚠️</div>
                        <div style={{fontWeight:700,marginBottom:'0.5rem',fontSize:'1.1rem'}}>Something went wrong loading this campaign</div>
                        <div style={{fontSize:'0.85rem',color:'#666',marginBottom:'1.25rem',fontFamily:'monospace',background:'#f5f5f5',padding:'0.5rem',borderRadius:6,maxWidth:400,margin:'0 auto 1.25rem',wordBreak:'break-all'}}>{this.state.error?.message}</div>
                        <button onClick={() => { this.setState({error:null}); this.props.onBack(); }}
                            style={{padding:'0.6rem 1.4rem',background:'#000',color:'#fff',border:'none',borderRadius:8,fontWeight:700,cursor:'pointer',fontSize:'0.9rem'}}>← Back to campaigns</button>
                    </div>

            }
            return this.props.children;
        }
    }

    // ─── Supabase ───────────────────────────────────────────────────────────────
    const SUPABASE_URL  = window.ENV_SUPABASE_URL  || 'YOUR_SUPABASE_URL';   // 🔑 Set in env-config.js
    const SUPABASE_ANON = window.ENV_SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY'; // 🔑 Set in env-config.js
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // ─── Static data ─────────────────────────────────────────────────────────────
    const CREATORS = [
        { id:1, name:'Emma Desjardins', country:'Toronto, ON', videos:6, rating:5.0, completion:100, price:249, bg:'#1a0a2e', bg2:'#2d1b69',
          bio:'Lifestyle & beauty creator based in Toronto with 5 years of UGC experience. Known for high hook rates and clean product showcases that convert on Meta and TikTok.',

          portfolio:[{label:'UGC',c1:'#1a0a2e',c2:'#2d1b69'},{label:'REEL',c1:'#2d1b69',c2:'#4a2a90'},{label:'AD',c1:'#0f0a2e',c2:'#1a0a4e'},{label:'HOOK',c1:'#3a1a6e',c2:'#2d1b69'}] },
        { id:2, name:'Jake Lau', country:'Vancouver, BC', videos:5, rating:4.9, completion:100, price:149, bg:'#0a1628', bg2:'#1e3a5f',
          bio:'Vancouver-based fitness and lifestyle creator. Strong organic reach on Instagram with a relatable, authentic style that resonates with health-conscious Canadians.',

    function App() {
        const [user,      setUser]     = useState(null);
        const [loading,   setLoading]  = useState(true);
        // views: landing | signup | onboarding | dashboard
        const [view,      setView]     = useState('landing');
        const [authModal, setAuthModal]= useState(null); // null | 'signup' | 'login'

        useEffect(() => {
            supabase.auth.getSession().then(async ({ data: { session } }) => {
                if (session?.user) {
                    setUser(session.user);
                    // Check DB for brand row — more reliable than localStorage
                    // (localStorage fails on new devices / incognito)
                    try {
                        const { data: brand } = await supabase
                            .from('brands')
                            .select('id, brand_name')
                            .eq('user_id', session.user.id)
                            .maybeSingle();
                        if (brand?.id) {
                            // Has a completed brand profile — go straight to dashboard
                            localStorage.setItem(`vy_onboarded_${session.user.id}`, 'true');
                            setView('dashboard');
                        } else {
                            setView('onboarding');
                        }
                    } catch(_) {
                        // No brand row yet — send to onboarding
                        setView('onboarding');
                    }
                } else {
                    setView('landing');
                }
                setLoading(false);
            });

            const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, session) => {
                if (session?.user) {
                    setUser(session.user);
                } else {
                    setUser(null);
                    setView('landing');
                }
            });
            return () => subscription.unsubscribe();
        }, []);

        if (loading) return <div className="app-loader"><div className="loader-ring"></div></div>;

        if (view === 'landing') return (
            <LandingPage
                onSignup={() => setView('signup')}
                onOpenAuth={(m) => setAuthModal(m)}
                authModal={authModal}
                setAuthModal={setAuthModal}
                setUser={setUser}
                setView={setView}
            />
        );
        if (view === 'signup')     return <SignupFlow setUser={setUser} setView={setView} />;
        if (view === 'onboarding') return <OnboardingFlow user={user} setView={setView} />;
        if (view === 'dashboard')  return <Dashboard user={user} setUser={setUser} setView={setView} />;
        return null;
    }

    // ─── Auth Modal (Login only — signup uses full flow) ──────────────────────────
    function AuthModal({ mode, onClose, setUser, setView, switchToSignup }) {
        const [email,    setEmail]    = useState('');
        const [password, setPassword] = useState('');
        const [loading,  setLoading]  = useState(false);
        const [error,    setError]    = useState('');
        const [forgotSent, setForgotSent] = useState(false);
        const [showForgot, setShowForgot] = useState(false);

        const handleOAuth = async (provider) => {
            const { error } = await supabase.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.origin } });
            if (error) setError(error.message);
        };

        const handleForgot = async () => {
            if (!email) { setError('Enter your email above first.'); return; }
            setLoading(true); setError('');
            try {
                await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
                setForgotSent(true);
            } catch(err) { setError(err.message); }
            finally { setLoading(false); }
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true); setError('');
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                setUser(data.user);
                // Check DB — don't trust localStorage (breaks on new devices)
                try {
                    const { data: brand } = await supabase
                        .from('brands')
                        .select('id, brand_name')
                        .eq('user_id', data.user.id)
                        .maybeSingle();
                    if (brand?.id) {
                        localStorage.setItem(`vy_onboarded_${data.user.id}`, 'true');
                        setView('dashboard');
                    } else {
                        setView('onboarding');
                    }
                } catch(_) {
                    setView('onboarding');
                }
                onClose();
            } catch (err) { setError(err.message); }
            finally { setLoading(false); }
        };

        return (
            <div className="overlay" onClick={onClose}>
                <div className="auth-card" onClick={e => e.stopPropagation()}>
                    <button className="auth-card-close" onClick={onClose}>×</button>
                    <div className="auth-title">Welcome back 👋</div>
                    {forgotSent && <div className="alert alert-ok">✅ Reset link sent — check your inbox.</div>}
                    {error && <div className="alert alert-err">{error}</div>}
                    <div className="oauth-row">
                        <button className="oauth-btn" onClick={() => handleOAuth('google')}><b>G</b> Google</button>

                        <div className="form-group">
                            <label className="form-label">Email</label>
                            <input type="email" className="form-input" placeholder="you@company.com" value={email} onChange={e=>setEmail(e.target.value)} required />
                        </div>
                        <div className="form-group">
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.4rem'}}>
                                <label className="form-label" style={{margin:0}}>Password</label>
                                <a href="#" style={{fontSize:'0.8rem',color:'var(--indigo)',fontWeight:600,textDecoration:'none'}} onClick={e=>{e.preventDefault();handleForgot();}}>
                                    Forgot password?
                                </a>
                            </div>
                            <input type="password" className="form-input" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} required />
                        </div>
                        <button type="submit" className="btn btn-black btn-full" disabled={loading} style={{marginTop:'0.5rem'}}>
                            {loading ? 'Signing in…' : 'Sign in →'}
                        </button>
                    </form>
                    <p style={{textAlign:'center',marginTop:'1.25rem',fontSize:'0.9rem',color:'var(--gray-600)'}}>
                        No account? <a href="#" style={{color:'var(--black)',fontWeight:700}} onClick={(e)=>{e.preventDefault();switchToSignup();}}>Sign up free</a>

                </div>
            </div>
        );

    // ─── Signup Flow (3 steps, then straight to onboarding) ───────────────────────
    function SignupFlow({ setUser, setView }) {
        const [step, setStep] = useState(1); // 1=company info, 2=credentials
        const [form, setForm] = useState({
            companyName:'', businessType:'', country:'Canada',
            jobRole:'', referralSource:'', email:'', password:'', confirmPassword:''
        });
        const [loading, setLoading] = useState(false);
        const [error,   setError]  = useState('');

        const set = (k,v) => setForm(f => ({...f,[k]:v}));

        const validateStep1 = () => {
            if (!form.companyName.trim()) return 'Company name is required.';
            if (!form.businessType) return 'Please select a business type.';
            if (!form.jobRole) return 'Please select your job role.';
            if (!form.referralSource) return 'Please tell us how you found Vyralist.';
            return null;
        };

        const validateStep2 = () => {
            if (!form.email.trim()) return 'Email is required.';
            if (form.password.length < 8) return 'Password must be at least 8 characters.';
            if (form.password !== form.confirmPassword) return 'Passwords do not match.';
            return null;
        };

        const next = () => {
            const err = validateStep1();
            if (err) { setError(err); return; }
            setError(''); setStep(2);
        };

        const submit = async (e) => {
            e.preventDefault();
            const err = validateStep2();
            if (err) { setError(err); return; }
            setLoading(true); setError('');
            try {
                const { data, error } = await supabase.auth.signUp({
                    email: form.email,
                    password: form.password,
                    options: {
                        data: {
                            company_name:    form.companyName,
                            business_type:   form.businessType,
                            job_role:        form.jobRole,
                            country:         form.country,
                            referral_source: form.referralSource,
                        },
                        emailRedirectTo: window.location.origin
                    }
                });
                if (error) throw error;

                // data.user exists but may be unconfirmed if email confirmation is ON.
                // We move to onboarding either way — brand row creation happens there
                // after we verify the session is real.
                const activeUser = data.session?.user || data.user;
                if (!activeUser) {
                    // Email confirmation required — tell user to check inbox
                    setError('');
                    setLoading(false);
                    // Show confirmation message instead
                    setStep(99); // special step to show "check your email"
                    return;
                }
                setUser(activeUser);
                setView('onboarding');
            } catch (err) {
                setError(err.message);
            } finally {
                setLoading(false);
            }
        };

        const pills = [1,2];

        // Email confirmation screen
        if (step === 99) {
            return (
                <div className="signup-wrap">
                    <div className="signup-card" style={{textAlign:'center'}}>
                        <span className="logo-text">vyralist</span>
                        <div style={{fontSize:'3rem',margin:'1.5rem 0'}}>📧</div>
                        <h2 style={{fontWeight:800,marginBottom:'0.75rem'}}>Check your email</h2>
                        <p style={{color:'var(--gray-600)',marginBottom:'1.5rem',lineHeight:1.6}}>
                            We sent a confirmation link to <strong>{form.email}</strong>.<br/>
                            Click the link in the email to activate your account, then come back and log in.
                        </p>
                        <button className="btn btn-black btn-full" onClick={() => setView('landing')}>Back to home</button>
                    </div>
                </div>
            );
        }

        return (
            <div className="signup-wrap">
                <div className="signup-card">
                    <span className="logo-text">vyralist</span>
                    <p className="sub">
                        {step === 1
                            ? "Let's set up your account. First, tell us about your company."
                            : "Almost there! Set up your login credentials."}
                    </p>

                    {error && <div className="alert alert-err">{error}</div>}

                    <div className="step-pills">
                        {pills.map(p => <div key={p} className={`step-pill ${p < step ? 'done' : p === step ? 'active' : ''}`}></div>)}
                    </div>

                    {step === 1 ? (
                        <>
                            <div className="form-group">
                                <label className="form-label">Company name <span className="req">*</span></label>
                                <input type="text" className="form-input" placeholder="Your company or agency" value={form.companyName} onChange={e=>set('companyName',e.target.value)} />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Business type <span className="req">*</span></label>
                                <select className="form-select" value={form.businessType} onChange={e=>set('businessType',e.target.value)}>
                                    <option value="">Select business type</option>
                                    {BIZ_TYPES.map(b => <option key={b}>{b}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label className="form-label">Country <span className="req">*</span></label>
                                <select className="form-select" value={form.country} onChange={e=>set('country',e.target.value)}>
                                    {COUNTRIES.map(c => <option key={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label className="form-label">Your role <span className="req">*</span></label>
                                <select className="form-select" value={form.jobRole} onChange={e=>set('jobRole',e.target.value)}>
                                    <option value="">Select your role</option>
                                    {JOB_ROLES.map(r => <option key={r}>{r}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label className="form-label">How did you find Vyralist? <span className="req">*</span></label>
                                <select className="form-select" value={form.referralSource} onChange={e=>set('referralSource',e.target.value)}>
                                    <option value="">Select option</option>
                                    {REFERRALS.map(r => <option key={r}>{r}</option>)}
                                </select>
                            </div>
                            <button className="btn btn-black btn-full" onClick={next} style={{marginTop:'0.5rem'}}>Continue →</button>

                    ) : (
                        <form onSubmit={submit}>

                                <label className="form-label">Work email <span className="req">*</span></label>
                                <input type="email" className="form-input" placeholder="you@company.com" value={form.email} onChange={e=>set('email',e.target.value)} required />

                                {loading ? 'Creating account…' : 'Create account & continue →'}
                            </button>
                            <p style={{textAlign:'center',marginTop:'1rem',fontSize:'0.85rem'}}>
                                <a href="#" style={{color:'var(--gray-600)'}} onClick={e=>{e.preventDefault();setStep(1);setError('');}}>← Back</a>
                            </p>
                        </form>
                    )}
                    <p style={{textAlign:'center',marginTop:'1.25rem',fontSize:'0.85rem',color:'var(--gray-600)'}}>
                        Already have an account? <a href="#" style={{color:'var(--black)',fontWeight:700}} onClick={e=>{e.preventDefault();setView('landing');}}>Log in</a>
                    </p>
                </div>
            </div>
        );
    }

    // ─── Onboarding (brand setup) ─────────────────────────────────────────────────
    function OnboardingFlow({ user, setView }) {
        const [step, setStep] = useState(1); // 1 = brand details
        const [form, setForm] = useState({ brandName:'', website:'', category:'', productType:'', adSpend:'' });
        const [loading, setLoading] = useState(false);
        const [error,   setError]  = useState('');

        const set = (k,v) => setForm(f => ({...f,[k]:v}));

        const submit = async (e) => {
            e.preventDefault();
            if (!form.brandName || !form.category || !form.productType || !form.adSpend) {
                setError('Please complete all fields.'); return;
            }
            if (!user?.id) {
                setError('Session expired. Please log in again.');
                setLoading(false);
                return;
            }
            setLoading(true); setError('');
            try {
                const brandData = {
                    company_name: user?.user_metadata?.company_name || form.brandName,
                    brand_name:   form.brandName,
                    website:      form.website || null,
                    category:     form.category,
                    product_type: form.productType,
                    ad_spend:     form.adSpend,
                    country:      user?.user_metadata?.country || 'Canada',
                    updated_at:   new Date().toISOString()
                };

                // First try UPDATE — works if a row already exists
                const { data: updated, error: updateErr } = await supabase
                    .from('brands')
                    .update(brandData)
                    .eq('user_id', user.id)
                    .select('id')
                    .maybeSingle();

                if (updateErr) throw updateErr;

                if (!updated) {
                    // No row exists — try INSERT
                    // This only works if email is confirmed (foreign key requirement)
                    const { error: insertErr } = await supabase
                        .from('brands')
                        .insert({ user_id: user.id, wallet_balance: 0, ...brandData });
                    if (insertErr) {
                        if (insertErr.message.includes('foreign key')) {
                            throw new Error('Please confirm your email first, then log in and complete your profile.');
                        }
                        throw insertErr;
                    }
                }

                if (user?.id) localStorage.setItem(`vy_onboarded_${user.id}`, 'true');
                setLoading(false);
                setView('dashboard');
            } catch(err) {
                setError(err.message || 'Something went wrong. Please try again.');
                setLoading(false);
            }
        };

        return (
            <div className="onboard-wrap">
                <div className="onboard-card">
                    <div className="onboard-header">
                        <span className="logo-text">vyralist</span>
                        <h2>Set up your brand 🚀</h2>
                        <p>Tell us about the brand you're running ads for. This helps us match you with the best creators.</p>
                    </div>
                    {error && <div className="alert alert-err">{error}</div>}
                    <div className="onboard-progress">
                        <div className="progress-seg filled"></div>
                        <div className="progress-seg filled"></div>
                        <div className="progress-seg filled"></div>
                    </div>
                    <form onSubmit={submit}>
                        <div className="form-group">
                            <label className="form-label">Brand name <span className="req">*</span></label>
                            <input type="text" className="form-input" placeholder="Enter brand name" value={form.brandName} onChange={e=>set('brandName',e.target.value)} />
                        </div>
                        <div className="form-group">
                            <label className="form-label">Website</label>
                            <input type="url" className="form-input" placeholder="https://www.brand.com" value={form.website} onChange={e=>set('website',e.target.value)} />
                        </div>
                        <div className="form-group">
                            <label className="form-label">Category <span className="req">*</span></label>
                            <select className="form-select" value={form.category} onChange={e=>set('category',e.target.value)}>
                                <option value="">Select category</option>
                                {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                            </select>
                        </div>
                        <div className="form-group">
                            <label className="form-label">Product type <span className="req">*</span></label>
                            <select className="form-select" value={form.productType} onChange={e=>set('productType',e.target.value)}>
                                <option value="">Select type</option>
                                {PROD_TYPES.map(t => <option key={t}>{t}</option>)}
                            </select>
                        </div>
                        <div className="form-group">
                            <label className="form-label">Monthly social ad spend <span className="req">*</span></label>
                            <select className="form-select" value={form.adSpend} onChange={e=>set('adSpend',e.target.value)}>
                                <option value="">Select range</option>
                                {AD_SPEND.map(a => <option key={a}>{a}</option>)}
                            </select>
                        </div>
                        <button type="submit" className="btn btn-lime btn-full" disabled={loading} style={{marginTop:'1rem'}}>
                            {loading ? 'Setting up your dashboard…' : 'Go to my dashboard →'}
                        </button>
                    </form>
                </div>
            </div>
        );
    }

            if (m < 1)  return 'Just now';
            if (m < 60) return `${m}m ago`;
            const h = Math.floor(m/60);
            if (h < 24) return `${h}h ago`;
            const d = Math.floor(h/24);
            if (d < 7)  return d === 1 ? 'Yesterday' : `${d}d ago`;
