                const { data: campData } = await supabase.from('campaigns').select('amount, budget').eq('id', campId).single();
                const campaignCost = campData?.amount || 0;

                if (currentBalance <= 0) {
                    addToast(`⚠️ Insufficient funds. Please top up your wallet before publishing.`, 'error');
                    setPayContext({ amount: `$500`, type: 'topup_required' });
                    setShowPayment(true);
                    return;
                }
                if (currentBalance < campaignCost) {
                    addToast(`⚠️ Insufficient funds. You need $${campaignCost.toLocaleString()} but only have $${currentBalance.toLocaleString()} in your wallet.`, 'error');
                    setPayContext({ amount: `$${campaignCost.toLocaleString()}`, type: 'topup_required' });
                    setShowPayment(true);
                    return;
                }

                const { error } = await supabase.from('campaigns').update({
                    status: 'published',
                    published_at: new Date().toISOString(),
                    requires_shipping: opts.requiresShipping ?? false,
                    reward_cash: opts.rewardCash || null,
                    reward_product: opts.rewardProduct || false,
                    is_active: true,
                    updated_at: new Date().toISOString(),
                }).eq('id', campId);
                if (error) throw error;

                // Deduct campaign cost from wallet
                if (campaignCost > 0) {
                    const newBal = Math.max(0, currentBalance - campaignCost);
                    await supabase.from('brands').update({ wallet_balance: newBal }).eq('user_id', user.id);
                    setWalletBalance(newBal);
                }

                // Notify brand that campaign is live
                await supabase.from('notifications').insert([{
                    user_id: user.id, type: 'campaign',
                    title: '🚀 Campaign published!',
                    body: 'Your campaign is live on the marketplace. Creators can now apply.',
                    read: false,
                }]).then(() => {}).catch(() => {});

                addToast('🚀 Campaign published! Creators can now apply.');
                await loadCampaigns();
            } catch(e) {
                addToast('❌ Publish failed: ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Load applications for a campaign
        // ─────────────────────────────────────────────────────────────────────────
        const loadApplications = async (campId) => {
            setLoadingApps(true);
            try {
                const { data, error } = await supabase
                    .from('applications')
                    .select('*, profiles:user_id(id, first_name, last_name, photo_url, tiktok_handle, instagram_handle)')
                    .eq('campaign_id', campId)
                    .neq('status', 'revoked')
                    .order('created_at', { ascending: false });
                if (error) throw error;
                setApplications(data || []);
            } catch(e) {
                addToast('❌ Could not load applications', 'error');
            } finally {
                setLoadingApps(false);
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Accept application → create task → notify creator
        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Accept application → create task → notify creator
        // FIX: Adds creator_name to task row, uses correct filming deadlines,
        //      syncs both applications.status AND tasks.state in one operation
        // ─────────────────────────────────────────────────────────────────────────
        const acceptApplication = async (app, camp) => {
            try {
                const shipping = camp._raw?.requires_shipping ?? false;
                const deadlineHrs = shipping ? 5 * 24 : 24;
                const deadline = new Date(Date.now() + deadlineHrs * 3600 * 1000).toISOString();

                // Resolve creator name for task row
                let creatorName = app.creator_name || null;
                if (!creatorName) {
                    try {
                        const { data: prof } = await supabase
                            .from('profiles').select('first_name, last_name').eq('id', app.user_id).single();
                        creatorName = [prof?.first_name, prof?.last_name].filter(Boolean).join(' ') || null;
                    } catch(_) {}
                }

                // 1. Mark this application accepted
                await supabase.from('applications').update({
                    status: 'accepted',
                    updated_at: new Date().toISOString(),
                }).eq('id', app.id);

                // 2. Create task — state machine starts here
                const taskState = shipping ? 'selected' : 'selected_digital';
                const { error: taskErr } = await supabase.from('tasks').upsert({
                    user_id:          app.user_id,
                    campaign_id:      app.campaign_id,
                    application_id:   app.id,
                    brand_id:         brandId || null,
                    creator_name:     creatorName,
                    state:            taskState,
                    requires_shipping: shipping,
                    filming_deadline:  shipping ? null : deadline,
                    shipping_deadline: shipping ? new Date(Date.now() + 5 * 24 * 3600 * 1000).toISOString() : null,
                    created_at:        new Date().toISOString(),
                    updated_at:        new Date().toISOString(),
                }, { onConflict: 'application_id' });
                if (taskErr) throw taskErr;

                // 3. Notify creator with full context
                const campTitle = camp.title || camp._raw?.title || 'your campaign';
                await supabase.from('notifications').insert({
                    user_id: app.user_id,
                    type: 'task',
                    title: '🎉 You got the job!',
                    body: `${campTitle} — You've been selected! ${shipping ? 'Your product will be shipped soon. Confirm receipt when it arrives.' : 'You have 24 hours to film and submit your video.'}`,
                    read: false,
                    created_at: new Date().toISOString(),
                });

                // 4. Update campaign to in-progress with creator name
                await supabase.from('campaigns').update({
                    status:      'in-progress',
                    creator_id:  app.user_id,
                    updated_at:  new Date().toISOString(),
                }).eq('id', camp.id);

                // 5. Reject all other PENDING applicants (not already accepted/rejected)
                await supabase.from('applications').update({
                    status: 'rejected',
                    updated_at: new Date().toISOString(),
                }).eq('campaign_id', app.campaign_id).eq('status', 'pending').neq('id', app.id);

                addToast(`✅ ${creatorName || 'Creator'} hired! They've been notified.`);
                await loadCampaigns();
                await loadApplications(app.campaign_id);
                setDetailCamp(prev => prev ? {...prev, status: 'in-progress'} : prev);
            } catch(e) {
                addToast('❌ Could not accept: ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Reject application → notify creator
        // ─────────────────────────────────────────────────────────────────────────
        const rejectApplication = async (app) => {
            try {
                await supabase.from('applications').update({
                    status: 'rejected',
                    updated_at: new Date().toISOString(),
                }).eq('id', app.id);

                await supabase.from('notifications').insert({
                    user_id: app.user_id,
                    type: 'application',
                    title: 'Application update',
                    body: 'Your application was not selected this time. Keep applying — more campaigns are posted daily!',
                    read: false,
                    created_at: new Date().toISOString(),
                });

                setApplications(prev => prev.filter(a => a.id !== app.id));
                addToast('Application declined.');
            } catch(e) {
                addToast('❌ ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Mark product as shipped → notify creator
        // FIX: Also syncs applications.status to 'confirm' so creator app shows correct state
        // ─────────────────────────────────────────────────────────────────────────
        const markProductShipped = async (camp, trackingInfo) => {
            try {
                const { data: tasks, error: taskErr } = await supabase
                    .from('tasks')
                    .select('id, user_id, application_id')
                    .eq('campaign_id', camp.id)
                    .in('state', ['selected', 'confirm', 'selected_digital', 'shipped'])
                    .limit(1);
                if (taskErr) throw taskErr;
                if (!tasks?.length) throw new Error('No active task found for this campaign.');

                const task = tasks[0];

                // Update task state to 'confirm' (creator needs to acknowledge receipt)
                await supabase.from('tasks').update({
                    state: 'confirm',
                    shipping_deadline: new Date(Date.now() + 5 * 24 * 3600 * 1000).toISOString(),
                    tracking_number: trackingInfo.tracking || null,
                    carrier: trackingInfo.carrier || null,
                    updated_at: new Date().toISOString(),
                }).eq('id', task.id);

                // Sync application status to keep both tables in lockstep
                if (task.application_id) {
                    await supabase.from('applications').update({
                        status: 'confirm',
                        updated_at: new Date().toISOString(),
                    }).eq('id', task.application_id);
                }

                // Notify creator with full tracking info
                const trackMsg = trackingInfo.tracking
                    ? ` Tracking #: ${trackingInfo.carrier ? trackingInfo.carrier + ' ' : ''}${trackingInfo.tracking}.`
                    : '';
                await supabase.from('notifications').insert({
                    user_id: task.user_id,
                    type: 'task',
                    title: '📦 Package on the way!',
                    body: `Your product for "${camp.title}" has been shipped.${trackMsg} Expected in ~5 days. Tap "I received my product" when it arrives to start your filming window.`,
                    read: false,
                    created_at: new Date().toISOString(),
                });

                addToast('📦 Shipping confirmed! Creator has been notified.');
                await loadCampaigns();
                // Optimistic update so timeline and video delivery card refresh immediately
                setDetailCamp(prev => prev ? {
                    ...prev,
                    _raw: {
                        ...prev._raw,
                        task_state: 'confirm',
                        shipping_deadline: new Date(Date.now() + 5 * 24 * 3600 * 1000).toISOString()
                    }
                } : prev);
                setShipModal(null);
            } catch(e) {
                addToast('❌ ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Approve submitted video → create payout → notify creator
        // FIX: Also syncs application.status, adds creator_name to payout row,
        //      deducts amount from brand wallet, and handles already-approved tasks
        // ─────────────────────────────────────────────────────────────────────────
        const approveVideo = async (camp) => {
            try {
                const raw = camp._raw || {};

                // 1. Update campaign status
                await supabase.from('campaigns').update({
                    status: 'approved',
                    approved_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                }).eq('id', camp.id);

                // 2. Find the submitted task (could be 'submitted' or 'revision' state)
                const { data: tasks } = await supabase
                    .from('tasks')
                    .select('id, user_id, campaign_id, application_id, revision_count')
                    .eq('campaign_id', camp.id)
                    .in('state', ['submitted', 'revision'])
                    .order('updated_at', { ascending: false })
                    .limit(1);

                if (tasks?.length) {
                    const task = tasks[0];

                    // 2a. Update task state to approved
                    await supabase.from('tasks').update({
                        state: 'approved',
                        approved_at: new Date().toISOString(),
                        updated_at: new Date().toISOString(),
                    }).eq('id', task.id);

                    // 2b. FIX: Sync application status so both tables stay consistent
                    if (task.application_id) {
                        await supabase.from('applications').update({
                            status: 'completed',
                            updated_at: new Date().toISOString(),
                        }).eq('id', task.application_id);
                    }

                    // 3. FIX: Resolve creator name for payout row
                    let creatorName = null;
                    let creatorPaypalEmail = null;
                    try {
                        const { data: profile } = await supabase
                            .from('profiles')
                            .select('first_name, last_name, paypal_email')
                            .eq('id', task.user_id)
                            .single();
                        creatorName = [profile?.first_name, profile?.last_name].filter(Boolean).join(' ') || null;
                        creatorPaypalEmail = profile?.paypal_email || null;
                    } catch(_) {}

                    // 4. Create payout row for creator (70% of campaign amount)
                    const earnAmt = parseFloat(raw.amount || raw.reward_cash || 0) * 0.70;
                    // FIX: Only create payout if not already created
                    const { data: existingPayout } = await supabase
                        .from('payouts').select('id').eq('task_id', task.id).maybeSingle();
                    if (!existingPayout && earnAmt > 0) {
                        await supabase.from('payouts').insert({
                            user_id: task.user_id,
                            task_id: task.id,
                            campaign_id: camp.id,
                            campaign_title: camp.title,
                            amount: earnAmt,
                            amount_usd: earnAmt,
                            creator_name: creatorName,
                            paypal_email: creatorPaypalEmail,
                            status: 'pending',
                            type: 'campaign',
                            created_at: new Date().toISOString(),
                        });
                    }

                    // 5. FIX: Deduct campaign cost from brand wallet
                    const brandCost = parseFloat(raw.amount || raw.reward_cash || 0);
                    if (brandCost > 0) {
                        try {
                            const { data: brandRow } = await supabase
                                .from('brands').select('wallet_balance').eq('user_id', user.id).single();
                            if (brandRow) {
                                const newBal = Math.max(0, (brandRow.wallet_balance || 0) - brandCost);
                                await supabase.from('brands').update({ wallet_balance: newBal }).eq('user_id', user.id);
                                setWalletBalance(newBal);
                            }
                        } catch(_) {}
                    }

                    // 6. Notify creator
                    await supabase.from('notifications').insert({
                        user_id: task.user_id,
                        type: 'payout',
                        title: '✅ Video approved!',
                        body: `"${camp.title}" was approved! $${earnAmt.toFixed(0)} has been added to your earnings — pending payout on the next cycle.`,
                        read: false,
                        created_at: new Date().toISOString(),
                    });
                }

                addToast('✅ Video approved! Creator earnings queued for payout.');
                setVideoPreviewUrl(null);
                await loadCampaigns();
                if (detailCamp?.id === camp.id) setDetailCamp(prev => ({...prev, status: 'approved'}));
            } catch(e) {
                addToast('❌ Approve failed: ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Request revision → notify creator (max 1 revision)
        // FIX: Syncs applications.status, resets videoPreviewUrl, updates detailCamp
        // ─────────────────────────────────────────────────────────────────────────
        const requestRevision = async (camp, note) => {
            try {
                const { data: tasks } = await supabase
                    .from('tasks')
                    .select('id, user_id, revision_count, application_id')
                    .eq('campaign_id', camp.id)
                    .in('state', ['submitted', 'revision'])
                    .order('updated_at', { ascending: false })
                    .limit(1);

                if (!tasks?.length) throw new Error('No submitted task found. The creator may not have uploaded yet.');
                const task = tasks[0];

                if ((task.revision_count || 0) >= 1) {
                    addToast('⚠️ Only 1 revision is allowed per job. You must approve or the video auto-approves after 24 hrs.', 'error');
                    return;
                }

                // Update task to revision state with 24h deadline
                const revDeadline = new Date(Date.now() + 24 * 3600 * 1000).toISOString();
                await supabase.from('tasks').update({
                    state: 'revision',
                    revision_deadline: revDeadline,
                    revision_count: (task.revision_count || 0) + 1,
                    revision_note: note || null,
                    updated_at: new Date().toISOString(),
                }).eq('id', task.id);

                // FIX: Sync application status
                if (task.application_id) {
                    await supabase.from('applications').update({
                        status: 'revision',
                        revision_note: note || null,
                        updated_at: new Date().toISOString(),
                    }).eq('id', task.application_id);
                }

                // Update campaign status
                await supabase.from('campaigns').update({
                    status: 'revision',
                    updated_at: new Date().toISOString(),
                }).eq('id', camp.id);

                // Notify creator with the revision note prominently
                await supabase.from('notifications').insert({
                    user_id: task.user_id,
                    type: 'task',
                    title: '🔄 Revision requested',
                    body: `The brand has requested a revision for "${camp.title}". ${note ? `Feedback: "${note}" ` : ''}You have 24 hours to re-shoot and re-submit.`,
                    read: false,
                    created_at: new Date().toISOString(),
                });

                addToast('🔄 Revision requested. Creator has 24 hours to re-shoot.');
                setVideoPreviewUrl(null);
                setRevisionModal(null);
                await loadCampaigns();
                if (detailCamp?.id === camp.id) setDetailCamp(prev => ({...prev, status: 'revision'}));
            } catch(e) {
                addToast('❌ ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Load signed video URL for brand review
        // Uses video_path (correct column), handles submitted/approved/revision states,
        // passes through external CDN URLs, and caches signed URLs for 55 min
        // ─────────────────────────────────────────────────────────────────────────
        const _videoUrlCache = React.useRef({});
        const loadVideoForReview = async (camp) => {
            try {
                setVideoPreviewUrl(null);
                const { data: tasks } = await supabase
                    .from('tasks')
                    .select('video_path, state, updated_at')
                    .eq('campaign_id', camp._raw?.id || camp.id)
                    .in('state', ['submitted', 'approved', 'auto_approved', 'revision'])
                    .not('video_path', 'is', null)
                    .order('updated_at', { ascending: false })
                    .limit(1);

                const path = tasks?.[0]?.video_path;
                if (!path) { addToast('No submitted video found yet.', 'error'); return; }

                // If already a full URL (e.g. external CDN), use directly
                if (path.startsWith('http')) { setVideoPreviewUrl(path); return; }

                // Check 55-min cache before hitting Supabase Storage
                const cached = _videoUrlCache.current[path];
                if (cached && cached.expiresAt > Date.now()) { setVideoPreviewUrl(cached.url); return; }

                // Generate 1-hour signed URL from Supabase Storage
                const { data, error } = await supabase.storage
                    .from('videos')
                    .createSignedUrl(path, 3600);
                if (error || !data?.signedUrl) throw new Error(error?.message || 'Could not generate video URL');
                _videoUrlCache.current[path] = { url: data.signedUrl, expiresAt: Date.now() + 55 * 60 * 1000 };
                setVideoPreviewUrl(data.signedUrl);
            } catch(e) {
                addToast('❌ Could not load video: ' + e.message, 'error');
            }
        };

        // Subscribe to applications realtime for the brand
        // Subscribe to realtime events: new applications, campaign status changes, task submissions
        const subscribeApplications = async (bid) => {
            if (!bid) return;

            // New application submitted by a creator
            supabase.channel('rt-applications-' + bid)
                .on('postgres_changes', {
                    event: 'INSERT', schema: 'public', table: 'applications',
                    filter: `brand_id=eq.${bid}`,
                }, async (payload) => {
                    // Get creator name from profiles
                    const { data: profile } = await supabase
                        .from('profiles').select('first_name, last_name').eq('id', payload.new.user_id).single();
                    const name = profile ? `${profile.first_name || ''} ${profile.last_name || ''}`.trim() : 'A creator';
                    addToast(`📬 New application from ${name}!`);
                    setNotifications(prev => [{
                        id: Date.now(),
                        type: 'application',
                        title: `📬 New application`,
                        subtitle: `${name} applied to one of your campaigns`,
                        icon: '📬',
                        read: false,
                        created_at: new Date().toISOString(),
                    }, ...prev]);
                    // Refresh applications if that campaign is currently open
                    if (appCampaignId === payload.new.campaign_id) {
                        loadApplications(payload.new.campaign_id);
                    }
                    // Always refresh campaigns to update application count badges
                    loadCampaigns();
                })
                .subscribe();

            // Subscribe to campaigns owned by this brand — catches video submission (status→delivered)
            supabase.channel('rt-campaigns-status-' + bid)
                .on('postgres_changes', {
                    event: 'UPDATE', schema: 'public', table: 'campaigns',
                    filter: `user_id=eq.${user.id}`,
                }, (payload) => {
                    const newStatus = payload.new?.status;
                    const oldStatus = payload.old?.status;
                    if (newStatus === oldStatus) return;

                    if (newStatus === 'delivered') {
                        addToast('🎬 Video submitted — review within 24 hrs!');
                        setNotifications(prev => [{
                            id: Date.now(), type: 'task',
                            title: '🎬 Video ready for review',
                            body: `A creator has submitted their video. You have 24 hours to approve or request 1 revision.`,
                            read: false, created_at: new Date().toISOString(),
                        }, ...prev]);
                    } else if (newStatus === 'revision') {
                        addToast('🔄 Revision re-submitted — ready to review.');
                    }
                    loadCampaigns();
                })
                .subscribe();

            // Subscribe to task state changes so brand UI stays live
            supabase.channel('rt-tasks-brand-' + bid)
                .on('postgres_changes', {
                    event: 'UPDATE', schema: 'public', table: 'tasks',
                }, (payload) => {
                    if (payload.new?.state === 'submitted') {
                        addToast('🎬 A creator has submitted their video — ready for review!');
                        loadCampaigns();
                    }
                })
                .subscribe();
        };

        const addCampaign = async (briefData) => {
            try {
                const bid = brandId || await loadBrand();
                if (!bid) throw new Error('Brand profile not found');
                const creator = briefData.creator;
                // Parse new budget format: array of "tier::duration" strings
                const selected = Array.isArray(briefData.budget) ? briefData.budget : (briefData.budget ? [briefData.budget] : []);
                const tierPrices = { basic:{15:99,30:139,60:169}, premium:{15:149,30:189,60:219} };
                const parseKey = (k) => { const pts = k.split('::'); return {tier:pts[0], dur:Number(pts[1]), qty:Number(pts[2])||1}; };
                const baseTotal = selected.reduce((acc, k) => {
                    const p = parseKey(k);
                    return acc + (tierPrices[p.tier]?.[p.dur] || 139) * p.qty;
                }, 0) || 139;
                const totalVideos = selected.reduce((acc,k) => acc + parseKey(k).qty, 0) || 1;
                const editingQty = Number(briefData._editingAddon) || 0;
                const editingAddon = editingQty * 65;
                const amount = baseTotal + editingAddon;
                const selLabels = selected.map(k => { const p=parseKey(k); return `${p.tier==='premium'?'Premium':'Basic'} ${p.dur}s ×${p.qty}`; });
                const budgetLabel = `$${baseTotal + editingAddon} — ${selLabels.join(', ')}${editingQty > 0 ? ` + Editing ×${editingQty}` : ''}`;
                const isPremium = selected.some(k => parseKey(k).tier === 'premium');
                const deadline = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                const isPublishMode = briefData.publishToMarketplace;
                const { data, error } = await supabase.from('campaigns').insert([{
                    brand_id:          bid,
                    user_id:           user.id,
                    creator_id:        creator?.id || null,
                    product_name:      briefData.productName || 'Campaign',
                    title:             briefData.productName || 'Campaign',
                    highlights:        briefData.highlights || '',
                    description:       briefData.highlights || '',
                    content_type:      briefData.contentType || '',
                    budget:            budgetLabel,
                    duration:          briefData.duration || '30 seconds',
                    tier:              isPremium ? 'premium' : 'standard',
                    amount:            amount,
                    requires_shipping: briefData.requiresShipping ?? false,
                    reward_cash:       amount * 0.70,
                    reward_product:    briefData.requiresShipping ?? false,
                    brand_name:        displayName,
                    emoji:             '🎬',
                    status:            'pending',
                    published_at:      null,
                    deadline:          deadline,
                    // Extended brief fields from 5-step form
                    product_url:       briefData.productUrl || null,
                    product_category:  briefData.productCategory || null,
                    reference_urls:    briefData.referenceUrls || null,
                    script_notes:      briefData.scriptNotes || null,
                    scenario:          briefData.scriptNotes || null,
                    platforms:         briefData.platforms?.length ? briefData.platforms : null,
                    min_followers:     briefData.minFollowers || null,
                    creator_gender:    briefData.creatorGender?.length ? briefData.creatorGender : null,
                    creator_age:       briefData.creatorAge?.length ? briefData.creatorAge : null,
                    creator_ethnicity: briefData.creatorEthnicity?.length ? briefData.creatorEthnicity : null,
                    creator_language:  briefData.creatorLanguage?.length ? briefData.creatorLanguage : null,
                    creator_niche:     briefData.creatorNiche?.length ? briefData.creatorNiche : null,
                }]).select().single();
                if (error) throw error;
                if (!isPublishMode && creator?.id && bid) {
                    const { error: convErr } = await supabase.from('conversations').upsert([{
                        brand_id:        bid,
                        creator_id:      creator.id,
                        campaign_id:     data.id,
                        last_message:    `Brief sent for "${briefData.productName}"`,
                        last_message_at: new Date().toISOString(),
                        unread_count:    0,
                    }], { onConflict: 'brand_id,creator_id' });
                    if (!convErr) loadConversations(bid);
                }

                if (isPublishMode) {
                    // Run balance check — publishCampaign will show error + payment modal if insufficient
                    await publishCampaign(data.id, {
                        requiresShipping: briefData.requiresShipping ?? false,
                        rewardCash: amount * 0.70,
                        rewardProduct: briefData.requiresShipping ?? false,
                    });
                } else {
                    await supabase.from('notifications').insert([{
                        user_id: user.id, type: 'campaign',
                        title: '📋 Brief submitted!',
                        body: `Brief for "${briefData.productName}" sent to ${creator?.name || 'a creator'}.`,
                        read: false,
                    }]);
                    addToast('✅ Brief submitted! Campaign created.');
                }
                await loadCampaigns();
                setActiveNav('campaigns');
            } catch(e) {
                addToast(`❌ Failed to submit brief: ${e.message}`, 'error');
                throw e; // re-throw so BriefModal knows it failed
            }
        };

        const sendMessage = async (convId) => {
            const text = (chatInputs[convId] || '').trim();
            if (!text) return;
            // Optimistic UI — clear input and append message immediately
            setChatInputs(prev => ({ ...prev, [convId]: '' }));
            const optimisticMsg = { from: 'brand', text, time: 'Just now' };
            setMessages(prev => ({
                ...prev,
                [convId]: [...(prev[convId] || []), optimisticMsg]
            }));
            // Update sidebar preview optimistically
            setConversations(cs => cs.map(c => c.id === convId
                ? { ...c, preview: text, time: 'Just now' } : c));
            try {
                const { error } = await supabase.from('messages').insert([{
                    conversation_id: convId,
                    sender_type:     'brand',
                    sender_id:       user.id,
                    message_text:    text,
                }]);
                if (error) throw error;
                // The DB trigger auto-updates conversations.last_message — no need to reload all
            } catch(e) {
                // Revert optimistic message on failure
                setMessages(prev => ({
                    ...prev,
                    [convId]: (prev[convId] || []).filter(m => m !== optimisticMsg)
                }));
                setChatInputs(prev => ({ ...prev, [convId]: text }));
                addToast('❌ Message failed to send', 'error');
            }
        };

        const markNotifRead = async (id) => {
            setNotifications(prev => prev.map(n => n.id === id ? { ...n, read: true } : n));
            try {
                await supabase.from('notifications').update({ read: true }).eq('id', id);
            } catch(e) { /* silent */ }
        };

        const markAllNotifsRead = async () => {
            setNotifications(prev => prev.map(n => ({ ...n, read: true })));

                await supabase.from('notifications').update({ read: true }).eq('user_id', user.id);
            } catch(e) { /* silent */ }
        };

        const saveProfile = async () => {
            try {

                const { error: brandErr } = await supabase.from('brands').update({
                    company_name: profileForm.name,
                    website:      profileForm.website,
                    country:      profileForm.country,
                    updated_at:   new Date().toISOString(),
                }).eq('user_id', user.id);

        const loadWalletBalance = async () => {

                const { data, error } = await supabase
                    .from('brands')
                    .select('wallet_balance')
                    .eq('user_id', user.id)
                    .maybeSingle();
                if (error) throw error;

                setWalletBalance(bal);

        // ── Payment processing (Credit Card / Interac / Wire) ──
        // FIX: Added retry logic, proper error surfaces, and wallet_transactions logging
        const processPayment = async (amount, method) => {
            let retries = 0;
            const MAX_RETRIES = 2;
            const attempt = async () => {
                try {
                    const bid = brandId || await loadBrand();
                    if (!bid) throw new Error('Brand profile not found. Please refresh and try again.');

                    const ref = 'VYR' + Date.now().toString().slice(-8).toUpperCase();

                    if (method === 'card') {
                        // Card payment: log as pending — Stripe webhook credits wallet
                        await supabase.from('wallet_transactions').insert([{
                            brand_id:       bid,
                            user_id:        user.id,
                            type:           'deposit',
                            amount:         amount,
                            method:         'card',
                            status:         'pending',
                            reference:      ref,
                            note:           'Wallet top-up via Credit Card',
                            created_at:     new Date().toISOString(),
                        }]).then(()=>{}).catch(()=>{
                            // Fallback to transactions table if wallet_transactions doesn't exist
                            return supabase.from('transactions').insert([{
                                brand_id: bid, type: 'deposit', amount,
                                payment_method: 'card', status: 'pending', reference: ref,
                                description: 'Wallet top-up via Credit Card',
                            }]);
                        });
                        addToast('✅ Payment processing — wallet will update shortly.');

                    } else if (method === 'interac') {
                        await supabase.from('wallet_transactions').insert([{
                            brand_id: bid, user_id: user.id, type: 'deposit', amount,
                            method: 'interac', status: 'pending', reference: ref,
                            note: 'Interac e-Transfer — pending admin confirmation',
                            created_at: new Date().toISOString(),
                        }]).then(()=>{}).catch(()=>{
                            return supabase.from('transactions').insert([{
                                brand_id: bid, type: 'deposit', amount,
                                payment_method: 'interac', status: 'pending', reference: ref,
                                description: 'Interac e-Transfer — pending confirmation',
                            }]);
                        });
                        addToast(`🍁 Transfer noted! Reference: ${ref}. Wallet credited in 1–3 hrs once received.`);

                    } else if (method === 'wire') {
                        await supabase.from('wallet_transactions').insert([{
                            brand_id: bid, user_id: user.id, type: 'deposit', amount,
                            method: 'wire', status: 'pending', reference: ref,
                            note: 'Wire transfer — pending manual confirmation',
                            created_at: new Date().toISOString(),
                        }]).then(()=>{}).catch(()=>{
                            return supabase.from('transactions').insert([{
                                brand_id: bid, type: 'deposit', amount,
                                payment_method: 'wire', status: 'pending',
                                description: 'Wire transfer — pending manual confirmation',
                            }]);
                        });
                        addToast('🏦 Wire details saved. Wallet credited within 1–2 business days.');
                    }

                } catch(e) {
                    if (retries < MAX_RETRIES) {
                        retries++;
                        await new Promise(r => setTimeout(r, 1000 * retries));
                        return attempt();
                    }
                    addToast(`❌ ${e.message || 'Payment failed — please try again'}`, 'error');
                    throw e;
                }
            };
            return attempt();
        };

                await supabase.from('notifications').insert([{

            const sq = searchQ.toLowerCase();
            return base.filter(c => {
                if (sq && !c.name.toLowerCase().includes(sq) && !c.country.toLowerCase().includes(sq)) return false;
                if (filterCountry && c.country !== filterCountry) return false;
                if (filterMinRating && (!c.rating || c.rating < parseFloat(filterMinRating))) return false;
                if (c.price > filterMaxPrice) return false;
                return true;

                if (sortBy === 'rating') return (b.rating||0) - (a.rating||0);

                if (sortBy === 'price-desc') return b.price - a.price;

        return (

                                My brands

    // ─── Creator Modal ────────────────────────────────────────────────────────────
    function CreatorModal({ creator, onClose, onInvite }) {
        const [tab, setTab] = useState('overview');
        const [playingIdx, setPlayingIdx] = useState(null);
        // Use static per-creator metrics, not random
        const roas  = creator.roas;
        const ctr   = creator.ctr;
        const hook  = creator.hook;
        const reviews = creator.reviews || 0;

        // Build portfolio video list — resolve storage paths to public URLs
        const [portfolioVideos, setPortfolioVideos] = React.useState([]);
        React.useEffect(() => {
            const sb = window._supabase;

            const resolveUrl = (path) => {
                if (!path) return null;
                if (path.startsWith('http')) return path;
                if (!sb) return path;
                // Try 'videos' bucket first, then 'portfolio' bucket
                try {
                    const { data } = sb.storage.from('videos').getPublicUrl(path);
                    if (data?.publicUrl) return data.publicUrl;
                } catch(e) {}
                try {
                    const { data } = sb.storage.from('portfolio').getPublicUrl(path);
                    if (data?.publicUrl) return data.publicUrl;
                } catch(e) {}
                return path;
            };

            const buildVideos = (pitchUrl, extraPaths) => {
                const videos = [];
                if (pitchUrl) {
                    videos.push({ label: 'Pitch', url: pitchUrl, isApproved: true });
                }
                const extras = Array.isArray(extraPaths) ? extraPaths : [];
                for (let i = 0; i < extras.length; i++) {
                    const url = resolveUrl(extras[i]);
                    if (url) videos.push({ label: 'Example #' + (i + 1), url, isApproved: false });
                }
                return videos;
            };

            // Always do a fresh DB fetch — select * so we catch whatever column the Creator app writes to
            const fetchFresh = async () => {
                if (sb && creator.id) {
                    try {
                        const { data } = await sb
                            .from('profiles')
                            .select('*')
                            .eq('id', creator.id)
                            .single();
                        if (data) {
                            const pitchUrl = (data.pitch_status === 'approved' && data.pitch_video_url)
                                ? data.pitch_video_url
                                : creator.pitch_video_url;

                            // Collect example video paths/URLs from every array column that could hold them.
                            // The Creator app may write to extra_video_paths, example_video_paths,
                            // example_video_urls, pitch_video_examples, portfolio_video_urls, or similar.
                            let extraPaths = [];

                            // Priority: known column names for example videos
                            const candidateColumns = [
                                'extra_video_paths',
                                'example_video_paths',
                                'example_video_urls',
                                'pitch_video_examples',
                                'portfolio_video_urls',
                                'portfolio_videos',
                                'video_examples',
                            ];
                            for (const col of candidateColumns) {
                                if (Array.isArray(data[col])) {
                                    const valid = data[col].filter(v => !!v);
                                    if (valid.length > 0) {
                                        extraPaths = valid;
                                        break;
                                    }
                                }
                            }

                            // Fallback: scan ALL array-of-strings fields that look like video URLs/paths
                            if (extraPaths.length === 0) {
                                for (const key of Object.keys(data)) {
                                    if (key === 'pitch_video_url') continue; // already handled as pitch
                                    const val = data[key];
                                    if (Array.isArray(val) && val.length > 0 &&
                                        typeof val[0] === 'string' &&
                                        (val[0].includes('video') || val[0].includes('.mp4') ||
                                         val[0].includes('supabase') || val[0].startsWith('http'))) {
                                        extraPaths = val;
                                        break;
                                    }
                                }
                            }

                            setPortfolioVideos(buildVideos(pitchUrl, extraPaths));
                            return;
                        }
                    } catch(e) {}
                }
                // Fallback: use data already on creator object
                setPortfolioVideos(buildVideos(creator.pitch_video_url, creator.extra_video_paths));
            };

            fetchFresh();
        }, [creator.id, creator.pitch_video_url, JSON.stringify(creator.extra_video_paths)]);

        return (
            <div className="overlay" onClick={onClose}>
                <div className="modal-sheet" onClick={e => e.stopPropagation()}>
                    <div className="modal-hdr">
                        <div className="modal-creator-info">
                            <div className="modal-avatar">{creator.name.charAt(0)}</div>
                            <div>
                                <div className="modal-name">{creator.name}</div>
                                <div className="modal-rating">
                                    {'⭐'.repeat(creator.rating ? Math.round(creator.rating) : 0)}
                                    <span style={{color:'var(--black)'}}>{creator.rating || 'New'}</span>
                                    {reviews > 0 && <span style={{color:'var(--gray-400)',fontWeight:400}}>({reviews} reviews)</span>}
                                    {creator.premium && <span style={{background:'var(--indigo)',color:'white',padding:'0.15rem 0.5rem',borderRadius:4,fontSize:'0.72rem',fontWeight:700,marginLeft:'0.5rem'}}>Premium</span>}
                                </div>
                            </div>
                        </div>
                        <button className="modal-close" onClick={onClose}>×</button>
                    </div>

                    <div className="modal-tabs">
                        {['overview','portfolio','ad-performance'].map(t => (
                            <div key={t} className={`modal-tab ${tab===t?'active':''}`} onClick={() => setTab(t)}>
                                {t==='overview'?'Overview':t==='portfolio'?'Portfolio':'Ad performance'}
                            </div>
                        ))}
                    </div>

                    <div className="modal-body">
                        {tab === 'overview' && (
                            <>
                                <div style={{background:'var(--gray-50)',borderRadius:12,padding:'1rem 1.25rem',marginBottom:'1.25rem',fontSize:'0.9rem',color:'var(--gray-600)',lineHeight:1.6}}>
                                    {creator.bio || "Experienced UGC creator delivering high-quality content."}
                                </div>
                                <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap',marginBottom:'1.5rem'}}>
                                    {(creator.niches||[]).map(n => (
                                        <span key={n} style={{padding:'0.2rem 0.75rem',background:'rgba(99,102,241,0.1)',color:'var(--indigo)',borderRadius:50,fontSize:'0.78rem',fontWeight:700}}>{n}</span>
                                    ))}
                                    <span style={{padding:'0.2rem 0.75rem',background:'var(--gray-100)',borderRadius:50,fontSize:'0.78rem',fontWeight:600}}>🌍 {creator.country}</span>
                                    <span style={{padding:'0.2rem 0.75rem',background:'var(--gray-100)',borderRadius:50,fontSize:'0.78rem',fontWeight:600}}>▶ {creator.videos} videos</span>
                                    <span style={{padding:'0.2rem 0.75rem',background:'var(--gray-100)',borderRadius:50,fontSize:'0.78rem',fontWeight:600}}>✓ {creator.completion}% completion</span>
                                </div>
                                <div className="perf-grid">
                                    <div className="perf-cell">
                                        <div className="perf-label">ROAS</div>
                                        <div className="perf-val">{roas ? `${roas}×` : '—'}</div>
                                        <div className="perf-bar"><div className="perf-fill" style={{width:roas ? `${Math.min(roas/5*100,100)}%` : '0'}}></div></div>
                                    </div>
                                    <div className="perf-cell">
                                        <div className="perf-label">CTR</div>
                                        <div className="perf-val">{ctr ? `${ctr}%` : '—'}</div>
                                        <div className="perf-bar"><div className="perf-fill" style={{width:ctr ? `${Math.min(ctr/5*100,100)}%` : '0'}}></div></div>
                                    </div>
                                    <div className="perf-cell">
                                        <div className="perf-label">Hook Rate</div>
                                        <div className="perf-val">{hook ? `${hook}%` : '—'}</div>
                                        <div className="perf-bar"><div className="perf-fill" style={{width:hook ? `${hook}%` : '0'}}></div></div>
                                    </div>
                                </div>
                                <div className="price-block">
                                    <div><div className="price-block-label">Video price</div><div style={{fontSize:'0.8rem',color:'var(--gray-400)'}}>Per video · full usage rights</div></div>
                                    <div className="price-block-val">From CA${creator.price}</div>
                                </div>
                                <button className="btn btn-black btn-full" onClick={onInvite}>Invite to brief →</button>
                                <p style={{textAlign:'center',color:'var(--gray-400)',marginTop:'0.75rem',fontSize:'0.85rem'}}>Invite now, approve later. No commitment yet.</p>
                            </>
                        )}
                        {tab === 'portfolio' && (
                            <div>
                                {portfolioVideos.length === 0 ? (
                                    <div style={{textAlign:'center',padding:'2rem',color:'var(--gray-400)'}}>
                                        <div style={{fontSize:'2.5rem',marginBottom:'0.75rem'}}>🎬</div>
                                        <div style={{fontWeight:700,marginBottom:'0.4rem'}}>No videos yet</div>
                                        <div style={{fontSize:'0.85rem'}}>This creator hasn't uploaded any videos yet.</div>
                                    </div>
                                ) : (
                                    <>
                                        <p style={{fontSize:'0.85rem',color:'var(--gray-600)',marginBottom:'1.25rem'}}>
                                            {portfolioVideos.length} video{portfolioVideos.length!==1?'s':''} · click to play
                                        </p>
                                        <div style={{display:'flex',flexDirection:'row',gap:'0.75rem',overflowX:'auto',paddingBottom:'0.5rem',marginBottom:'1.5rem'}}>
                                            {portfolioVideos.map((v, i) => (
                                                <div key={i} style={{position:'relative',flexShrink:0,width:'140px',aspectRatio:'9/16',borderRadius:10,overflow:'hidden',background:'#000',border:'1.5px solid rgba(255,255,255,0.12)',cursor:'pointer'}}
                                                    onClick={() => setPlayingIdx(playingIdx === i ? null : i)}>
                                                    <video
                                                        src={v.url}
                                                        style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}
                                                        controls={playingIdx === i}
                                                        preload="metadata"
                                                        playsInline
                                                        onLoadedMetadata={e => { e.target.currentTime = 0.5; }}
                                                        ref={el => { if (el && playingIdx === i) el.play().catch(()=>{}); }}
                                                        onClick={e => { if (playingIdx === i) e.stopPropagation(); }}
                                                    />
                                                    {playingIdx !== i && (
                                                        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.3)'}}>
                                                            <div style={{width:44,height:44,background:'rgba(255,255,255,0.92)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.1rem',boxShadow:'0 2px 10px rgba(0,0,0,0.35)'}}>▶</div>
                                                        </div>
                                                    )}
                                                    <div style={{position:'absolute',top:6,left:6,background:v.isApproved?'rgba(18,161,80,0.9)':'rgba(0,0,0,0.55)',backdropFilter:'blur(4px)',color:'#fff',padding:'2px 7px',borderRadius:4,fontSize:'0.58rem',fontWeight:700}}>
                                                        {v.isApproved ? '✓ Pitch' : v.label}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}
                                <button className="btn btn-black btn-full" onClick={onInvite}>Invite to brief →</button>
                            </div>
                        )}
                        {tab === 'ad-performance' && (
                            roas ? (
                                <div>
                                    <div className="perf-grid">
                                        <div className="perf-cell"><div className="perf-label">ROAS</div><div className="perf-val">{roas}×</div><div className="perf-bar"><div className="perf-fill" style={{width:`${Math.min(roas/5*100,100)}%`}}></div></div></div>
                                        <div className="perf-cell"><div className="perf-label">CTR</div><div className="perf-val">{ctr}%</div><div className="perf-bar"><div className="perf-fill" style={{width:`${Math.min(ctr/5*100,100)}%`}}></div></div></div>
                                        <div className="perf-cell"><div className="perf-label">Hook Rate</div><div className="perf-val">{hook}%</div><div className="perf-bar"><div className="perf-fill" style={{width:`${hook}%`}}></div></div></div>
                                    </div>
                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem',marginBottom:'1.5rem'}}>
                                        {[['Avg watch time',`${(hook*0.5).toFixed(1)}s`],['Avg engagement',`${(ctr*2.1).toFixed(1)}%`],['Cost per click',`CA$${(2.50/ctr*10).toFixed(2)}`],['Completion rate',`${Math.round(hook*1.4)}%`]].map(([l,v])=>(
                                            <div key={l} style={{background:'var(--gray-50)',borderRadius:10,padding:'1rem',textAlign:'center'}}>
                                                <div style={{fontSize:'0.72rem',color:'var(--gray-600)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:'0.3rem'}}>{l}</div>
                                                <div style={{fontSize:'1.35rem',fontWeight:800}}>{v}</div>
                                            </div>
                                        ))}
                                    </div>
                                    <div style={{background:'rgba(164,245,99,0.1)',border:'1.5px solid var(--lime)',borderRadius:10,padding:'0.85rem 1rem',marginBottom:'1.25rem',fontSize:'0.83rem',color:'#3a7000',fontWeight:600}}>
                                        ✅ This creator outperforms the platform average ROAS of 2.8× across all their campaigns.
                                    </div>
                                    <button className="btn btn-black btn-full" onClick={onInvite}>Invite to brief →</button>
                                </div>
                            ) : (
                                <div style={{padding:'3rem',textAlign:'center',color:'var(--gray-400)'}}>
                                    <div style={{fontSize:'3rem',marginBottom:'1rem'}}>📊</div>
                                    <div style={{fontWeight:700,marginBottom:'0.5rem'}}>No performance data yet</div>
                                    <div style={{fontSize:'0.875rem'}}>This creator is new — be the first to work with them.</div>
                                    <button className="btn btn-black" style={{marginTop:'1.5rem',borderRadius:10}} onClick={onInvite}>Invite to brief →</button>
                                </div>
                            )
                        )}
                    </div>
                </div>
            </div>
        );

    function PaymentModal({ context, onClose, onSuccess }) {
        const [method,  setMethod]  = useState('card');
        const [loading, setLoading] = useState(false);
        const [stage,   setStage]   = useState('form'); // 'form' | 'processing' | 'success'
        const [errMsg,  setErrMsg]  = useState('');

        // Card fields
        const [cardNum,  setCardNum]  = useState('');
        const [cardExp,  setCardExp]  = useState('');
        const [cardCvc,  setCardCvc]  = useState('');
        const [cardName, setCardName] = useState('');

        // Interac fields
        const [interacEmail, setInteracEmail] = useState('');

        const parseAmount = (str) => {
            if (!str) return 0;
            const num = parseFloat(String(str).replace(/[^0-9.]/g, ''));
            return isNaN(num) ? 0 : num;
        };

        const formatCard = (val) => {
            const digits = val.replace(/\D/g,'').slice(0,16);
            return digits.replace(/(.{4})/g,'$1 ').trim();
        };
        const formatExp = (val) => {
            const digits = val.replace(/\D/g,'').slice(0,4);
            if (digits.length >= 3) return digits.slice(0,2) + '/' + digits.slice(2);
            return digits;
        };

        const validate = () => {
            if (method === 'card') {
                const raw = cardNum.replace(/\s/g,'');
                if (raw.length < 13) { setErrMsg('Enter a valid card number'); return false; }
                if (cardExp.length < 5) { setErrMsg('Enter expiry as MM/YY'); return false; }
                if (cardCvc.length < 3) { setErrMsg('Enter a valid CVC'); return false; }
                if (!cardName.trim()) { setErrMsg('Enter the name on card'); return false; }
            } else if (method === 'interac') {
                if (!interacEmail.includes('@')) { setErrMsg('Enter a valid email address'); return false; }
            }
            return true;
        };

        const handlePay = async () => {
            setErrMsg('');
            if (!validate()) return;
            setLoading(true);
            setStage('processing');
            try {
                // Simulate brief processing delay
                await new Promise(r => setTimeout(r, 1600));
                await onSuccess(parseAmount(context.amount), method);
                setStage('success');
            } catch(e) {
                setErrMsg(e.message || 'Payment failed. Please try again.');
                setStage('form');
            } finally {
                setLoading(false);
            }
        };

        const txnRef = React.useMemo(() => 'VYR-' + Date.now().toString().slice(-8), []);

        const methods = [
            { id:'card',    icon:'💳', name:'Credit / Debit Card',   sub:'Visa · Mastercard · Amex' },
            { id:'interac', icon:'🍁', name:'Interac e-Transfer',    sub:'Most Canadian banks' },
            { id:'wire',    icon:'🏦', name:'Wire Transfer',         sub:'Business accounts' },
        ];

        return (
            <div className="overlay" onClick={stage==='processing' ? undefined : onClose}>
                <div className="modal-wide" style={{maxWidth:500}} onClick={e => e.stopPropagation()}>

                    {/* Header */}
                    <div className="modal-hdr" style={{borderBottom:'1px solid var(--gray-100)'}}>
                        <div>
                            <div style={{fontWeight:800,fontSize:'1.15rem',fontFamily:'Syne,sans-serif'}}>
                                {stage==='processing' ? '⏳ Processing…' : stage==='success' ? '✅ Payment complete' : context.title}
                            </div>
                            {stage==='form' && <div style={{fontSize:'0.78rem',color:'var(--gray-400)',marginTop:'0.15rem'}}>{context.desc}</div>}
                        </div>
                        {stage !== 'processing' && <button className="modal-close" onClick={onClose}>×</button>}
                    </div>

                    {/* ── PROCESSING ── */}
                    {stage === 'processing' && (
                        <div style={{padding:'3rem 2rem',textAlign:'center'}}>
                            <div style={{width:72,height:72,margin:'0 auto 1.5rem',position:'relative'}}>
                                <div style={{position:'absolute',inset:0,border:'3px solid var(--gray-100)',borderRadius:'50%'}}/>
                                <div style={{position:'absolute',inset:0,border:'3px solid transparent',borderTopColor:'var(--black)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
                                <div style={{position:'absolute',inset:'18px',background:'var(--lime)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1rem'}}>💳</div>
                            </div>
                            <h3 style={{fontWeight:800,marginBottom:'0.5rem'}}>Authorising payment…</h3>
                            <p style={{color:'var(--gray-500)',fontSize:'0.88rem'}}>Please don't close this window.</p>
                        </div>
                    )}

                    {/* ── SUCCESS ── */}
                    {stage === 'success' && (
                        <div className="pay-success">
                            <div className="pay-success-icon">
                                {method==='wire' ? '🏦' : method==='interac' ? '🍁' : '🎉'}
                            </div>
                            <h3>
                                {method==='wire' ? 'Wire instructions sent' :
                                 method==='interac' ? 'Interac details ready' :
                                 'Payment successful!'}
                            </h3>
                            <p>
                                {method==='wire'
                                    ? 'Use the wire details below. Your wallet will be credited within 1–2 business days once the transfer is confirmed by our team.'
                                    : method==='interac'
                                    ? `Send your e-Transfer to payments@vyralist.ca with reference ${txnRef}. Wallet credited within 1–3 hours.`
                                    : 'Your wallet has been topped up. Start inviting creators or launching campaigns right away.'}
                            </p>
                            {(method==='interac'||method==='wire') && (
                                <div style={{background:'var(--gray-50)',borderRadius:12,padding:'1rem',marginBottom:'1.5rem',fontSize:'0.88rem',textAlign:'left',width:'100%'}}>
                                    {method==='interac' ? [
                                        ['Send to','payments@vyralist.ca'],
                                        ['Amount',context.amount],
                                        ['Reference',txnRef],
                                        ['Security Q.','What is your brand name?'],
                                    ] : [
                                        ['Bank','RBC Royal Bank'],
                                        ['Account Name','Vyralist Inc.'],
                                        ['Account No.','1234-567'],
                                        ['Transit','04201'],
                                        ['Institution','003'],
                                        ['Amount',context.amount],
                                        ['Reference',txnRef],
                                    ].map(([l,v])=>(
                                        <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'0.4rem 0',borderBottom:'1px solid var(--gray-200)'}}>
                                            <span style={{color:'var(--gray-600)'}}>{l}</span>
                                            <span style={{fontWeight:700,fontFamily:l==='Reference'||l==='Account No.'?'monospace':'inherit'}}>{v}</span>
                                        </div>
                                    ))}
                                    {method==='interac' && [
                                        ['Send to','payments@vyralist.ca'],
                                        ['Amount',context.amount],
                                        ['Reference',txnRef],
                                        ['Security Q.','What is your brand name?'],
                                    ].map(([l,v])=>(
                                        <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'0.4rem 0',borderBottom:'1px solid var(--gray-200)'}}>
                                            <span style={{color:'var(--gray-600)'}}>{l}</span>
                                            <span style={{fontWeight:700,fontFamily:l==='Reference'?'monospace':'inherit'}}>{v}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                            <button className="btn btn-black btn-full" style={{borderRadius:10}} onClick={onClose}>Done</button>
                        </div>
                    )}

                    {/* ── FORM ── */}
                    {stage === 'form' && (
                        <div className="payment-modal-body">
                            {/* Amount pill */}
                            <div style={{textAlign:'center',padding:'1.25rem 0 0.5rem'}}>
                                <div style={{fontSize:'2.5rem',fontWeight:800,fontFamily:'Syne,sans-serif',letterSpacing:'-1px'}}>{context.amount}</div>
                                <div style={{fontSize:'0.82rem',color:'var(--gray-400)',marginTop:'0.2rem'}}>USD · Secured by 256-bit SSL</div>
                            </div>

                            {/* Method selector */}
                            <div className="pm-methods" style={{marginTop:'1.25rem'}}>
                                {methods.map(m => (
                                    <div key={m.id} className={`pm-method ${method===m.id?'pm-selected':''}`} onClick={() => { setMethod(m.id); setErrMsg(''); }}>
                                        <div className="pm-icon">{m.icon}</div>
                                        <div className="pm-name">{m.name}</div>
                                        <div className="pm-sub">{m.sub}</div>
                                    </div>
                                ))}
                            </div>

                            {/* ── CARD FIELDS ── */}
                            {method === 'card' && (
                                <div style={{marginTop:'1.25rem'}}>
                                    <div className="pm-input">
                                        <label>Card number</label>
                                        <div style={{position:'relative'}}>
                                            <input
                                                type="text" inputMode="numeric" placeholder="1234 5678 9012 3456"
                                                value={cardNum} maxLength={19}
                                                onChange={e => { setCardNum(formatCard(e.target.value)); setErrMsg(''); }}
                                                style={{paddingRight:'3rem'}}
                                            />
                                            <div style={{position:'absolute',right:'0.85rem',top:'50%',transform:'translateY(-50%)',display:'flex',gap:'0.2rem'}}>
                                                {['V','M','A'].map((c,i)=>(
                                                    <div key={i} style={{width:22,height:14,borderRadius:3,background:i===0?'#1A1F71':i===1?'#EB001B':'#2E77BC',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.45rem',fontWeight:800,color:'white',letterSpacing:'-0.5px'}}>{c}</div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.85rem'}}>
                                        <div className="pm-input">
                                            <label>Expiry date</label>
                                            <input type="text" inputMode="numeric" placeholder="MM/YY" value={cardExp} maxLength={5}
                                                onChange={e => { setCardExp(formatExp(e.target.value)); setErrMsg(''); }} />
                                        </div>
                                        <div className="pm-input">
                                            <label>CVC / CVV</label>
                                            <input type="text" inputMode="numeric" placeholder="•••" value={cardCvc} maxLength={4}
                                                onChange={e => { setCardCvc(e.target.value.replace(/\D/g,'').slice(0,4)); setErrMsg(''); }} />
                                        </div>
                                    </div>
                                    <div className="pm-input">
                                        <label>Name on card</label>
                                        <input type="text" placeholder="Jane Smith" value={cardName}
                                            onChange={e => { setCardName(e.target.value); setErrMsg(''); }} />
                                    </div>
                                </div>
                            )}

                            {/* ── INTERAC FIELDS ── */}
                            {method === 'interac' && (
                                <div style={{marginTop:'1.25rem'}}>
                                    <div style={{background:'rgba(164,245,99,0.1)',border:'1.5px solid var(--lime)',borderRadius:12,padding:'1rem',marginBottom:'1rem',fontSize:'0.82rem',color:'#3a6000',lineHeight:1.6}}>
                                        <strong>🍁 How Interac e-Transfer works:</strong><br/>
                                        After clicking "Confirm", send your e-Transfer to <strong>payments@vyralist.ca</strong> from your online banking. Use the reference code below. Wallet is credited within 1–3 hours on business days.
                                    </div>
                                    <div className="pm-input">
                                        <label>Your email address (for receipt)</label>
                                        <input type="email" placeholder="you@yourbrand.ca" value={interacEmail}
                                            onChange={e => { setInteracEmail(e.target.value); setErrMsg(''); }} />
                                    </div>
                                    <div style={{background:'var(--gray-50)',border:'1px solid var(--gray-200)',borderRadius:10,padding:'0.85rem 1rem',fontSize:'0.82rem'}}>
                                        {[['Send to','payments@vyralist.ca'],['Amount',context.amount],['Reference',txnRef],['Security answer','Your brand name']].map(([l,v])=>(
                                            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'0.3rem 0',borderBottom:'1px solid var(--gray-100)'}}>
                                                <span style={{color:'var(--gray-600)'}}>{l}</span>
                                                <span style={{fontWeight:700,fontFamily:l==='Reference'?'monospace':'inherit',fontSize:l==='Send to'?'0.78rem':'inherit'}}>{v}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* ── WIRE FIELDS ── */}
                            {method === 'wire' && (
                                <div style={{marginTop:'1.25rem'}}>
                                    <div style={{background:'var(--gray-50)',border:'1px solid var(--gray-200)',borderRadius:12,padding:'1rem',fontSize:'0.82rem',marginBottom:'0.75rem'}}>
                                        {[['Bank','RBC Royal Bank'],['Account Name','Vyralist Inc.'],['Account No.','1234-567'],['Transit No.','04201'],['Institution No.','003'],['Amount',context.amount],['Reference',txnRef]].map(([l,v])=>(
                                            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'0.35rem 0',borderBottom:'1px solid var(--gray-200)'}}>
                                                <span style={{color:'var(--gray-600)'}}>{l}</span>
                                                <span style={{fontWeight:700,fontFamily:l.includes('No')||l==='Reference'?'monospace':'inherit'}}>{v}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div style={{fontSize:'0.75rem',color:'var(--gray-400)',lineHeight:1.5}}>Wallet credited within 1–2 business days once the wire is confirmed by our team. Contact <strong>hello@vyralist.ca</strong> to expedite.</div>
                                </div>
                            )}

                            {errMsg && (
                                <div style={{background:'#FEE2E2',color:'#991B1B',padding:'0.7rem 0.9rem',borderRadius:8,fontSize:'0.82rem',margin:'0.75rem 0'}}>{errMsg}</div>
                            )}

                            <button className="btn btn-black btn-full" style={{borderRadius:10,padding:'0.9rem',marginTop:'1.25rem'}} disabled={loading} onClick={handlePay}>
                                {method === 'card'    ? `Pay ${context.amount}` :
                                 method === 'interac' ? `Confirm — I'll send the e-Transfer` :
                                 `Save wire details`}
                            </button>
                            <p style={{textAlign:'center',marginTop:'0.75rem',fontSize:'0.72rem',color:'var(--gray-400)'}}>
                                🔒 256-bit SSL · {method==='card'?'Powered by Stripe':'Canadian payments'}
                            </p>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
