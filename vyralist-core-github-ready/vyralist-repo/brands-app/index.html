        .file-attach{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.75rem;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.25);border-radius:8px;margin-top:0.35rem;font-size:0.78rem;cursor:pointer;}
        .file-attach.theirs-file{background:var(--gray-50);border-color:var(--gray-200);color:var(--black);}
        .chat-input-area{padding:0.85rem 1.35rem;background:white;border-top:1px solid var(--gray-200);display:flex;gap:0.65rem;align-items:center;flex-shrink:0;}
        .chat-input{flex:1;padding:0.65rem 0.95rem;border:1.5px solid var(--gray-200);border-radius:22px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;outline:none;transition:border-color 0.2s;}
        .chat-input:focus{border-color:var(--indigo);}
        .chat-send-btn{width:36px;height:36px;background:var(--indigo);color:white;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.2s;}
        .chat-send-btn:hover{background:#4f46e5;}
        .chat-attach-btn{width:34px;height:34px;background:var(--gray-100);border:1.5px solid var(--gray-200);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray-600);transition:all 0.2s;}
        .chat-attach-btn:hover{background:var(--gray-200);}

        /* ===== SEARCH / FILTERS ===== */
        .search-filter-row{display:flex;gap:0.75rem;margin-bottom:1rem;align-items:center;flex-wrap:wrap;}
        .search-box{display:flex;align-items:center;gap:0.5rem;padding:0.55rem 1rem;border:1.5px solid var(--gray-200);border-radius:50px;background:white;min-width:220px;transition:border-color 0.2s;}
        .search-box:focus-within{border-color:var(--black);}
        .search-box input{border:none;outline:none;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;width:100%;background:transparent;}
        .sort-select{padding:0.55rem 1rem;border:1.5px solid var(--gray-200);border-radius:50px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.82rem;font-weight:600;outline:none;cursor:pointer;background:white;}
        .sort-select:focus{border-color:var(--black);}
        .adv-filter-panel{background:white;border:1.5px solid var(--gray-200);border-radius:14px;padding:1.35rem;margin-bottom:1.25rem;}

        /* ── Billo-style filter sidebar ── */
        .explore-layout { display: flex; gap: 0; align-items: flex-start; }
        .filter-sidebar {
            width: 260px; min-width: 260px; flex-shrink: 0;
            background: white; border-right: 1.5px solid var(--gray-200);
            height: calc(100vh - 72px); overflow-y: auto;
            padding: 0 0 2rem; position: sticky; top: 72px;
            scrollbar-width: thin; scrollbar-color: var(--gray-200) transparent;
            margin-left: -1.5rem;
        }
        .filter-sidebar::-webkit-scrollbar { width: 4px; }
        .filter-sidebar::-webkit-scrollbar-track { background: transparent; }
        .filter-sidebar::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 4px; }
        .fsb-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.1rem 1.25rem 0.9rem; border-bottom: 1.5px solid var(--gray-200);
            position: sticky; top: 0; background: white; z-index: 1;
        }
        .fsb-header h3 { font-size: 1.05rem; font-weight: 800; }
        .fsb-close { background: none; border: none; cursor: pointer; font-size: 1.3rem; color: var(--gray-400); line-height:1; padding: 0.2rem; }
        .fsb-close:hover { color: var(--black); }
        .fsb-section { border-bottom: 1px solid var(--gray-100); }
        .fsb-section-hdr {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.85rem 1.25rem; cursor: pointer; user-select: none;
        }
        .fsb-section-hdr:hover { background: var(--gray-50); }
        .fsb-section-title { font-size: 0.9rem; font-weight: 700; }
        .fsb-chevron { font-size: 0.75rem; color: var(--gray-400); transition: transform 0.2s; }
        .fsb-chevron.open { transform: rotate(180deg); }
        .fsb-options { padding: 0.25rem 1.25rem 0.85rem; display: flex; flex-direction: column; gap: 0.15rem; }
        .fsb-checkbox {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.35rem 0; cursor: pointer; user-select: none;
        }
        .fsb-checkbox:hover .fsb-box { border-color: var(--indigo); }
        .fsb-box {
            width: 17px; height: 17px; border: 1.5px solid var(--gray-200);
            border-radius: 4px; flex-shrink: 0; display: flex; align-items: center;
            justify-content: center; transition: all 0.15s;
        }
        .fsb-box.checked { background: var(--indigo); border-color: var(--indigo); }
        .fsb-box.checked::after { content: '✓'; color: white; font-size: 0.7rem; font-weight: 800; }
        .fsb-label { font-size: 0.875rem; color: var(--black); }
        .fsb-reset { background: none; border: none; cursor: pointer; font-size: 0.78rem; color: var(--indigo); font-weight: 700; padding: 0; }
        .fsb-reset:hover { text-decoration: underline; }
        .fsb-see-fewer { padding: 0.6rem 1.25rem 0.8rem; }
        .fsb-see-fewer button { background: none; border: none; cursor: pointer; font-size: 0.85rem; color: var(--indigo); font-weight: 700; display: flex; align-items: center; gap: 0.35rem; }
        .filter-content-area { flex: 1; min-width: 0; padding: 0 0 0 1.5rem; }
        .active-filter-badge {
            background: var(--indigo); color: white; font-size: 0.7rem; font-weight: 800;
            border-radius: 50%; width: 18px; height: 18px; display: inline-flex;
            align-items: center; justify-content: center; margin-left: 0.3rem;
        }
        .afp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:0.75rem;}
        .afp-group label{display:block;font-size:0.72rem;font-weight:700;color:var(--gray-600);margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;}
        .afp-group select,.afp-group input[type=range]{width:100%;padding:0.5rem 0.75rem;border:1.5px solid var(--gray-200);border-radius:8px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.82rem;outline:none;}
        .afp-group input[type=range]{padding:0;border:none;accent-color:var(--indigo);}

        /* ===== PAYMENT ===== */
        .payment-modal-body{padding:1.5rem 2rem 2rem;}
        .pm-amount{font-size:2.25rem;font-weight:800;color:var(--indigo);text-align:center;margin-bottom:0.3rem;}
        .pm-desc{text-align:center;color:var(--gray-600);font-size:0.88rem;margin-bottom:1.75rem;}
        .pm-methods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.75rem;margin-bottom:1.5rem;}
        .pm-method{border:2px solid var(--gray-200);border-radius:12px;padding:1rem;cursor:pointer;transition:all 0.2s;text-align:center;background:white;}
        .pm-method:hover{border-color:var(--indigo);}
        .pm-method.pm-selected{border-color:var(--indigo);background:rgba(99,102,241,0.05);}
        .pm-icon{font-size:1.75rem;margin-bottom:0.35rem;}
        .pm-name{font-weight:700;font-size:0.82rem;}
        .pm-sub{font-size:0.68rem;color:var(--gray-600);}
        .pm-input{margin-bottom:1.1rem;}
        .pm-input label{display:block;font-weight:600;font-size:0.85rem;margin-bottom:0.35rem;}
        .pm-input input{width:100%;padding:0.7rem 0.95rem;border:2px solid var(--gray-200);border-radius:10px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s;}
        .pm-input input:focus{border-color:var(--indigo);}
        .pay-success{text-align:center;padding:2rem 1.5rem;}
        .pay-success-icon{font-size:4rem;margin-bottom:1rem;}
        .pay-success h3{font-size:1.4rem;font-weight:800;margin-bottom:0.5rem;}
        .pay-success p{color:var(--gray-600);font-size:0.88rem;margin-bottom:1.5rem;}

        /* ===== PROFILE / SETTINGS ===== */
        .settings-page{padding:2.5rem;max-width:860px;margin:0 auto;}
        .settings-tabs{display:flex;border-bottom:2px solid var(--gray-200);margin-bottom:2rem;}
        .stab{padding:0.7rem 1.35rem;font-weight:600;font-size:0.85rem;color:var(--gray-400);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s;}
        .stab.active{color:var(--black);border-bottom-color:var(--black);}
        .ss-card{background:white;border:1.5px solid var(--gray-200);border-radius:14px;padding:1.65rem;margin-bottom:1.1rem;}
        .ss-title{font-size:1rem;font-weight:700;padding-bottom:1rem;border-bottom:1px solid var(--gray-100);margin-bottom:1.25rem;}
        .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
        .settings-avatar-row{display:flex;align-items:center;gap:1.35rem;margin-bottom:1.5rem;}
        .settings-avatar{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),#9333ea);display:flex;align-items:center;justify-content:center;color:white;font-size:1.65rem;font-weight:700;}
        .avatar-btn{padding:0.45rem 0.9rem;border:1.5px solid var(--gray-200);border-radius:8px;font-size:0.8rem;font-weight:600;cursor:pointer;background:white;font-family:'Cabinet Grotesk',sans-serif;transition:all 0.2s;}
        .avatar-btn:hover{border-color:var(--black);}

        /* ===== ANALYTICS ===== */
        .analytics-page{padding:2.5rem;max-width:1200px;margin:0 auto;}
        .analytics-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-bottom:2rem;}
        .ac{background:white;border:1.5px solid var(--gray-200);border-radius:14px;padding:1.25rem 1.4rem;}
        .ac-label{font-size:0.72rem;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.35rem;}
        .ac-val{font-size:2rem;font-weight:800;margin-bottom:0.15rem;}
        .ac-delta{font-size:0.72rem;font-weight:700;}
        .ac-delta.up{color:var(--green);}
        .ac-delta.down{color:var(--red);}
        .chart-wrap{background:white;border:1.5px solid var(--gray-200);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;}
        .chart-wrap-title{font-size:0.92rem;font-weight:700;margin-bottom:1.25rem;}
        .bar-chart{display:flex;align-items:flex-end;gap:0.6rem;height:130px;}
        .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.3rem;}
        .bar-fill{width:100%;border-radius:5px 5px 0 0;cursor:pointer;transition:opacity 0.15s;}
        .bar-fill:hover{opacity:0.75;}
        .bar-lbl{font-size:0.62rem;color:var(--gray-600);}
        .perf-table{width:100%;border-collapse:collapse;}
        .perf-table th{text-align:left;padding:0.7rem 0.9rem;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--gray-600);border-bottom:2px solid var(--gray-200);}
        .perf-table td{padding:0.85rem 0.9rem;border-bottom:1px solid var(--gray-100);font-size:0.85rem;}
        .perf-table tr:last-child td{border-bottom:none;}
        .perf-table tr:hover td{background:var(--gray-50);}

        /* ===== MISC ===== */
        .empty-state-wrap{text-align:center;padding:4rem 2rem;}
        .es-icon{font-size:3.5rem;margin-bottom:1rem;}
        .es-title{font-size:1.35rem;font-weight:800;margin-bottom:0.5rem;}
        .es-sub{color:var(--gray-600);margin-bottom:1.5rem;max-width:360px;margin-left:auto;margin-right:auto;font-size:0.9rem;}
        .overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;padding:1.5rem;animation:fadeIn 0.2s ease;}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        .modal-wide{background:white;border-radius:20px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp2 0.3s ease;}
        @keyframes slideUp2{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        .tag{display:inline-flex;align-items:center;gap:0.25rem;padding:0.15rem 0.55rem;border-radius:4px;font-size:0.72rem;font-weight:700;}
        .toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;}
        .toast{background:var(--black);color:white;padding:0.8rem 1.25rem;border-radius:10px;font-size:0.85rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.2);animation:toastIn 0.3s ease;display:flex;align-items:center;gap:0.6rem;}
        @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
        .toast.success{background:#065F46;border-left:3px solid var(--lime);}
        .toast.error{background:#991B1B;}

    </style>
</head>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ─── Error Boundary ──────────────────────────────────────────────────────────
    class DetailErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { error: null }; }
        static getDerivedStateFromError(error) { return { error }; }
        componentDidCatch(error, info) { console.error('[DetailPanel crash]', error, info); }
        render() {

    function App() {
        const [user,      setUser]     = useState(null);
        const [loading,   setLoading]  = useState(true);
        // views: landing | signup | onboarding | dashboard
        const [view,      setView]     = useState('landing');
        const [authModal, setAuthModal]= useState(null); // null | 'signup' | 'login'

        useEffect(() => {
            supabase.auth.getSession().then(async ({ data: { session } }) => {
                if (session?.user) {
                    setUser(session.user);
                    // Check DB for brand row — more reliable than localStorage
                    // (localStorage fails on new devices / incognito)
                    try {
                        const { data: brand } = await supabase
                            .from('brands')
                            .select('id, brand_name')
                            .eq('user_id', session.user.id)
                            .maybeSingle();
                        if (brand?.id) {
                            // Has a completed brand profile — go straight to dashboard
                            localStorage.setItem(`vy_onboarded_${session.user.id}`, 'true');
                            setView('dashboard');
                        } else {
                            setView('onboarding');
                        }
                    } catch(_) {
                        // No brand row yet — send to onboarding
                        setView('onboarding');
                    }
                } else {
                    setView('landing');
                }
                setLoading(false);
            });

            const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, session) => {
                if (session?.user) {
                    setUser(session.user);
                } else {
                    setUser(null);
                    setView('landing');
                }
            });
            return () => subscription.unsubscribe();
        }, []);

        if (loading) return <div className="app-loader"><div className="loader-ring"></div></div>;

        if (view === 'landing') return (
            <LandingPage
                onSignup={() => setView('signup')}
                onOpenAuth={(m) => setAuthModal(m)}
                authModal={authModal}
                setAuthModal={setAuthModal}
                setUser={setUser}
                setView={setView}
            />
        );
        if (view === 'signup')     return <SignupFlow setUser={setUser} setView={setView} />;
        if (view === 'onboarding') return <OnboardingFlow user={user} setView={setView} />;
        if (view === 'dashboard')  return <Dashboard user={user} setUser={setUser} setView={setView} />;
        return null;
    }

    // ─── Auth Modal (Login only — signup uses full flow) ──────────────────────────
    function AuthModal({ mode, onClose, setUser, setView, switchToSignup }) {
        const [email,    setEmail]    = useState('');
        const [password, setPassword] = useState('');
        const [loading,  setLoading]  = useState(false);
        const [error,    setError]    = useState('');
        const [forgotSent, setForgotSent] = useState(false);
        const [showForgot, setShowForgot] = useState(false);

        const handleOAuth = async (provider) => {
            const { error } = await supabase.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.origin } });
            if (error) setError(error.message);
        };

        const handleForgot = async () => {
            if (!email) { setError('Enter your email above first.'); return; }
            setLoading(true); setError('');
            try {
                await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
                setForgotSent(true);
            } catch(err) { setError(err.message); }
            finally { setLoading(false); }
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true); setError('');
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                setUser(data.user);
                // Check DB — don't trust localStorage (breaks on new devices)
                try {
                    const { data: brand } = await supabase
                        .from('brands')
                        .select('id, brand_name')
                        .eq('user_id', data.user.id)
                        .maybeSingle();
                    if (brand?.id) {
                        localStorage.setItem(`vy_onboarded_${data.user.id}`, 'true');
                        setView('dashboard');
                    } else {
                        setView('onboarding');
                    }
                } catch(_) {
                    setView('onboarding');
                }
                onClose();
            } catch (err) { setError(err.message); }
            finally { setLoading(false); }
        };

        return (
            <div className="overlay" onClick={onClose}>
                <div className="auth-card" onClick={e => e.stopPropagation()}>
                    <button className="auth-card-close" onClick={onClose}>×</button>
                    <div className="auth-title">Welcome back 👋</div>
                    {forgotSent && <div className="alert alert-ok">✅ Reset link sent — check your inbox.</div>}
                    {error && <div className="alert alert-err">{error}</div>}
                    <div className="oauth-row">
                        <button className="oauth-btn" onClick={() => handleOAuth('google')}><b>G</b> Google</button>
                        <button className="oauth-btn" onClick={() => handleOAuth('azure')}><b>Ⓜ</b> Outlook</button>
                    </div>
                    <div className="divider-line">or</div>
                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label className="form-label">Email</label>
                            <input type="email" className="form-input" placeholder="you@company.com" value={email} onChange={e=>setEmail(e.target.value)} required />
                        </div>
                        <div className="form-group">
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.4rem'}}>
                                <label className="form-label" style={{margin:0}}>Password</label>
                                <a href="#" style={{fontSize:'0.8rem',color:'var(--indigo)',fontWeight:600,textDecoration:'none'}} onClick={e=>{e.preventDefault();handleForgot();}}>
                                    Forgot password?
                                </a>
                            </div>
                            <input type="password" className="form-input" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} required />
                        </div>
                        <button type="submit" className="btn btn-black btn-full" disabled={loading} style={{marginTop:'0.5rem'}}>
                            {loading ? 'Signing in…' : 'Sign in →'}
                        </button>
                    </form>
                    <p style={{textAlign:'center',marginTop:'1.25rem',fontSize:'0.9rem',color:'var(--gray-600)'}}>
                        No account? <a href="#" style={{color:'var(--black)',fontWeight:700}} onClick={(e)=>{e.preventDefault();switchToSignup();}}>Sign up free</a>
                    </p>
                </div>
            </div>
        );

    // ─── Signup Flow (3 steps, then straight to onboarding) ───────────────────────
    function SignupFlow({ setUser, setView }) {
        const [step, setStep] = useState(1); // 1=company info, 2=credentials
        const [form, setForm] = useState({
            companyName:'', businessType:'', country:'United States',
            jobRole:'', referralSource:'', email:'', password:'', confirmPassword:''
        });
        const [loading, setLoading] = useState(false);
        const [error,   setError]  = useState('');

        const set = (k,v) => setForm(f => ({...f,[k]:v}));

        const validateStep1 = () => {
            if (!form.companyName.trim()) return 'Company name is required.';
            if (!form.businessType) return 'Please select a business type.';
            if (!form.jobRole) return 'Please select your job role.';
            if (!form.referralSource) return 'Please tell us how you found Vyralist.';
            return null;
        };

        const validateStep2 = () => {
            if (!form.email.trim()) return 'Email is required.';
            if (form.password.length < 8) return 'Password must be at least 8 characters.';
            if (form.password !== form.confirmPassword) return 'Passwords do not match.';
            return null;
        };

        const next = () => {
            const err = validateStep1();
            if (err) { setError(err); return; }
            setError(''); setStep(2);
        };

        const submit = async (e) => {
            e.preventDefault();
            const err = validateStep2();
            if (err) { setError(err); return; }
            setLoading(true); setError('');
            try {
                const { data, error } = await supabase.auth.signUp({
                    email: form.email,
                    password: form.password,
                    options: {
                        data: {
                            company_name:    form.companyName,
                            business_type:   form.businessType,
                            job_role:        form.jobRole,
                            country:         form.country,
                            referral_source: form.referralSource,
                        },
                        emailRedirectTo: window.location.origin
                    }
                });
                if (error) throw error;

                // data.user exists but may be unconfirmed if email confirmation is ON.
                // We move to onboarding either way — brand row creation happens there
                // after we verify the session is real.
                const activeUser = data.session?.user || data.user;
                if (!activeUser) {
                    // Email confirmation required — tell user to check inbox
                    setError('');
                    setLoading(false);
                    // Show confirmation message instead
                    setStep(99); // special step to show "check your email"
                    return;
                }
                setUser(activeUser);
                setView('onboarding');
            } catch (err) {
                setError(err.message);
            } finally {
                setLoading(false);
            }
        };

        const pills = [1,2];

        // Email confirmation screen
        if (step === 99) {
            return (
                <div className="signup-wrap">
                    <div className="signup-card" style={{textAlign:'center'}}>
                        <span className="logo-text">vyralist</span>
                        <div style={{fontSize:'3rem',margin:'1.5rem 0'}}>📧</div>
                        <h2 style={{fontWeight:800,marginBottom:'0.75rem'}}>Check your email</h2>
                        <p style={{color:'var(--gray-600)',marginBottom:'1.5rem',lineHeight:1.6}}>
                            We sent a confirmation link to <strong>{form.email}</strong>.<br/>
                            Click the link in the email to activate your account, then come back and log in.
                        </p>
                        <button className="btn btn-black btn-full" onClick={() => setView('landing')}>Back to home</button>
                    </div>
                </div>
            );
        }

        return (
            <div className="signup-wrap">
                <div className="signup-card">
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.5rem'}}>
                        <span className="logo-text">vyralist</span>
                        <button onClick={() => setView('landing')} style={{background:'none',border:'none',cursor:'pointer',fontSize:'0.85rem',color:'var(--gray-400)',display:'flex',alignItems:'center',gap:'0.3rem',fontFamily:'Cabinet Grotesk,sans-serif',fontWeight:600}}>✕ Exit</button>
                    </div>
                    <p className="sub">
                        {step === 1
                            ? "Let's set up your account. First, tell us about your company."
                            : "Almost there! Set up your login credentials."}
                    </p>

                    {error && <div className="alert alert-err">{error}</div>}

                    <div className="step-pills">
                        {pills.map(p => <div key={p} className={`step-pill ${p < step ? 'done' : p === step ? 'active' : ''}`}></div>)}
                    </div>

                    {step === 1 ? (
                        <>
                            <div className="form-group">
                                <label className="form-label">Company name <span className="req">*</span></label>
                                <input type="text" className="form-input" placeholder="Your company or agency" value={form.companyName} onChange={e=>set('companyName',e.target.value)} />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Business type <span className="req">*</span></label>
                                <select className="form-select" value={form.businessType} onChange={e=>set('businessType',e.target.value)}>
                                    <option value="">Select business type</option>
                                    {BIZ_TYPES.map(b => <option key={b}>{b}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label className="form-label">Country <span className="req">*</span></label>
                                <select className="form-select" value={form.country} onChange={e=>set('country',e.target.value)}>
                                    {COUNTRIES.map(c => <option key={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label className="form-label">Your role <span className="req">*</span></label>
                                <select className="form-select" value={form.jobRole} onChange={e=>set('jobRole',e.target.value)}>
                                    <option value="">Select your role</option>
                                    {JOB_ROLES.map(r => <option key={r}>{r}</option>)}
                                </select>
                            </div>
                            <div className="form-group">
                                <label className="form-label">How did you find Vyralist? <span className="req">*</span></label>
                                <select className="form-select" value={form.referralSource} onChange={e=>set('referralSource',e.target.value)}>
                                    <option value="">Select option</option>
                                    {REFERRALS.map(r => <option key={r}>{r}</option>)}
                                </select>
                            </div>
                            <button className="btn btn-black btn-full" onClick={next} style={{marginTop:'0.5rem'}}>Continue →</button>
                        </>
                    ) : (
                        <form onSubmit={submit}>
                            <div className="form-group">
                                <label className="form-label">Work email <span className="req">*</span></label>
                                <input type="email" className="form-input" placeholder="you@company.com" value={form.email} onChange={e=>set('email',e.target.value)} required />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Password <span className="req">*</span></label>
                                <input type="password" className="form-input" placeholder="Min. 8 characters" value={form.password} onChange={e=>set('password',e.target.value)} required />
                                {form.password.length > 0 && (() => {
                                    const p = form.password;
                                    const score = [p.length >= 8, /[A-Z]/.test(p), /[0-9]/.test(p), /[^A-Za-z0-9]/.test(p)].filter(Boolean).length;
                                    const labels = ['','Weak','Fair','Good','Strong'];
                                    const colors = ['','#EF4444','#F59E0B','#3B82F6','#10B981'];
                                    return (
                                        <div style={{marginTop:'0.4rem',display:'flex',alignItems:'center',gap:'0.5rem'}}>
                                            <div style={{flex:1,display:'flex',gap:3}}>
                                                {[1,2,3,4].map(i => (
                                                    <div key={i} style={{flex:1,height:3,borderRadius:2,background: i <= score ? colors[score] : 'var(--gray-200)',transition:'background 0.2s'}} />
                                                ))}
                                            </div>
                                            <span style={{fontSize:'0.72rem',fontWeight:700,color:colors[score],minWidth:36}}>{labels[score]}</span>
                                        </div>
                                    );
                                })()}
                            </div>
                            <div className="form-group">
                                <label className="form-label">Confirm password <span className="req">*</span></label>
                                <input type="password" className="form-input" placeholder="••••••••" value={form.confirmPassword} onChange={e=>set('confirmPassword',e.target.value)} required />
                            </div>
                            <button type="submit" className="btn btn-lime btn-full" disabled={loading} style={{marginTop:'0.5rem'}}>
                                {loading ? 'Creating account…' : 'Create account & continue →'}
                            </button>
                            <p style={{textAlign:'center',marginTop:'1rem',fontSize:'0.85rem'}}>
                                <a href="#" style={{color:'var(--gray-600)'}} onClick={e=>{e.preventDefault();setStep(1);setError('');}}>← Back</a>
                            </p>
                        </form>
                    )}
                    <p style={{textAlign:'center',marginTop:'1.25rem',fontSize:'0.85rem',color:'var(--gray-600)'}}>
                        Already have an account? <a href="#" style={{color:'var(--black)',fontWeight:700}} onClick={e=>{e.preventDefault();setView('landing');}}>Log in</a>
                    </p>
                </div>
            </div>
        );
    }

    // ─── Onboarding (brand setup) ─────────────────────────────────────────────────
    function OnboardingFlow({ user, setView }) {
        const [step, setStep] = useState(1); // 1 = brand details
        const [form, setForm] = useState({ brandName:'', website:'', category:'', productType:'', adSpend:'' });
        const [loading, setLoading] = useState(false);
        const [error,   setError]  = useState('');
        const [done,    setDone]   = useState(false);

        const set = (k,v) => setForm(f => ({...f,[k]:v}));

        const submit = async (e) => {
            e.preventDefault();
            if (!form.brandName || !form.category || !form.productType || !form.adSpend) {
                setError('Please complete all fields.'); return;
            }
            if (!user?.id) {
                setError('Session expired. Please log in again.');
                setLoading(false);
                return;
            }
            setLoading(true); setError('');
            try {
                const brandData = {
                    company_name: user?.user_metadata?.company_name || form.brandName,
                    brand_name:   form.brandName,
                    website:      form.website || null,
                    category:     form.category,
                    product_type: form.productType,
                    ad_spend:     form.adSpend,
                    country:      user?.user_metadata?.country || 'Canada',
                    updated_at:   new Date().toISOString()
                };

                // First try UPDATE — works if a row already exists
                const { data: updated, error: updateErr } = await supabase
                    .from('brands')
                    .update(brandData)
                    .eq('user_id', user.id)
                    .select('id')
                    .maybeSingle();

                if (updateErr) throw updateErr;

                if (!updated) {
                    // No row exists — try INSERT
                    // This only works if email is confirmed (foreign key requirement)
                    const { error: insertErr } = await supabase
                        .from('brands')
                        .insert({ user_id: user.id, wallet_balance: 0, ...brandData });
                    if (insertErr) {
                        if (insertErr.message.includes('foreign key')) {
                            throw new Error('Please confirm your email first, then log in and complete your profile.');
                        }
                        throw insertErr;
                    }
                }

                if (user?.id) localStorage.setItem(`vy_onboarded_${user.id}`, 'true');
                setLoading(false);
                setDone(true);
                setTimeout(() => setView('dashboard'), 2200);
            } catch(err) {
                setError(err.message || 'Something went wrong. Please try again.');
                setLoading(false);
            }
        };

        return (
            <div className="onboard-wrap">
                <div className="onboard-card">
                    {done ? (
                        <div style={{textAlign:'center',padding:'2.5rem 1rem'}}>
                            <div style={{fontSize:'3rem',marginBottom:'1rem'}}>🎉</div>
                            <h2 style={{fontWeight:800,fontSize:'1.5rem',marginBottom:'0.5rem'}}>You're all set, {form.brandName || 'welcome'}!</h2>
                            <p style={{color:'var(--gray-600)',fontSize:'0.9rem',marginBottom:'1.5rem'}}>Your brand profile is ready. Taking you to your dashboard…</p>
                            <div style={{width:40,height:4,background:'var(--lime)',borderRadius:4,margin:'0 auto',animation:'pulse 1s infinite'}}></div>
                        </div>
                    ) : (
                        <>
                        <div className="onboard-header">
                        <span className="logo-text">vyralist</span>
                        <h2>Set up your brand 🚀</h2>
                        <p>Tell us about the brand you're running ads for. This helps us match you with the best creators.</p>
                    </div>
                    {error && <div className="alert alert-err">{error}</div>}
                    <div className="onboard-progress">
                        <div className={`progress-seg ${step >= 1 ? 'filled' : ''}`}></div>
                        <div className={`progress-seg ${step >= 2 ? 'filled' : ''}`}></div>
                        <div className={`progress-seg ${step >= 3 ? 'filled' : ''}`}></div>
                    </div>
                    <form onSubmit={submit}>
                        <div className="form-group">
                            <label className="form-label">Brand name <span className="req">*</span></label>
                            <input type="text" className="form-input" placeholder="Enter brand name" value={form.brandName} onChange={e=>set('brandName',e.target.value)} />
                        </div>
                        <div className="form-group">
                            <label className="form-label">Website</label>
                            <input
                                type="text"
                                className="form-input"
                                placeholder="https://www.brand.com"
                                value={form.website}
                                onChange={e => {
                                    let v = e.target.value;
                                    set('website', v);
                                }}
                                onBlur={e => {
                                    let v = e.target.value.trim();
                                    if (v && !/^https?:\/\//i.test(v)) {
                                        set('website', 'https://' + v);
                                    }
                                }}
                            />
                            {form.website && !/^https?:\/\/.+\..+/.test(form.website) && (
                                <div style={{fontSize:'0.75rem',color:'var(--amber)',marginTop:'0.3rem'}}>⚠ Include a full URL, e.g. https://www.brand.com</div>
                            )}
                        </div>
                        <div className="form-group">
                            <label className="form-label">Category <span className="req">*</span></label>
                            <select className="form-select" value={form.category} onChange={e=>set('category',e.target.value)}>
                                <option value="">Select category</option>
                                {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                            </select>
                        </div>
                        <div className="form-group">
                            <label className="form-label">Product type <span className="req">*</span></label>
                            <select className="form-select" value={form.productType} onChange={e=>set('productType',e.target.value)}>
                                <option value="">Select type</option>
                                {PROD_TYPES.map(t => <option key={t}>{t}</option>)}
                            </select>
                        </div>
                        <div className="form-group">
                            <label className="form-label">Monthly social ad spend <span className="req">*</span></label>
                            <select className="form-select" value={form.adSpend} onChange={e=>set('adSpend',e.target.value)}>
                                <option value="">Select range</option>
                                {AD_SPEND.map(a => <option key={a}>{a}</option>)}
                            </select>
                        </div>
                        <button type="submit" className="btn btn-lime btn-full" disabled={loading} style={{marginTop:'1rem'}}>
                                {loading ? 'Setting up your dashboard…' : 'Go to my dashboard →'}
                            </button>
                        </form>
                        </>
                    )}
                </div>
            </div>
        );
    }

            if (m < 1)  return 'Just now';
            if (m < 60) return `${m}m ago`;
            const h = Math.floor(m/60);
            if (h < 24) return `${h}h ago`;
            const d = Math.floor(h/24);

                addToast('Could not load campaigns: ' + e.message, 'error');
            } finally {
                setLoadingCampaigns(false);
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // LOAD: favorites from DB
        // ─────────────────────────────────────────────────────────────────────────
        const loadFavorites = async () => {
            try {
                const { data, error } = await supabase
                    .from('favorites')
                    .select('creator_id')
                    .eq('user_id', user.id);
                if (error) throw error;
                const fav = {};
                (data || []).forEach(f => { fav[f.creator_id] = true; });
                setFavorites(fav);
            } catch(e) { /* keep empty */ }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // LOAD: conversations + messages
        // ─────────────────────────────────────────────────────────────────────────
        const loadConversations = async (bId) => {
            const bid = bId || brandId;
            if (!bid) return;
            setLoadingInbox(true);
            try {
                const { data, error } = await supabase
                    .from('conversations')
                    .select('*, creator:creators(id,name,country,rating)')
                    .eq('brand_id', bid)
                    .order('last_message_at', { ascending: false });
                if (error) throw error;
                const mapped = (data || []).map(c => ({
                    id:      c.id,
                    name:    c.creator?.name || 'Creator',
                    preview: c.last_message || '…',
                    time:    relativeTime(c.last_message_at),
                    unread:  (c.unread_count || 0) > 0,
                    creatorId: c.creator_id,
                    chat:    [] // loaded on demand
                }));
                setConversations(mapped);
                if (mapped.length > 0 && !activeConvId) setActiveConvId(mapped[0].id);
            } catch(e) { /* keep empty */ }
            finally { setLoadingInbox(false); }
        };

        const loadMessages = async (convId) => {
            if (!convId) return;
            try {
                const { data, error } = await supabase
                    .from('messages')
                    .select('*')
                    .eq('conversation_id', convId)
                    .order('created_at', { ascending: true });
                if (error) throw error;
                const mapped = (data || []).map(m => ({
                    from: m.sender_type,
                    text: m.message_text,
                    time: relativeTime(m.created_at),
                    file: m.file_name ? { name: m.file_name, size: m.file_size || '' } : null
                }));
                setMessages(prev => ({ ...prev, [convId]: mapped }));
                // mark as read
                await supabase.from('conversations').update({ unread_count: 0 }).eq('id', convId);
                setConversations(cs => cs.map(c => c.id === convId ? { ...c, unread: false } : c));
            } catch(e) { /* keep empty */ }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // LOAD: notifications from DB
        // ─────────────────────────────────────────────────────────────────────────
        const loadNotifications = async () => {
            try {
                const { data, error } = await supabase
                    .from('notifications')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('created_at', { ascending: false })
                    .limit(20);
                if (error) throw error;
                if (data && data.length > 0) setNotifications(data);
            } catch(e) { /* keep fallback */ }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // INITIAL LOAD + real-time subscriptions
        // ─────────────────────────────────────────────────────────────────────────
        useEffect(() => {
            let campaignSub, notifSub, walletSub;

            const init = async () => {
                const bid = await loadBrand();
                await Promise.all([
                    loadCreators(),
                    loadCampaigns(),
                    loadFavorites(),
                    loadNotifications(),
                    loadWalletBalance(),
                ]);
                if (bid) { await loadConversations(bid); await subscribeApplications(bid); }

                // ── Real-time: campaign updates ──
                campaignSub = supabase
                    .channel('rt-campaigns')
                    .on('postgres_changes', {
                        event: '*', schema: 'public', table: 'campaigns',
                        filter: `user_id=eq.${user.id}`
                    }, () => loadCampaigns())
                    .subscribe();

                // ── Real-time: new notifications ──
                notifSub = supabase
                    .channel('rt-notifications')
                    .on('postgres_changes', {
                        event: 'INSERT', schema: 'public', table: 'notifications',
                        filter: `user_id=eq.${user.id}`
                    }, (payload) => {
                        setNotifications(prev => [payload.new, ...prev]);
                        addToast(`🔔 ${payload.new.title}`);
                    })
                    .subscribe();

                // ── Real-time: wallet balance (catches webhook-confirmed payments) ──
                walletSub = supabase
                    .channel('rt-wallet')
                    .on('postgres_changes', {
                        event: 'UPDATE', schema: 'public', table: 'brands',
                        filter: `user_id=eq.${user.id}`
                    }, (payload) => {
                        if (payload.new.wallet_balance !== undefined) {
                            setWalletBalance(payload.new.wallet_balance || 0);
                        }
                    })
                    .subscribe();
            };

            init();

            return () => {
                campaignSub?.unsubscribe();
                notifSub?.unsubscribe();
                walletSub?.unsubscribe();
            };
        }, []);

        // Load messages when conversation changes
        useEffect(() => {
            if (activeConvId && !messages[activeConvId]) loadMessages(activeConvId);
        }, [activeConvId]);

        // ── Real-time: messages in active conversation ──
        useEffect(() => {
            if (!activeConvId) return;
            const msgSub = supabase
                .channel(`rt-messages-${activeConvId}`)
                .on('postgres_changes', {
                    event: 'INSERT', schema: 'public', table: 'messages',
                    filter: `conversation_id=eq.${activeConvId}`
                }, (payload) => {
                    const newMsg = {
                        from: payload.new.sender_type,
                        text: payload.new.message_text,
                        time: 'Just now',
                        file: payload.new.file_name ? { name: payload.new.file_name, size: payload.new.file_size || '' } : null
                    };
                    setMessages(prev => ({
                        ...prev,
                        [activeConvId]: [...(prev[activeConvId] || []), newMsg]
                    }));
                })
                .subscribe();
            return () => msgSub.unsubscribe();
        }, [activeConvId]);

        const handleLogout = async () => {
            await supabase.auth.signOut();
            if (user?.id) localStorage.removeItem(`vy_onboarded_${user.id}`);
            setUser(null); setView('landing');
        };

        const togglePanel = (p) => setOpenPanel(prev => prev === p ? null : p);
        const closePanel  = () => setOpenPanel(null);

        const unreadMsgs  = conversations.filter(m => m.unread).length;
        const unreadNotif = notifications.filter(n => n.unread === true || n.read === false).length;

        const addToast = (msg, type='success') => {
            const id = Date.now();
            setToasts(t => [...t, {id, msg, type}]);
            setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
        };

        const toggleFavorite = async (creatorId) => {
            const isFav = !!favorites[creatorId];
            // Optimistic update
            setFavorites(prev => {
                const next = { ...prev };
                if (isFav) delete next[creatorId]; else next[creatorId] = true;
                return next;
            });
            addToast(isFav ? 'Removed from favorites' : '❤️ Added to favorites');
            try {
                if (isFav) {
                    await supabase.from('favorites').delete()
                        .eq('user_id', user.id).eq('creator_id', creatorId);
                } else {
                    await supabase.from('favorites').insert([{ user_id: user.id, creator_id: creatorId }]);
                }
            } catch(e) {
                // Revert on failure
                setFavorites(prev => {
                    const next = { ...prev };
                    if (isFav) next[creatorId] = true; else delete next[creatorId];
                    return next;
                });
                addToast('❌ Could not update favorites', 'error');
            }
        };

        const openCampaignDetail = (camp, view = 'details') => {
            setDetailCamp(camp);
            setDetailView(view);
            setAppCampaignId(camp.id);
            setActiveNav('campaign-detail');
            closePanel();
            loadApplications(camp.id);
        };

        const updateCampaignStatus = async (campId, newStatus, extra={}) => {
            // Optimistic UI update (progress is UI-only, not a DB column)
            setCampaigns(prev => prev.map(c => c.id === campId ? {...c, status: newStatus, ...extra} : c));
            if (detailCamp?.id === campId) setDetailCamp(prev => ({...prev, status: newStatus, ...extra}));
            try {
                // Only send DB-valid columns — never send 'progress' or other UI-only fields
                const update = { status: newStatus, updated_at: new Date().toISOString() };
                if (newStatus === 'approved') update.approved_at = new Date().toISOString();
                if (newStatus === 'delivered') update.delivered_at = new Date().toISOString();
                const { error } = await supabase.from('campaigns').update(update).eq('id', campId);
                if (error) throw error;
                await supabase.from('notifications').insert([{
                    user_id: user.id, type: 'campaign',
                    title: newStatus === 'approved' ? '✅ Video approved!' : `Campaign updated`,
                    subtitle: newStatus === 'approved'
                        ? 'Your video is approved and ready to run as an ad.'
                        : `Campaign status changed to ${newStatus}`,
                    icon: newStatus === 'approved' ? '✅' : newStatus === 'revision' ? '🔄' : '📦'
                }]);
            } catch(e) {
                addToast('❌ Update failed — try again', 'error');
                loadCampaigns(); // reload to restore correct state from DB
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Publish campaign → marketplace
        // ─────────────────────────────────────────────────────────────────────────
        const publishCampaign = async (campId, opts = {}) => {
            try {
                const currentBalance = await loadWalletBalance();

                // Get the campaign's budget amount
                const { data: campData } = await supabase.from('campaigns').select('amount, budget').eq('id', campId).single();
                const campaignCost = campData?.amount || 0;

                if (currentBalance <= 0) {
                    addToast(`⚠️ Insufficient funds. Please top up your wallet before publishing.`, 'error');
                    setPayContext({ amount: `$500`, type: 'topup_required' });
                    setShowPayment(true);
                    return;
                }
                if (currentBalance < campaignCost) {
                    addToast(`⚠️ Insufficient funds. You need $${campaignCost.toLocaleString()} but only have $${currentBalance.toLocaleString()} in your wallet.`, 'error');
                    setPayContext({ amount: `$${campaignCost.toLocaleString()}`, type: 'topup_required' });
                    setShowPayment(true);
                    return;
                }

                const { error } = await supabase.from('campaigns').update({
                    status: 'published',
                    published_at: new Date().toISOString(),
                    requires_shipping: opts.requiresShipping ?? false,
                    reward_cash: opts.rewardCash || null,
                    reward_product: opts.rewardProduct || false,
                    is_active: true,
                    updated_at: new Date().toISOString(),
                }).eq('id', campId);
                if (error) throw error;

                // Deduct campaign cost from wallet
                if (campaignCost > 0) {
                    const newBal = Math.max(0, currentBalance - campaignCost);
                    await supabase.from('brands').update({ wallet_balance: newBal }).eq('user_id', user.id);
                    setWalletBalance(newBal);
                }

                // Notify brand that campaign is live
                await supabase.from('notifications').insert([{
                    user_id: user.id, type: 'campaign',
                    title: '🚀 Campaign published!',
                    body: 'Your campaign is live on the marketplace. Creators can now apply.',
                    read: false,
                }]).then(() => {}).catch(() => {});

                addToast('🚀 Campaign published! Creators can now apply.');
                await loadCampaigns();
            } catch(e) {
                addToast('❌ Publish failed: ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Load applications for a campaign
        // ─────────────────────────────────────────────────────────────────────────
        const loadApplications = async (campId) => {
            setLoadingApps(true);
            try {
                const { data, error } = await supabase
                    .from('applications')
                    .select('*, profiles:user_id(id, first_name, last_name, photo_url, tiktok_handle, instagram_handle)')
                    .eq('campaign_id', campId)
                    .neq('status', 'revoked')
                    .order('created_at', { ascending: false });
                if (error) throw error;
                setApplications(data || []);
            } catch(e) {
                addToast('❌ Could not load applications', 'error');
            } finally {
                setLoadingApps(false);
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Accept application → create task → notify creator
        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Accept application → create task → notify creator
        // FIX: Adds creator_name to task row, uses correct filming deadlines,
        //      syncs both applications.status AND tasks.state in one operation
        // ─────────────────────────────────────────────────────────────────────────
        const acceptApplication = async (app, camp) => {
            try {
                const shipping = camp._raw?.requires_shipping ?? false;
                const deadlineHrs = shipping ? 5 * 24 : 24;
                const deadline = new Date(Date.now() + deadlineHrs * 3600 * 1000).toISOString();

                // Resolve creator name for task row
                let creatorName = app.creator_name || null;
                if (!creatorName) {
                    try {
                        const { data: prof } = await supabase
                            .from('profiles').select('first_name, last_name').eq('id', app.user_id).single();
                        creatorName = [prof?.first_name, prof?.last_name].filter(Boolean).join(' ') || null;
                    } catch(_) {}
                }

                // 1. Mark this application accepted
                await supabase.from('applications').update({
                    status: 'accepted',
                    updated_at: new Date().toISOString(),
                }).eq('id', app.id);

                // 2. Create task — state machine starts here
                const taskState = shipping ? 'selected' : 'selected_digital';
                const { error: taskErr } = await supabase.from('tasks').upsert({
                    user_id:          app.user_id,
                    campaign_id:      app.campaign_id,
                    application_id:   app.id,
                    brand_id:         brandId || null,
                    creator_name:     creatorName,
                    state:            taskState,
                    requires_shipping: shipping,
                    filming_deadline:  shipping ? null : deadline,
                    shipping_deadline: shipping ? new Date(Date.now() + 5 * 24 * 3600 * 1000).toISOString() : null,
                    created_at:        new Date().toISOString(),
                    updated_at:        new Date().toISOString(),
                }, { onConflict: 'application_id' });
                if (taskErr) throw taskErr;

                // 3. Notify creator with full context
                const campTitle = camp.title || camp._raw?.title || 'your campaign';
                await supabase.from('notifications').insert({
                    user_id: app.user_id,
                    type: 'task',
                    title: '🎉 You got the job!',
                    body: `${campTitle} — You've been selected! ${shipping ? 'Your product will be shipped soon. Confirm receipt when it arrives.' : 'You have 24 hours to film and submit your video.'}`,
                    read: false,
                    created_at: new Date().toISOString(),
                });

                // 4. Update campaign to in-progress with creator name
                await supabase.from('campaigns').update({
                    status:      'in-progress',
                    creator_id:  app.user_id,
                    updated_at:  new Date().toISOString(),
                }).eq('id', camp.id);

                // 5. Reject all other PENDING applicants (not already accepted/rejected)
                await supabase.from('applications').update({
                    status: 'rejected',
                    updated_at: new Date().toISOString(),
                }).eq('campaign_id', app.campaign_id).eq('status', 'pending').neq('id', app.id);

                addToast(`✅ ${creatorName || 'Creator'} hired! They've been notified.`);
                await loadCampaigns();
                await loadApplications(app.campaign_id);
                setDetailCamp(prev => prev ? {...prev, status: 'in-progress'} : prev);
            } catch(e) {
                addToast('❌ Could not accept: ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Reject application → notify creator
        // ─────────────────────────────────────────────────────────────────────────
        const rejectApplication = async (app) => {
            try {
                await supabase.from('applications').update({
                    status: 'rejected',
                    updated_at: new Date().toISOString(),
                }).eq('id', app.id);

                await supabase.from('notifications').insert({
                    user_id: app.user_id,
                    type: 'application',
                    title: 'Application update',
                    body: 'Your application was not selected this time. Keep applying — more campaigns are posted daily!',
                    read: false,
                    created_at: new Date().toISOString(),
                });

                setApplications(prev => prev.filter(a => a.id !== app.id));
                addToast('Application declined.');
            } catch(e) {
                addToast('❌ ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Mark product as shipped → notify creator
        // FIX: Also syncs applications.status to 'confirm' so creator app shows correct state
        // ─────────────────────────────────────────────────────────────────────────
        const markProductShipped = async (camp, trackingInfo) => {
            try {
                const { data: tasks, error: taskErr } = await supabase
                    .from('tasks')
                    .select('id, user_id, application_id')
                    .eq('campaign_id', camp.id)
                    .in('state', ['selected', 'confirm', 'selected_digital', 'shipped'])
                    .limit(1);
                if (taskErr) throw taskErr;
                if (!tasks?.length) throw new Error('No active task found for this campaign.');

                const task = tasks[0];

                // Update task state to 'confirm' (creator needs to acknowledge receipt)
                await supabase.from('tasks').update({
                    state: 'confirm',
                    shipping_deadline: new Date(Date.now() + 5 * 24 * 3600 * 1000).toISOString(),
                    tracking_number: trackingInfo.tracking || null,
                    carrier: trackingInfo.carrier || null,
                    updated_at: new Date().toISOString(),
                }).eq('id', task.id);

                // Sync application status to keep both tables in lockstep
                if (task.application_id) {
                    await supabase.from('applications').update({
                        status: 'confirm',
                        updated_at: new Date().toISOString(),
                    }).eq('id', task.application_id);
                }

                // Notify creator with full tracking info
                const trackMsg = trackingInfo.tracking
                    ? ` Tracking #: ${trackingInfo.carrier ? trackingInfo.carrier + ' ' : ''}${trackingInfo.tracking}.`
                    : '';
                await supabase.from('notifications').insert({
                    user_id: task.user_id,
                    type: 'task',
                    title: '📦 Package on the way!',
                    body: `Your product for "${camp.title}" has been shipped.${trackMsg} Expected in ~5 days. Tap "I received my product" when it arrives to start your filming window.`,
                    read: false,
                    created_at: new Date().toISOString(),
                });

                addToast('📦 Shipping confirmed! Creator has been notified.');
                await loadCampaigns();
                // Optimistic update so timeline and video delivery card refresh immediately
                setDetailCamp(prev => prev ? {
                    ...prev,
                    _raw: {
                        ...prev._raw,
                        task_state: 'confirm',
                        shipping_deadline: new Date(Date.now() + 5 * 24 * 3600 * 1000).toISOString()
                    }
                } : prev);
                setShipModal(null);
            } catch(e) {
                addToast('❌ ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Approve submitted video → create payout → notify creator
        // FIX: Also syncs application.status, adds creator_name to payout row,
        //      deducts amount from brand wallet, and handles already-approved tasks
        // ─────────────────────────────────────────────────────────────────────────
        const approveVideo = async (camp) => {
            try {
                const raw = camp._raw || {};

                // 1. Update campaign status
                await supabase.from('campaigns').update({
                    status: 'approved',
                    approved_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                }).eq('id', camp.id);

                // 2. Find the submitted task (could be 'submitted' or 'revision' state)
                const { data: tasks } = await supabase
                    .from('tasks')
                    .select('id, user_id, campaign_id, application_id, revision_count')
                    .eq('campaign_id', camp.id)
                    .in('state', ['submitted', 'revision'])
                    .order('updated_at', { ascending: false })
                    .limit(1);

                if (tasks?.length) {
                    const task = tasks[0];

                    // 2a. Update task state to approved
                    await supabase.from('tasks').update({
                        state: 'approved',
                        approved_at: new Date().toISOString(),
                        updated_at: new Date().toISOString(),
                    }).eq('id', task.id);

                    // 2b. FIX: Sync application status so both tables stay consistent
                    if (task.application_id) {
                        await supabase.from('applications').update({
                            status: 'completed',
                            updated_at: new Date().toISOString(),
                        }).eq('id', task.application_id);
                    }

                    // 3. FIX: Resolve creator name for payout row
                    let creatorName = null;
                    let creatorPaypalEmail = null;
                    try {
                        const { data: profile } = await supabase
                            .from('profiles')
                            .select('first_name, last_name, paypal_email')
                            .eq('id', task.user_id)
                            .single();
                        creatorName = [profile?.first_name, profile?.last_name].filter(Boolean).join(' ') || null;
                        creatorPaypalEmail = profile?.paypal_email || null;
                    } catch(_) {}

                    // 4. Create payout row for creator (70% of campaign amount)
                    const earnAmt = parseFloat(raw.amount || raw.reward_cash || 0) * 0.70;
                    // FIX: Only create payout if not already created
                    const { data: existingPayout } = await supabase
                        .from('payouts').select('id').eq('task_id', task.id).maybeSingle();
                    if (!existingPayout && earnAmt > 0) {
                        await supabase.from('payouts').insert({
                            user_id: task.user_id,
                            task_id: task.id,
                            campaign_id: camp.id,
                            campaign_title: camp.title,
                            amount: earnAmt,
                            amount_usd: earnAmt,
                            creator_name: creatorName,
                            paypal_email: creatorPaypalEmail,
                            status: 'pending',
                            type: 'campaign',
                            created_at: new Date().toISOString(),
                        });
                    }

                    // 5. FIX: Deduct campaign cost from brand wallet
                    const brandCost = parseFloat(raw.amount || raw.reward_cash || 0);
                    if (brandCost > 0) {
                        try {
                            const { data: brandRow } = await supabase
                                .from('brands').select('wallet_balance').eq('user_id', user.id).single();
                            if (brandRow) {
                                const newBal = Math.max(0, (brandRow.wallet_balance || 0) - brandCost);
                                await supabase.from('brands').update({ wallet_balance: newBal }).eq('user_id', user.id);
                                setWalletBalance(newBal);
                            }
                        } catch(_) {}
                    }

                    // 6. Notify creator
                    await supabase.from('notifications').insert({
                        user_id: task.user_id,
                        type: 'payout',
                        title: '✅ Video approved!',
                        body: `"${camp.title}" was approved! $${earnAmt.toFixed(0)} has been added to your earnings — pending payout on the next cycle.`,
                        read: false,
                        created_at: new Date().toISOString(),
                    });
                }

                addToast('✅ Video approved! Creator earnings queued for payout.');
                setVideoPreviewUrl(null);
                await loadCampaigns();
                if (detailCamp?.id === camp.id) setDetailCamp(prev => ({...prev, status: 'approved'}));
            } catch(e) {
                addToast('❌ Approve failed: ' + e.message, 'error');
            }
        };

        // ─────────────────────────────────────────────────────────────────────────
        // WORKFLOW: Request revision → notify creator (max 1 revision)
        // FIX: Syncs applications.status, resets videoPreviewUrl, updates detailCamp
        // ─────────────────────────────────────────────────────────────────────────
        const requestRevision = async (camp, note) => {
            try {
                const { data: tasks } = await supabase
                    .from('tasks')
                    .select('id, user_id, revision_count, application_id')
                    .eq('campaign_id', camp.id)
                    .in('state', ['submitted', 'revision'])
                    .order('updated_at', { ascending: false })
                    .limit(1);

                if (!tasks?.length) throw new Error('No submitted task found. The creator may not have uploaded yet.');
                const task = tasks[0];

                if ((task.revision_count || 0) >= 1) {
                    addToast('⚠️ Only 1 revision is allowed per job. You must approve or the video auto-approves after 24 hrs.', 'error');
                    return;
                }

                // Update task to revision state with 24h deadline
                const revDeadline = new Date(Date.now() + 24 * 3600 * 1000).toISOString();
                await supabase.from('tasks').update({
                    state: 'revision',
                    revision_deadline: revDeadline,
                    revision_count: (task.revision_count || 0) + 1,
                    revision_note: note || null,
                    updated_at: new Date().toISOString(),
                }).eq('id', task.id);

                // FIX: Sync application status
                if (task.application_id) {
                    await supabase.from('applications').update({
                        status: 'revision',
                        revision_note: note || null,
                        updated_at: new Date().toISOString(),
                    }).eq('id', task.application_id);
                }

                // Update campaign status
                await supabase.from('campaigns').update({
                    status: 'revision',
                    updated_at: new Date().toISOString(),
                }).eq('id', camp.id);

                // Notify creator with the revision note prominently

        // ─────────────────────────────────────────────────────────────────────────
        const _videoUrlCache = React.useRef({});
        const loadVideoForReview = async (camp) => {
            try {
                setVideoPreviewUrl(null);
                const { data: tasks } = await supabase
                    .from('tasks')
                    .select('video_path, state, updated_at')
                    .eq('campaign_id', camp._raw?.id || camp.id)
                    .in('state', ['submitted', 'approved', 'auto_approved', 'revision'])
                    .not('video_path', 'is', null)
                    .order('updated_at', { ascending: false })
                    .limit(1);

                const path = tasks?.[0]?.video_path;
                if (!path) { addToast('No submitted video found yet.', 'error'); return; }

                // If already a full URL (e.g. external CDN), use directly
                if (path.startsWith('http')) { setVideoPreviewUrl(path); return; }

                // Check 55-min cache before hitting Supabase Storage
                const cached = _videoUrlCache.current[path];
                if (cached && cached.expiresAt > Date.now()) { setVideoPreviewUrl(cached.url); return; }

                // Generate 1-hour signed URL from Supabase Storage
                const { data, error } = await supabase.storage
                    .from('videos')
                    .createSignedUrl(path, 3600);
                if (error || !data?.signedUrl) throw new Error(error?.message || 'Could not generate video URL');
                _videoUrlCache.current[path] = { url: data.signedUrl, expiresAt: Date.now() + 55 * 60 * 1000 };

    // ─── Creator Modal ────────────────────────────────────────────────────────────
    function CreatorModal({ creator, onClose, onInvite }) {
        const [tab, setTab] = React.useState('overview');

        const reviews = creator.reviews || 0;
        const basePrice = creator.price || 149;
        const premiumExtra = creator.premium ? 50 : 0;
        const baseOnly = basePrice - premiumExtra;

        // ── Supabase portfolio fetch (preserved) ──────────────────────────────────
        const [portfolioVideos, setPortfolioVideos] = React.useState([]);
        React.useEffect(() => {
            const sb = window._supabase;
            const resolveUrl = (path) => {
                if (!path) return null;
                if (path.startsWith('http')) return path;
                if (!sb) return path;
                try { const { data } = sb.storage.from('videos').getPublicUrl(path); if (data?.publicUrl) return data.publicUrl; } catch(e) {}
                try { const { data } = sb.storage.from('portfolio').getPublicUrl(path); if (data?.publicUrl) return data.publicUrl; } catch(e) {}
                return path;
            };
            const buildVideos = (pitchUrl, extraPaths) => {
                const videos = [];
                if (pitchUrl) videos.push({ label: 'Creator intro video', url: pitchUrl, isIntro: true });
                (Array.isArray(extraPaths) ? extraPaths : []).forEach((p, i) => {
                    const url = resolveUrl(p);
                    if (url) videos.push({ label: `Example #${i+1}`, url, isIntro: false });
                });
                return videos;
            };
            const fetchFresh = async () => {
                if (sb && creator.id) {
                    try {
                        const { data } = await sb.from('profiles').select('*').eq('id', creator.id).single();
                        if (data) {
                            const pitchUrl = (data.pitch_status === 'approved' && data.pitch_video_url) ? data.pitch_video_url : creator.pitch_video_url;
                            let extraPaths = [];
                            for (const col of ['extra_video_paths','example_video_paths','example_video_urls','pitch_video_examples','portfolio_video_urls','portfolio_videos','video_examples']) {
                                if (Array.isArray(data[col]) && data[col].filter(v=>!!v).length > 0) { extraPaths = data[col].filter(v=>!!v); break; }
                            }
                            if (extraPaths.length === 0) {
                                for (const key of Object.keys(data)) {
                                    if (key === 'pitch_video_url') continue;
                                    const val = data[key];
                                    if (Array.isArray(val) && val.length > 0 && typeof val[0] === 'string' && (val[0].includes('video')||val[0].includes('.mp4')||val[0].includes('supabase')||val[0].startsWith('http'))) { extraPaths = val; break; }
                                }
                            }
                            setPortfolioVideos(buildVideos(pitchUrl, extraPaths)); return;
                        }
                    } catch(e) {}
                }
                setPortfolioVideos(buildVideos(creator.pitch_video_url, creator.extra_video_paths));
            };
            fetchFresh();
        }, [creator.id, creator.pitch_video_url, JSON.stringify(creator.extra_video_paths)]);

            <div className="bm-metric-box">
                <div className="bm-metric-label">{label}</div>

                    <div className="bm-service-card">
                        <div className="bm-service-head">
                            <span style={{fontSize:'1.1rem'}}>📸</span>

                        <div className="bm-service-desc">Organic video post on the creator's IG account</div>
