        /* Tags */
        .bm-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.25rem; }
        .bm-tag { background: var(--gray-100); color: var(--gray-700); font-size: 0.78rem; font-weight: 600; padding: 0.25rem 0.65rem; border-radius: 20px; }
        /* Stats */
        .bm-stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .bm-stat-item { }
        .bm-stat-label { font-size: 0.78rem; color: var(--gray-500); font-weight: 600; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.35rem; }
        .bm-stat-val { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 0.4rem; }
        /* Reviews */
        .bm-review-card { border: 1px solid var(--gray-200); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; }
        .bm-review-head { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.6rem; }
        .bm-review-brand-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gray-200); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
        .bm-review-brand-name { font-weight: 700; font-size: 0.88rem; }
        .bm-review-brand-cat { font-size: 0.75rem; color: var(--gray-500); }
        .bm-review-stars { color: #f59e0b; font-size: 0.9rem; margin-bottom: 0.4rem; }
        .bm-review-text { font-size: 0.85rem; color: var(--gray-700); margin-bottom: 0.5rem; font-style: italic; }
        .bm-review-time { font-size: 0.75rem; color: var(--gray-400); }
        .bm-see-more { display: block; width: fit-content; margin: 0.75rem auto 0; border: 1.5px solid #6c47ff; color: #6c47ff; background: none; border-radius: 50px; padding: 0.5rem 1.5rem; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: 'Cabinet Grotesk', sans-serif; }
        /* Audience grid */
        .bm-audience-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
        .bm-audience-box { border: 1px solid var(--gray-200); border-radius: 10px; padding: 0.85rem 1rem; }
        .bm-audience-title { font-weight: 700; font-size: 0.88rem; margin-bottom: 0.6rem; }
        .bm-audience-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; padding: 0.2rem 0; }
        .bm-audience-row span:last-child { font-weight: 700; }
        /* Video thumbnails */
        .bm-video-row { display: flex; gap: 0.65rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1.25rem; }
        .bm-video-thumb { flex-shrink: 0; width: 140px; border-radius: 10px; overflow: hidden; position: relative; cursor: pointer; background: #000; aspect-ratio: 9/16; border: 1px solid var(--gray-200); }
        .bm-video-play { position: absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.25); }
        .bm-video-play-btn { width: 38px; height: 38px; background: rgba(255,255,255,0.92); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .bm-video-badge { position: absolute; top: 6px; left: 6px; background: rgba(99,102,241,0.9); color: white; font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
        .bm-video-duration { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.65); color: white; font-size: 0.65rem; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
        /* Ad perf table */
        .bm-table { width: 100%; border: 1px solid var(--gray-200); border-radius: 10px; overflow: hidden; margin-bottom: 1.25rem; }
        .bm-table-head { display: grid; grid-template-columns: 2fr 1fr 1.5fr; background: white; border-bottom: 1px solid var(--gray-200); padding: 0.65rem 1rem; font-size: 0.75rem; color: var(--gray-500); font-weight: 700; }
        .bm-table-group { background: #f5f3ff; padding: 0.5rem 1rem; font-size: 0.82rem; font-weight: 700; color: #4c1d95; }
        .bm-table-row { display: grid; grid-template-columns: 2fr 1fr 1.5fr; padding: 0.65rem 1rem; border-top: 1px solid var(--gray-200); font-size: 0.85rem; }
        .bm-table-row .blurred { filter: blur(5px); user-select: none; color: var(--gray-400); }
        /* Legend */
        .bm-legend { display: flex; gap: 1rem; font-size: 0.82rem; font-weight: 600; margin-bottom: 1rem; }
        .bm-legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.35rem; }
        /* Bar chart */
        .bm-bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; margin-bottom: 0.35rem; }
        .bm-bar-chart-labels { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--gray-400); margin-bottom: 1rem; }
        .bm-bar { border-radius: 3px 3px 0 0; flex: 1; }
        /* Latest reels */
        .bm-reel-card { flex-shrink: 0; width: 160px; border-radius: 10px; overflow: hidden; background: #111; position: relative; }
        .bm-reel-stats { background: rgba(0,0,0,0.75); color: white; padding: 0.5rem 0.65rem; font-size: 0.75rem; }
        .bm-reel-stat-row { display: flex; justify-content: space-between; padding: 0.1rem 0; }
        .bm-reel-date { position: absolute; top: 6px; left: 6px; background: white; color: var(--black); font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; display: flex; align-items: center; gap: 0.3rem; }
        /* keep old modal-sheet for other modals */
        .modal-sheet {
            background: white; border-radius: 20px;
            max-width: 880px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        .modal-hdr {
            padding: 2rem; border-bottom: 1px solid var(--gray-200);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; background: white; z-index: 10;
        }
        .modal-creator-info { display: flex; align-items: center; gap: 1rem; }
        .modal-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: linear-gradient(135deg, var(--indigo), #9333ea);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 1.4rem;
            font-family: 'Cabinet Grotesk', sans-serif;
        }
        .modal-name { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.2rem; }
        .modal-rating { display: flex; align-items: center; gap: 0.4rem; color: var(--amber); font-weight: 600; font-size: 0.9rem; }
        .modal-close {
            background: var(--gray-100); border: none; cursor: pointer;
            width: 36px; height: 36px; border-radius: 50%; font-size: 1.25rem;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: var(--gray-200); }
        .modal-tabs { display: flex; gap: 2rem; padding: 0 2rem; border-bottom: 1px solid var(--gray-200); }
        .modal-tab {
            padding: 1rem 0; font-weight: 600; font-size: 0.9rem;
            color: var(--gray-400); cursor: pointer;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .modal-tab:hover { color: var(--black); }
        .modal-tab.active { color: var(--black); border-bottom-color: var(--black); }
        .modal-body { padding: 2rem; }
        .perf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
        .perf-cell { background: var(--gray-50); padding: 1.5rem; border-radius: 14px; text-align: center; }
        .perf-label { font-size: 0.78rem; color: var(--gray-600); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.5rem; }
        .perf-val { font-family: 'Cabinet Grotesk', sans-serif; font-size: 2.25rem; font-weight: 800; }
        .perf-bar { height: 4px; background: var(--gray-200); border-radius: 2px; margin-top: 0.75rem; overflow: hidden; }
        .perf-fill { height: 100%; background: var(--lime-dark); border-radius: 2px; }
        .price-block { background: var(--gray-50); padding: 1.5rem; border-radius: 14px; margin-bottom: 1.75rem; display: flex; justify-content: space-between; align-items: center; }
        .price-block-label { font-size: 0.85rem; color: var(--gray-600); font-weight: 600; }
        .price-block-val { font-family: 'Cabinet Grotesk', sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--indigo); }

        /* Brief Modal */
        .brief-form-wrap { padding: 2rem; }
        .brief-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
        .brief-sub { color: var(--gray-600); margin-bottom: 2rem; font-size: 0.9rem; }


        /* ===================== ROTATING HERO BADGE ===================== */
        .hero-rotating-badge {
            display:inline-flex; align-items:center; gap:0.5rem;
            background:rgba(164,245,99,0.15); border:1.5px solid var(--lime);
            border-radius:50px; padding:0.4rem 1.1rem; margin-bottom:1.25rem;
            font-size:0.82rem; font-weight:700; color:var(--black);
        }
        .rotating-word {
            color:var(--lime-dark); display:inline-block;
            animation:fadeSlide 0.4s ease;
        }
        @keyframes fadeSlide { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

        /* ===================== MOBILE NAV ===================== */
        .nav-hamburger {
            display:none; flex-direction:column; gap:5px; cursor:pointer;
            padding:0.4rem; background:none; border:none;
        }
        .nav-hamburger span { display:block; width:22px; height:2px; background:var(--black); border-radius:2px; transition:all 0.25s; }
        .mobile-menu {
            display:none; position:fixed; inset:0; background:white; z-index:200;
            flex-direction:column; padding:5rem 2rem 2rem; gap:0.25rem; overflow-y:auto;
        }
        .mobile-menu.open { display:flex; }
        .mobile-menu-link {
            font-size:1.2rem; font-weight:700; padding:1rem 0;
            border-bottom:1px solid var(--gray-100); cursor:pointer;
            display:flex; justify-content:space-between; align-items:center;
        }
        .mobile-menu-close {
            position:fixed; top:1.25rem; right:1.5rem; background:none; border:none;
            font-size:1.5rem; cursor:pointer; z-index:201; color:var(--black);
        }
        .mobile-menu-cta { margin-top:1.5rem; display:flex; flex-direction:column; gap:0.75rem; }

        /* ===================== PRODUCT TYPE TABS ===================== */
        .product-type-section { background:var(--gray-50); padding:6rem 2.5rem; }
        .product-type-tabs { display:flex; justify-content:center; gap:0.5rem; margin-bottom:3.5rem; flex-wrap:wrap; }
        .product-type-tab {
            padding:0.65rem 1.5rem; border-radius:50px; border:2px solid var(--gray-200);
            background:white; font-size:0.9rem; font-weight:700; cursor:pointer;
            transition:all 0.2s; display:flex; align-items:center; gap:0.5rem;
        }
        .product-type-tab:hover { border-color:var(--gray-400); }
        .product-type-tab.active { background:var(--black); color:white; border-color:var(--black); }
        .product-type-panel { display:grid; grid-template-columns:1fr 1fr; gap:4rem; align-items:center; max-width:1100px; margin:0 auto; }
        .product-type-visual {
            border-radius:24px; padding:3rem; min-height:340px;
            display:flex; flex-direction:column; justify-content:space-between;
            position:relative; overflow:hidden;
        }
        .product-type-visual.ecom { background:linear-gradient(135deg,#1a0a2e,#2d1b69); }
        .product-type-visual.digital { background:linear-gradient(135deg,#0f3460,#16213e); }
        .product-type-visual.b2b { background:linear-gradient(135deg,#1a3a2a,#0a1e0a); }
        .product-type-visual-label { color:rgba(255,255,255,0.5); font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; }
        .product-type-visual-stat { color:white; font-size:3rem; font-weight:900; line-height:1; margin:1rem 0 0.25rem; }
        .product-type-visual-sub { color:rgba(255,255,255,0.65); font-size:0.85rem; }
        .product-type-visual-tags { display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:1.5rem; }
        .product-type-visual-tag { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); border-radius:6px; padding:0.3rem 0.7rem; color:white; font-size:0.72rem; font-weight:600; }
        .product-type-copy h3 { font-size:1.75rem; font-weight:900; margin-bottom:1rem; line-height:1.25; }
        .product-type-copy p { color:var(--gray-600); line-height:1.8; margin-bottom:1.5rem; }
        .product-type-bullets { list-style:none; display:flex; flex-direction:column; gap:0.65rem; }
        .product-type-bullet { display:flex; align-items:center; gap:0.65rem; font-size:0.92rem; font-weight:600; }
        .product-type-bullet::before { content:'\2713'; color:var(--lime-dark); font-weight:900; font-size:1rem; }

        /* ===================== LEAD CAPTURE FORM ===================== */
        .lead-form-section { background:var(--black); padding:5rem 2.5rem; }
        .lead-form-inner { max-width:900px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:4rem; align-items:center; }
        .lead-form-copy h2 { color:white; font-size:2rem; font-weight:900; margin-bottom:1rem; line-height:1.3; }
        .lead-form-copy p { color:rgba(255,255,255,0.65); line-height:1.8; }
        .lead-form-copy .lead-perks { margin-top:1.5rem; display:flex; flex-direction:column; gap:0.6rem; }
        .lead-perk { display:flex; align-items:center; gap:0.65rem; color:rgba(255,255,255,0.8); font-size:0.88rem; font-weight:600; }
        .lead-perk-icon { font-size:1.1rem; }
        .lead-form-card { background:white; border-radius:20px; padding:2rem; }
        .lead-form-card h3 { font-size:1.1rem; font-weight:800; margin-bottom:1.5rem; }
        .lead-field { margin-bottom:1rem; }
        .lead-field label { display:block; font-size:0.78rem; font-weight:700; margin-bottom:0.4rem; color:var(--gray-600); text-transform:uppercase; letter-spacing:0.05em; }
        .lead-field input, .lead-field select { width:100%; padding:0.75rem 1rem; border:1.5px solid var(--gray-200); border-radius:10px; font-family:inherit; font-size:0.9rem; transition:border-color 0.2s; box-sizing:border-box; background:white; }
        .lead-field input:focus, .lead-field select:focus { outline:none; border-color:var(--black); }
        .lead-success { text-align:center; padding:2rem 0; }
        .lead-success-icon { font-size:2.5rem; margin-bottom:1rem; }
        .lead-success h4 { font-weight:800; margin-bottom:0.5rem; }
        .lead-success p { color:var(--gray-600); font-size:0.9rem; }

        /* ===================== HOW IT WORKS VISUAL ===================== */
        .how-visual-cycle { display:flex; align-items:center; justify-content:center; gap:0; margin-top:3.5rem; flex-wrap:wrap; }
        .cycle-step { display:flex; flex-direction:column; align-items:center; gap:0.75rem; width:190px; text-align:center; }
        .cycle-icon-ring { width:72px; height:72px; border-radius:50%; border:3px solid var(--gray-200); background:white; display:flex; align-items:center; justify-content:center; font-size:1.6rem; position:relative; transition:all 0.3s; box-shadow:0 4px 16px rgba(0,0,0,0.07); }
        .cycle-step:hover .cycle-icon-ring { border-color:var(--lime); transform:scale(1.08); }
        .cycle-step-num { position:absolute; top:-6px; right:-6px; width:22px; height:22px; background:var(--black); border-radius:50%; color:white; font-size:0.65rem; font-weight:800; display:flex; align-items:center; justify-content:center; }
        .cycle-label { font-size:0.85rem; font-weight:700; color:var(--black); }
        .cycle-sublabel { font-size:0.75rem; color:var(--gray-600); line-height:1.5; margin-top:-0.35rem; }
        .cycle-arrow { font-size:1.5rem; color:var(--gray-300); margin:0 0.25rem; padding-bottom:2.5rem; }

        /* ===================== AGENCY BAND ===================== */
        .agency-band { background:linear-gradient(135deg,#1a0a2e,#2d1b69); padding:4rem 2.5rem; text-align:center; }
        .agency-band h3 { color:white; font-size:1.6rem; font-weight:900; margin-bottom:0.75rem; }
        .agency-band p { color:rgba(255,255,255,0.7); font-size:1rem; margin-bottom:2rem; max-width:540px; margin-left:auto; margin-right:auto; }
        .agency-perks { display:flex; justify-content:center; gap:2rem; flex-wrap:wrap; margin-bottom:2rem; }
        .agency-perk { color:rgba(255,255,255,0.85); font-size:0.88rem; font-weight:600; display:flex; align-items:center; gap:0.5rem; }

        /* ===================== WALLET PRICING ===================== */
        .wallet-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1.25rem; max-width:1300px; margin:0 auto; }
        .wallet-card { background:white; border:2px solid var(--gray-200); border-radius:18px; padding:1.75rem; transition:all 0.25s; position:relative; }
        .wallet-card:hover { transform:translateY(-4px); box-shadow:0 12px 36px rgba(0,0,0,0.08); }
        .wallet-card.popular { border-color:var(--lime); background:linear-gradient(135deg,rgba(164,245,99,0.06),white); }
        .wallet-card-badge { position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:var(--lime); color:var(--black); padding:0.2rem 0.9rem; border-radius:50px; font-size:0.72rem; font-weight:800; white-space:nowrap; }
        .wallet-name { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--gray-600); margin-bottom:0.5rem; }
        .wallet-price { font-size:2.2rem; font-weight:900; color:var(--black); line-height:1; }
        .wallet-price span { font-size:1rem; font-weight:600; color:var(--gray-500); }
        .wallet-get { font-size:0.82rem; font-weight:700; color:var(--lime-dark); margin:0.4rem 0 1rem; }
        .wallet-feats { list-style:none; display:flex; flex-direction:column; gap:0.45rem; }
        .wallet-feat { font-size:0.8rem; color:var(--gray-600); display:flex; gap:0.5rem; align-items:flex-start; line-height:1.5; }
        .wallet-feat::before { content:'\2713'; color:var(--lime-dark); font-weight:800; flex-shrink:0; }
        .pricing-mode-switch { display:flex; justify-content:center; gap:0; margin-bottom:2.5rem; }
        .pricing-mode-btn { padding:0.6rem 1.6rem; border:2px solid var(--gray-200); background:white; font-family:inherit; font-size:0.88rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
        .pricing-mode-btn:first-child { border-radius:10px 0 0 10px; border-right:none; }
        .pricing-mode-btn:last-child { border-radius:0 10px 10px 0; }
        .pricing-mode-btn.active { background:var(--black); color:white; border-color:var(--black); }

        /* ===================== MEGA NAV ===================== */
        .nav-dropdown { position: relative; }
        .nav-dropdown-menu {
            display: none; position: absolute; top: calc(100% + 12px); left: 50%;
            transform: translateX(-50%); background: white;
            border: 1.5px solid var(--gray-200); border-radius: 16px;
            padding: 1.25rem; min-width: 360px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.12); z-index: 100;
        }
        .nav-dropdown:hover .nav-dropdown-menu { display: block; }
        .nav-dd-group-label {
            font-size: 0.68rem; font-weight: 700; color: var(--gray-400);
            text-transform: uppercase; letter-spacing: 0.07em;
            margin-bottom: 0.6rem; margin-top: 0.75rem;
        }
        .nav-dd-group-label:first-child { margin-top: 0; }
        .nav-dd-item {
            display: flex; gap: 0.75rem; align-items: flex-start;
            padding: 0.65rem 0.75rem; border-radius: 10px;
            cursor: pointer; transition: background 0.15s; text-decoration: none;
        }
        .nav-dd-item:hover { background: var(--gray-50); }
        .nav-dd-icon {
            width: 34px; height: 34px; border-radius: 8px;
            background: var(--gray-100); display: flex; align-items: center;
            justify-content: center; font-size: 1rem; flex-shrink: 0;
        }
        .nav-dd-text strong { display: block; font-size: 0.88rem; font-weight: 700; color: var(--black); }
        .nav-dd-text span { font-size: 0.78rem; color: var(--gray-600); line-height: 1.4; }
        .nav-dd-divider { height: 1px; background: var(--gray-200); margin: 0.75rem 0; }

        /* ===================== SCROLLING LOGO BAR ===================== */
        .logo-scroll-wrap { overflow: hidden; width: 100%; margin-top: 1.5rem; }
        .logo-scroll-track {
            display: flex; gap: 4rem; width: max-content;
            animation: logoScroll 28s linear infinite;
        }
        @keyframes logoScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .logo-scroll-item {
            font-family: 'Cabinet Grotesk', sans-serif; font-size: 1.1rem; font-weight: 800;
            color: var(--black); opacity: 0.35; white-space: nowrap; flex-shrink: 0;
        }

        /* ===================== FEATURE ICON BULLETS ===================== */
        .feature-bullets { list-style: none; margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.6rem; }
        .feature-bullet {
            display: flex; align-items: center; gap: 0.65rem;
            font-size: 0.88rem; font-weight: 600; color: var(--gray-600);
        }
        .feature-bullet-icon {
            width: 30px; height: 30px; border-radius: 8px;
            background: rgba(0,0,0,0.06); display: flex; align-items: center;
            justify-content: center; font-size: 0.85rem; flex-shrink: 0;
        }
        .feature-card.lime .feature-bullet-icon { background: rgba(164,245,99,0.35); }

        /* ===================== WHY CHOOSE SECTION ===================== */
        .why-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; max-width: 1100px; margin: 0 auto; }
        .why-card {
            background: white; border: 2px solid var(--gray-200);
            border-radius: 20px; padding: 2.5rem;
            display: flex; gap: 1.25rem; align-items: flex-start;
            transition: all 0.3s; text-align: left;
        }
        .why-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.07); }
        .why-icon {
            width: 48px; height: 48px; border-radius: 14px;
            background: rgba(164,245,99,0.2); display: flex; align-items: center;
            justify-content: center; font-size: 1.4rem; flex-shrink: 0;
        }
        .why-card h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.5rem; }
        .why-card p { font-size: 0.92rem; color: var(--gray-600); line-height: 1.7; }

        /* ===================== CREATOR CATEGORY FILTERS ===================== */
        .creator-showcase { background: var(--gray-50); padding: 7rem 2.5rem; }
        .creator-country-tabs { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .country-tab {
            padding: 0.5rem 1.25rem; border-radius: 50px;
            border: 1.5px solid var(--gray-200); background: white;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 0.4rem;
        }
        .country-tab:hover { border-color: var(--black); }
        .country-tab.active { background: var(--black); color: white; border-color: var(--black); }
        .niche-tabs { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 3rem; }
        .niche-tab {
            padding: 0.45rem 1.1rem; border-radius: 50px;
            border: 1.5px solid var(--gray-200); background: white;
            font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .niche-tab:hover { border-color: var(--gray-400); }
        .niche-tab.active { background: var(--lime); border-color: var(--lime-dark); color: var(--black); }
        .creator-showcase-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.25rem; max-width: 1300px; margin: 0 auto 3rem; }
        .showcase-creator-card {
            background: white; border: 1.5px solid var(--gray-200);
            border-radius: 16px; overflow: hidden; transition: all 0.25s;
        }
        .showcase-creator-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.1); border-color: var(--gray-300); }
        .showcase-creator-thumb {
            height: 220px; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .showcase-creator-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.75rem; font-weight: 800;
            font-family: 'Cabinet Grotesk', sans-serif;
        }
        .showcase-creator-niche {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255,255,255,0.9); padding: 0.2rem 0.6rem;
            border-radius: 6px; font-size: 0.65rem; font-weight: 700; color: var(--black);
        }
        .premium-crown {
            position: absolute; top: 10px; right: 10px;
            background: rgba(99,102,241,0.9); padding: 0.2rem 0.55rem;
            border-radius: 6px; font-size: 0.65rem; font-weight: 700; color: white;
        }
        .showcase-creator-info { padding: 0.85rem 1rem; }
        .showcase-creator-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.2rem; }
        .showcase-creator-meta { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--gray-600); }
        .showcase-star { color: #f59e0b; }
        .showcase-explore-cta { text-align: center; margin-top: 0.5rem; }

        /* ===================== DEMO BAND ===================== */
        .demo-band {
            background: var(--black); padding: 3.5rem 2.5rem;
            display: flex; align-items: center; justify-content: center;
            gap: 2.5rem; flex-wrap: wrap;
        }
        .demo-band-text h3 { color: white; font-size: 1.5rem; font-weight: 800; margin-bottom: 0.35rem; }
        .demo-band-text p { color: rgba(255,255,255,0.65); font-size: 0.95rem; }

        /* ===================== TESTIMONIALS ===================== */
        .testimonials-section { background: white; padding: 7rem 2.5rem; }
        .testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.75rem; max-width: 1300px; margin: 0 auto; }
        .testimonial-card {
            background: var(--gray-50); border: 2px solid var(--gray-200);
            border-radius: 20px; padding: 2.25rem; transition: all 0.3s;
        }
        .testimonial-card:hover { transform: translateY(-6px); box-shadow: 0 16px 48px rgba(0,0,0,0.08); }
        .testimonial-stars { color: #f59e0b; font-size: 1rem; margin-bottom: 1rem; letter-spacing: 2px; }
        .testimonial-quote { font-size: 0.97rem; line-height: 1.8; color: var(--black); margin-bottom: 1.5rem; font-style: italic; }
        .testimonial-metric {
            background: rgba(164,245,99,0.2); border: 1.5px solid var(--lime);
            border-radius: 10px; padding: 0.65rem 1rem; margin-bottom: 1.5rem;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .testimonial-metric-num { font-size: 1.4rem; font-weight: 800; color: var(--lime-dark); }
        .testimonial-metric-label { font-size: 0.8rem; color: var(--gray-600); font-weight: 600; }
        .testimonial-author { display: flex; align-items: center; gap: 0.75rem; }
        .testimonial-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 1rem; flex-shrink: 0;
        }
        .testimonial-name { font-weight: 700; font-size: 0.9rem; }
        .testimonial-company { font-size: 0.78rem; color: var(--gray-600); }

        /* ===================== IP / TRUST SIGNALS ===================== */
        .trust-signals-bar {
            background: var(--gray-50); border-top: 2px solid var(--gray-200);
            border-bottom: 2px solid var(--gray-200); padding: 2rem 2.5rem;
        }
        .trust-signals-inner { max-width: 1300px; margin: 0 auto; display: flex; justify-content: center; gap: 3rem; flex-wrap: wrap; }
        .trust-signal {
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 0.9rem; font-weight: 600; color: var(--black);
        }
        .trust-signal-icon { font-size: 1.35rem; }

        /* ===================== FAQ SECTION ===================== */
        .faq-section { padding: 6rem 2.5rem; background: var(--gray-50); }
        .faq-list { max-width: 820px; margin: 0 auto; }
        .faq-item { border-bottom: 1.5px solid var(--gray-200); }
        .faq-question {
            width: 100%; text-align: left; background: none; border: none;
            padding: 1.5rem 0; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 1rem; font-weight: 700; color: var(--black); gap: 1rem;
        }
        .faq-question:hover { color: var(--lime-dark); }
        .faq-chevron { font-size: 1.25rem; transition: transform 0.25s; flex-shrink: 0; color: var(--gray-400); }
        .faq-chevron.open { transform: rotate(45deg); color: var(--black); }
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.35s ease, padding 0.25s; }
        .faq-answer.open { max-height: 300px; padding-bottom: 1.25rem; }
        .faq-answer p { font-size: 0.95rem; color: var(--gray-600); line-height: 1.8; }


        /* ===================== LUXURY TYPOGRAPHY REFINEMENTS ===================== */
        h1, h2, h3, .section-h2 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            letter-spacing: -0.02em;
        }
        .hero h1 {
            font-size: clamp(3rem, 6vw, 5.25rem);
            font-weight: 600;
            line-height: 1.08;
            letter-spacing: -0.025em;
        }
        .hero h1 em {
            font-style: italic;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 600;
            color: var(--lime-dark);
        }
        .section-h2 {
            font-size: clamp(2.25rem, 4vw, 3.5rem);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        .logo-text {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        body, button, input, select, textarea {
            font-family: 'Cabinet Grotesk', -apple-system, sans-serif;
        }
        .section-tag {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.72rem;
        }
        .price-amount, .wallet-price, .testimonial-metric-num {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
        }
        .btn {
            font-family: 'Cabinet Grotesk', sans-serif;
            letter-spacing: 0.01em;
        }
        /* Subtle serif italic on testimonial quotes */
        .testimonial-quote {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.08rem;
            font-weight: 500;
            line-height: 1.85;
            font-style: italic;
        }
        /* Hero sub uses Cabinet Grotesk at refined weight */
        .hero-sub {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1.75;
            color: var(--gray-600);
        }
        .why-card h3, .feature-card h3, .step-card h3, .product-type-copy h3 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        /* ===================================================================== */

        /* ===================== STICKY SCROLL CTA ===================== */
        .sticky-cta-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
            background: var(--black); padding: 0.9rem 2rem;
            display: flex; align-items: center; justify-content: space-between;
            gap: 1rem; transform: translateY(100%); transition: transform 0.35s ease;
            border-top: 1px solid rgba(255,255,255,0.12);
        }
        .sticky-cta-bar.visible { transform: translateY(0); }
        .sticky-cta-copy { color: white; font-size: 0.9rem; font-weight: 600; }
        .sticky-cta-copy em { color: var(--lime); font-style: normal; }
        @media (max-width: 768px) {
            .sticky-cta-bar { flex-direction: column; padding: 1rem; text-align: center; }
        }
        /* ===================== RESPONSIVE ===================== */
        @media (max-width: 1024px) {
            .features-grid, .pricing-grid { grid-template-columns: 1fr; }
            .steps-grid { grid-template-columns: 1fr; }
            .preview-grid { grid-template-columns: 1fr; }
            .footer-grid { grid-template-columns: 1fr 1fr; }
            .testimonials-grid { grid-template-columns: 1fr; }
            .why-grid { grid-template-columns: 1fr; }
            .creator-showcase-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        }
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .nav-hamburger { display: flex; }
            .dash-nav { display: none; }
            .product-type-panel { grid-template-columns:1fr; gap:2rem; }
            .lead-form-inner { grid-template-columns:1fr; gap:2rem; }
            .agency-perks { gap:1rem; }
            .wallet-grid { grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
            .creators-grid { grid-template-columns: 1fr; }
            .perf-grid { grid-template-columns: 1fr; }
            .hero { padding: 9rem 1.5rem 5rem; }
            .section-pad { padding: 5rem 1.5rem; }
            .signup-card, .onboard-card, .auth-card { padding: 2rem; }
            .testimonials-section, .creator-showcase, .faq-section { padding: 4rem 1.5rem; }
            .trust-signals-inner { gap: 1.5rem; }
            .demo-band { gap: 1.5rem; text-align: center; }
        }

        /* ===== CAMPAIGN MANAGEMENT ===== */
        /* ===== BILLO-STYLE MANAGE CAMPAIGNS ===== */
        .mc-page{padding:0;max-width:100%;}
        .mc-tabs-bar{display:flex;gap:0;border-bottom:1.5px solid var(--gray-200);background:white;padding:0 2.5rem;}
        .mc-tab{padding:1rem 1.25rem;font-weight:600;font-size:0.9rem;color:var(--gray-600);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:all 0.2s;white-space:nowrap;}
        .mc-tab:hover{color:var(--black);}
        .mc-tab.active{color:var(--indigo);border-bottom-color:var(--indigo);}
        .mc-content{padding:2.5rem;max-width:1200px;}
        .mc-section-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;}
        .mc-section-header h2{font-size:1.75rem;font-weight:800;font-family:'Cabinet Grotesk',sans-serif;margin-bottom:0.3rem;}
        .mc-section-header p{color:var(--gray-600);font-size:0.9rem;}
        .mc-empty{background:white;border:1.5px solid var(--gray-200);border-radius:14px;padding:2rem 1.75rem;display:flex;align-items:center;gap:0.85rem;color:var(--gray-600);font-size:0.9rem;}
        .mc-empty-icon{width:32px;height:32px;border:2px solid var(--gray-400);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.85rem;color:var(--gray-600);}
        /* Filter pills */
        .mc-filter-pills{display:flex;gap:0.6rem;margin-bottom:1.5rem;flex-wrap:wrap;}
        .mc-pill{padding:0.45rem 1.1rem;border-radius:50px;border:1.5px solid var(--gray-200);font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.18s;background:white;color:var(--gray-600);}
        .mc-pill:hover{border-color:var(--gray-400);}
        .mc-pill.active{background:rgba(99,102,241,0.1);border-color:var(--indigo);color:var(--indigo);}
        /* Briefs table */
        .briefs-table{width:100%;border:1.5px solid var(--gray-200);border-radius:14px;overflow:hidden;background:white;}
        .briefs-table-head{display:grid;grid-template-columns:2fr 1fr 1.2fr 0.8fr 1fr 0.8fr;gap:0;padding:0.75rem 1.5rem;background:var(--gray-50);border-bottom:1.5px solid var(--gray-200);}
        .briefs-th{font-size:0.72rem;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
        .briefs-row{display:grid;grid-template-columns:2fr 1fr 1.2fr 0.8fr 1fr 0.8fr;gap:0;padding:1rem 1.5rem;border-bottom:1px solid var(--gray-100);align-items:center;cursor:pointer;transition:background 0.15s;}
        .briefs-row:hover{background:var(--gray-50);}
        .briefs-row:last-child{border-bottom:none;}
        .brief-thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--gray-200);flex-shrink:0;}
        .brief-name{font-size:0.9rem;font-weight:700;margin-bottom:0.15rem;}
        .brief-id{font-size:0.75rem;color:var(--gray-400);}
        .brief-action-badge{padding:0.2rem 0.7rem;border-radius:50px;font-size:0.72rem;font-weight:600;background:var(--gray-100);color:var(--gray-600);}
        .brief-action-badge.finish{background:#FEF3C7;color:#92400E;}
        .brief-action-badge.review{background:#DBEAFE;color:#1E40AF;}
        .brief-action-badge.live{background:rgba(164,245,99,0.25);color:#3a8000;}
        /* Partnership ads table */
        .pa-table{width:100%;border:1.5px solid var(--gray-200);border-radius:14px;overflow:hidden;background:white;}
        .pa-table-head{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1.2fr 0.8fr;gap:0;padding:0.75rem 1.5rem;background:var(--gray-50);border-bottom:1.5px solid var(--gray-200);}
        .pa-th{font-size:0.72rem;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
        .pa-empty-row{padding:2rem;text-align:center;font-size:0.9rem;color:var(--gray-600);}
        /* New campaign flow */
        .nc-page{padding:2.5rem;max-width:100%;display:flex;gap:2.5rem;align-items:flex-start;}
        .nc-main{flex:1;display:flex;flex-direction:column;gap:1rem;}
        .nc-title-row{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;}
        .nc-title{font-size:1.5rem;font-weight:800;}
        .nc-edit-btn{background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--gray-400);transition:color 0.2s;padding:0.2rem;}
        .nc-edit-btn:hover{color:var(--black);}
        .nc-section{background:white;border:1.5px solid var(--gray-200);border-radius:16px;overflow:hidden;}
        .nc-section-header{display:flex;align-items:center;gap:1rem;padding:1.35rem 1.5rem;cursor:pointer;}
        .nc-section-header.done{background:var(--gray-50);}
        .nc-section-title{font-size:1rem;font-weight:700;flex:1;}
        .nc-section-body{padding:1.5rem;border-top:1px solid var(--gray-100);}
        .nc-section-meta{font-size:0.82rem;color:var(--gray-600);display:flex;gap:1rem;flex-wrap:wrap;}
        .nc-check{width:22px;height:22px;border-radius:50%;background:var(--green);color:white;display:flex;align-items:center;justify-content:center;font-size:0.7rem;flex-shrink:0;}
        .nc-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
        /* Order estimate sidebar */
        .nc-sidebar{width:340px;flex-shrink:0;position:sticky;top:90px;}
        .oe-card{background:white;border:1.5px solid var(--gray-200);border-radius:16px;padding:2rem;min-height:340px;}
        .oe-title{font-size:1.15rem;font-weight:800;margin-bottom:1.25rem;}
        .oe-line{font-size:0.9rem;color:var(--gray-600);margin-bottom:0.5rem;}
        .oe-product{font-weight:700;font-size:0.95rem;}
        .oe-divider{border:none;border-top:1px solid var(--gray-200);margin:1rem 0;}
        .oe-total-label{font-size:0.95rem;font-weight:700;}
        .oe-total-price{font-size:1.6rem;font-weight:800;color:var(--indigo);}
        .oe-note{background:#EEF2FF;border-radius:10px;padding:1rem;font-size:0.85rem;color:var(--gray-600);display:flex;gap:0.5rem;align-items:flex-start;margin-top:1rem;}
        /* Product select */
        .ps-url-row{display:flex;gap:0.75rem;margin-bottom:1rem;}
        .ps-url-input{flex:1;padding:0.7rem 1rem;border:1.5px solid var(--gray-200);border-radius:50px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;outline:none;}
        .ps-url-input:focus{border-color:var(--black);}
        .ps-add-btn{width:44px;height:44px;border-radius:50px;background:var(--gray-100);border:1.5px solid var(--gray-200);cursor:pointer;font-size:1.2rem;color:var(--gray-400);display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
        .ps-add-btn:hover{background:var(--gray-200);}
        .ps-catalog-btn{padding:0.65rem 1.25rem;border-radius:50px;border:1.5px solid var(--black);background:white;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:0.5rem;transition:all 0.2s;white-space:nowrap;}
        .ps-catalog-btn:hover{background:var(--gray-50);}
        .ps-product-card{border:1.5px solid var(--gray-200);border-radius:12px;padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;position:relative;}
        .ps-product-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--gray-100);flex-shrink:0;}
        .ps-product-name{font-weight:700;font-size:0.95rem;}
        .ps-product-link{font-size:0.8rem;color:var(--indigo);font-weight:600;cursor:pointer;}
        .ps-remove{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:var(--gray-400);transition:color 0.2s;}
        .ps-remove:hover{color:var(--black);}
        .ps-ship-q{background:rgba(99,102,241,0.06);border-radius:10px;padding:0.85rem 1rem;display:flex;align-items:center;gap:1rem;margin-top:0.75rem;font-size:0.85rem;font-weight:600;}
        .ps-yn{display:flex;gap:0.5rem;}
        .ps-yn-btn{padding:0.35rem 0.9rem;border-radius:50px;border:1.5px solid var(--gray-200);background:white;font-family:'Cabinet Grotesk',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
        .ps-yn-btn.sel{background:var(--indigo);color:white;border-color:var(--indigo);}
        .ps-next-row{display:flex;justify-content:flex-end;margin-top:1rem;}
        /* Video params */
        .vp-row{display:flex;align-items:center;gap:1.5rem;margin-bottom:1.25rem;}
        .vp-label{font-size:0.85rem;font-weight:700;width:120px;flex-shrink:0;}
        .vp-pills{display:flex;gap:0.5rem;flex-wrap:wrap;}
        .vp-pill{padding:0.45rem 1rem;border-radius:50px;border:1.5px solid var(--gray-200);background:white;font-family:'Cabinet Grotesk',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--gray-600);}
        .vp-pill:hover{border-color:var(--gray-400);}
        .vp-pill.sel{background:white;border-color:var(--black);color:var(--black);box-shadow:0 0 0 2px rgba(0,0,0,0.08);}
        /* Script page */
        .script-page{padding:2rem 2.5rem;max-width:1400px;}
        .script-toggle{display:flex;gap:0;background:var(--gray-100);border-radius:50px;padding:0.25rem;}
        .st-opt{padding:0.5rem 1.1rem;border-radius:50px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--gray-600);}
        .st-opt.sel{background:white;color:var(--black);box-shadow:0 1px 4px rgba(0,0,0,0.12);}
        .script-cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1.5px solid var(--gray-200);border-radius:14px;overflow:hidden;margin:1.25rem 0;}
        .sc-card{padding:1.25rem;border-right:1px solid var(--gray-200);cursor:pointer;transition:background 0.15s;}
        .sc-card:last-child{border-right:none;}
        .sc-card:hover{background:var(--gray-50);}
        .sc-card.sel{background:rgba(99,102,241,0.06);border-top:2px solid var(--indigo);}
        .sc-badge{display:inline-flex;align-items:center;gap:0.35rem;padding:0.2rem 0.6rem;border-radius:50px;font-size:0.72rem;font-weight:700;margin-bottom:0.6rem;}
        .sc-badge.custom{background:#EDE8FD;color:#4C1D95;}
        .sc-badge.persona{background:#D1FAE5;color:#065F46;}
        .sc-title{font-size:0.9rem;font-weight:700;line-height:1.3;}
        .sc-loading{display:flex;align-items:center;justify-content:center;min-height:40px;}
        .sc-spinner{width:20px;height:20px;border:2px solid var(--gray-200);border-top-color:var(--indigo);border-radius:50%;animation:spin 0.7s linear infinite;}
        .script-ai-prompt{background:white;border:1.5px solid var(--gray-200);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;}
        .script-ai-prompt h3{font-size:1rem;font-weight:800;margin-bottom:0.25rem;}
        .script-ai-prompt p{font-size:0.82rem;color:var(--gray-600);margin-bottom:1rem;}
        .ai-stats{display:flex;gap:1.5rem;font-size:0.72rem;color:var(--gray-600);margin-bottom:1rem;}
        .ai-dot{width:7px;height:7px;background:#A4F563;border-radius:50%;display:inline-block;margin-right:0.3rem;}
        .persona-pills-row{display:flex;gap:0.6rem;flex-wrap:wrap;margin-bottom:1rem;}
        .persona-pill{padding:0.4rem 0.85rem;border-radius:50px;background:rgba(99,102,241,0.08);color:var(--indigo);font-size:0.8rem;font-weight:600;display:flex;align-items:center;gap:0.4rem;}
        .gen-scripts-row{display:flex;align-items:center;justify-content:flex-end;gap:0.75rem;}
        .gen-counter{font-size:0.8rem;color:var(--gray-400);font-weight:600;}
        .gen-progress{width:80px;height:4px;background:var(--gray-200);border-radius:2px;overflow:hidden;}
        .gen-progress-fill{height:100%;background:var(--indigo);border-radius:2px;}
        .btn-gen{padding:0.6rem 1.35rem;background:var(--black);color:white;border:none;border-radius:50px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:0.5rem;transition:all 0.2s;}
        .btn-gen:hover{background:#2a2a2a;}
        .script-price-row{display:flex;align-items:center;justify-content:space-between;padding:1rem 0;border-top:1px solid var(--gray-100);}
        .script-price{font-size:1rem;font-weight:700;}
        .script-price span{color:var(--gray-400);font-weight:400;font-size:0.85rem;}
        .btn-script-next{padding:0.65rem 1.5rem;background:var(--indigo);color:white;border:none;border-radius:50px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
        .btn-script-next:hover{background:#4f46e5;}
        .btn-script-next:disabled{background:var(--gray-200);color:var(--gray-400);cursor:not-allowed;}
        .script-req-note{background:#EEF2FF;border-radius:10px;padding:0.65rem 1rem;font-size:0.8rem;color:var(--gray-600);display:flex;align-items:center;gap:0.5rem;}
        /* Manual script */
        .ms-mode-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1.5px solid var(--gray-200);border-radius:14px;overflow:hidden;margin:1.25rem 0;}
        .ms-mode-card{padding:1.25rem;border-right:1px solid var(--gray-200);cursor:pointer;transition:background 0.15s;}
        .ms-mode-card:last-child{border-right:none;}
        .ms-mode-card:hover{background:var(--gray-50);}
        .ms-mode-card.sel{background:rgba(99,102,241,0.06);border:2px solid var(--indigo);}
        .ms-mode-icon{font-size:1.1rem;margin-bottom:0.5rem;}
        .ms-mode-title{font-size:0.88rem;font-weight:700;margin-bottom:0.25rem;}
        .ms-mode-sub{font-size:0.75rem;color:var(--gray-600);}
        .ms-gen-prompt{background:#F8F7FF;border-radius:10px;padding:0.75rem 1rem;display:flex;align-items:center;justify-content:space-between;font-size:0.8rem;color:var(--gray-600);margin-bottom:1.25rem;}
        .ms-gen-link{color:var(--indigo);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:0.3rem;}
        .ms-brief-box{background:white;border:1.5px solid var(--gray-200);border-radius:14px;padding:1.5rem;margin-bottom:1rem;}
        .ms-brief-title{font-size:1rem;font-weight:800;margin-bottom:0.25rem;}
        .ms-brief-sub{font-size:0.78rem;color:var(--gray-600);margin-bottom:1.25rem;line-height:1.5;}
        .ms-hcc{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1.5px solid var(--gray-200);border-radius:12px;overflow:hidden;margin-bottom:1rem;}
        .ms-hcc-col{padding:1rem;}
        .ms-hcc-col:not(:last-child){border-right:1px solid var(--gray-200);}
        .ms-hcc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;}
        .ms-hcc-label{font-size:0.82rem;font-weight:800;}
        .ms-hcc-sublabel{font-size:0.72rem;color:var(--gray-600);}
        .ms-hcc-counter{font-size:0.72rem;color:var(--gray-400);font-weight:600;background:var(--gray-100);border-radius:50px;padding:0.15rem 0.5rem;}
        .ms-hcc-slot{border:1.5px dashed var(--gray-200);border-radius:10px;padding:0.75rem 1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color 0.2s;font-size:0.82rem;color:var(--gray-400);}
        .ms-hcc-slot:hover{border-color:var(--indigo);color:var(--indigo);}
        .ms-hcc-slot-add{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--indigo);display:flex;align-items:center;justify-content:center;color:var(--indigo);font-size:0.9rem;flex-shrink:0;}
        /* Organic posting */
        .op-platform-row{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.25rem;}
        .op-platform-select{padding:0.6rem 1rem;border:1.5px solid var(--gray-200);border-radius:10px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;outline:none;min-width:150px;}
        .op-handle-input{flex:1;padding:0.6rem 1rem;border:1.5px solid var(--gray-200);border-radius:10px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;outline:none;}
        .op-handle-input:focus{border-color:var(--black);}
        .op-textarea{width:100%;padding:0.75rem 1rem;border:1.5px solid var(--gray-200);border-radius:10px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;outline:none;resize:vertical;min-height:80px;}
        .op-textarea:focus{border-color:var(--black);}
        .op-btn-added{padding:0.5rem 1.1rem;border-radius:50px;background:rgba(99,102,241,0.1);border:1.5px solid var(--indigo);color:var(--indigo);font-family:'Cabinet Grotesk',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:0.4rem;}
        .op-btn-add{padding:0.5rem 1.1rem;border-radius:50px;background:white;border:1.5px solid var(--gray-200);color:var(--gray-600);font-family:'Cabinet Grotesk',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:0.4rem;transition:all 0.2s;}
        .op-btn-add:hover{border-color:var(--black);color:var(--black);}
        .op-sub-card{border-top:1px solid var(--gray-100);padding-top:1.25rem;margin-top:0.5rem;}
        .op-rec-badge{display:inline-flex;align-items:center;gap:0.3rem;padding:0.2rem 0.6rem;border-radius:50px;background:#EDE8FD;color:#4C1D95;font-size:0.72rem;font-weight:700;}
        /* Add-ons */
        .ao-card{display:grid;grid-template-columns:200px 1fr auto;gap:1.5rem;align-items:start;padding-bottom:1.5rem;border-bottom:1px solid var(--gray-100);margin-bottom:1.5rem;}
        .ao-card:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
        .ao-thumb{width:200px;height:130px;border-radius:10px;background:var(--gray-100);overflow:hidden;position:relative;}
        .ao-thumb img{width:100%;height:100%;object-fit:cover;}
        .ao-content h4{font-size:0.95rem;font-weight:800;margin-bottom:0.25rem;}
        .ao-content p{font-size:0.8rem;color:var(--gray-600);line-height:1.5;margin-bottom:0.85rem;}
        .ao-tier-pills{display:flex;gap:0;background:var(--gray-100);border-radius:50px;padding:0.2rem;margin-bottom:0.75rem;width:fit-content;}
        .ao-tier{padding:0.35rem 0.9rem;border-radius:50px;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--gray-600);}
        .ao-tier.sel{background:white;color:var(--black);box-shadow:0 1px 4px rgba(0,0,0,0.12);}
        .ao-feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.35rem 1rem;}
        .ao-feat{font-size:0.75rem;color:var(--gray-400);display:flex;align-items:center;gap:0.35rem;}
        .ao-feat.on{color:var(--gray-700);}
        .ao-price{font-size:0.85rem;font-weight:700;margin-top:0.75rem;}
        .ao-btn-included{padding:0.5rem 1.1rem;border-radius:50px;background:rgba(99,102,241,0.1);border:1.5px solid var(--indigo);color:var(--indigo);font-family:'Cabinet Grotesk',sans-serif;font-size:0.82rem;font-weight:700;cursor:default;display:flex;align-items:center;gap:0.4rem;white-space:nowrap;}
        .ao-btn-add{padding:0.5rem 1.1rem;border-radius:50px;background:white;border:1.5px solid var(--gray-200);color:var(--gray-600);font-family:'Cabinet Grotesk',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:0.4rem;transition:all 0.2s;white-space:nowrap;}
        .ao-btn-add:hover{border-color:var(--black);color:var(--black);}
        /* Campaign visibility */
        .cv-toggle{display:flex;gap:0;background:var(--gray-100);border-radius:50px;padding:0.25rem;}
        .cv-opt{padding:0.5rem 1.1rem;border-radius:50px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--gray-600);}
        .cv-opt.sel{background:white;color:var(--black);box-shadow:0 1px 4px rgba(0,0,0,0.12);}
        .cv-input{width:100%;padding:0.7rem 1rem;border:1.5px solid var(--gray-200);border-radius:10px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;outline:none;margin-bottom:0.5rem;}
        .cv-input:focus{border-color:var(--black);}
        .cv-hint{font-size:0.75rem;color:var(--gray-400);}
        .cv-req-section{margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--gray-100);}
        .cv-req-row{display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:var(--gray-600);margin-bottom:0.35rem;}
        .cv-matches{font-size:0.85rem;font-weight:700;color:var(--gray-700);margin-bottom:0.5rem;}
        .cv-publish-row{display:flex;justify-content:flex-end;margin-top:1.5rem;}
        /* Top-up / wallet packs */
        .topup-page{padding:2.5rem;max-width:900px;}
        .topup-h1{font-size:1.9rem;font-weight:800;margin-bottom:0.5rem;}
        .topup-bullets{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:2rem;}
        .topup-bullet{font-size:0.88rem;color:var(--gray-700);display:flex;align-items:center;gap:0.5rem;}
        .pack-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
        .pack-card{border:1.5px solid var(--gray-200);border-radius:16px;padding:1.5rem;position:relative;cursor:pointer;transition:all 0.2s;}
        .pack-card:hover{border-color:var(--indigo);box-shadow:0 4px 16px rgba(0,0,0,0.06);}
        .pack-card.popular{border-color:var(--indigo);box-shadow:0 0 0 2px rgba(99,102,241,0.15);}
        .pack-popular-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--indigo);color:white;font-size:0.72rem;font-weight:700;padding:0.2rem 0.85rem;border-radius:50px;white-space:nowrap;}
        .pack-name{font-size:0.85rem;font-weight:600;color:var(--gray-600);margin-bottom:0.4rem;}
        .pack-price{font-size:1.75rem;font-weight:800;line-height:1;}
        .pack-price-unit{font-size:0.75rem;color:var(--gray-400);font-weight:400;margin-left:2px;}
        .pack-bonus{font-size:0.82rem;color:var(--indigo);font-weight:700;margin-top:0.25rem;}
        .pack-get{font-size:0.78rem;color:var(--gray-600);margin-bottom:1rem;}
        .pack-wallet-btn{width:100%;padding:0.7rem;background:var(--indigo);color:white;border:none;border-radius:50px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
        .pack-wallet-btn:hover{background:#4f46e5;}
        .pack-guarantee{display:flex;align-items:center;gap:0.4rem;font-size:0.72rem;color:var(--gray-600);margin-top:0.6rem;}
        .pack-feats{margin-top:0.85rem;display:flex;flex-direction:column;gap:0.3rem;}
        .pack-feat{font-size:0.75rem;color:var(--gray-700);display:flex;align-items:center;gap:0.4rem;}
        .guarantee-banner{background:rgba(99,102,241,0.06);border-radius:14px;padding:1.35rem 1.5rem;display:flex;align-items:center;gap:1.25rem;margin-bottom:2rem;}
        .gb-icon{font-size:2rem;flex-shrink:0;}
        .gb-title{font-size:1rem;font-weight:800;margin-bottom:0.2rem;}
        .gb-sub{font-size:0.82rem;color:var(--gray-600);}
        .faq-section h2{font-size:1.1rem;font-weight:800;margin-bottom:1rem;}
        .faq-item{border-bottom:1px solid var(--gray-200);padding:1rem 0;cursor:pointer;}
        .faq-q{display:flex;align-items:center;justify-content:space-between;font-size:0.88rem;font-weight:600;}
        /* Catalog / Create product modals */
        .catalog-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;}
        .catalog-modal{background:white;border-radius:20px;width:660px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;}
        .cm-header{display:flex;align-items:center;justify-content:space-between;padding:1.35rem 1.5rem;border-bottom:1px solid var(--gray-100);}
        .cm-header h3{font-size:1rem;font-weight:800;}
        .cm-close{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--gray-400);}
        .cm-body{padding:1.5rem;overflow-y:auto;flex:1;}
        .cm-footer{padding:1rem 1.5rem;border-top:1px solid var(--gray-100);}
        .cm-product-row{display:flex;align-items:center;gap:1rem;padding:0.85rem;border:1.5px solid var(--gray-200);border-radius:12px;margin-bottom:0.75rem;cursor:pointer;transition:border-color 0.2s;}
        .cm-product-row:hover{border-color:var(--gray-400);}
        .cm-product-row.sel{border-color:var(--indigo);}
        .cm-product-thumb{width:48px;height:48px;border-radius:8px;background:var(--gray-100);flex-shrink:0;}
        .cm-product-name{font-weight:700;font-size:0.9rem;}
        .cm-product-link{font-size:0.78rem;color:var(--indigo);cursor:pointer;}
        .cm-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--gray-200);margin-left:auto;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
        .cm-radio.sel{border-color:var(--indigo);}
        .cm-radio-dot{width:8px;height:8px;border-radius:50%;background:var(--indigo);}
        .cm-confirm-btn{width:100%;padding:0.8rem;background:var(--gray-100);color:var(--gray-400);border:none;border-radius:50px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
        .cm-confirm-btn.active{background:var(--indigo);color:white;cursor:pointer;}
        .cp-type-tabs{display:flex;gap:0.6rem;margin-bottom:1.25rem;}
        .cp-type-tab{padding:0.5rem 1rem;border-radius:50px;border:1.5px solid var(--gray-200);font-family:'Cabinet Grotesk',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:0.4rem;}
        .cp-type-tab.sel{border-color:var(--indigo);background:rgba(99,102,241,0.08);color:var(--indigo);}
        .cp-label{font-size:0.82rem;font-weight:700;margin-bottom:0.5rem;color:var(--gray-700);}
        .cp-input{width:100%;padding:0.65rem 0.9rem;border:1.5px solid var(--gray-200);border-radius:8px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;outline:none;margin-bottom:1rem;}
        .cp-input:focus{border-color:var(--black);}
        .cp-textarea{width:100%;padding:0.65rem 0.9rem;border:1.5px solid var(--gray-200);border-radius:8px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.85rem;outline:none;resize:vertical;min-height:80px;margin-bottom:1rem;}
        .cp-textarea:focus{border-color:var(--black);}
        .cp-upload{border:1.5px dashed var(--indigo);border-radius:10px;background:rgba(99,102,241,0.04);padding:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.5rem;cursor:pointer;margin-bottom:1rem;}
        .cp-upload-icon{font-size:1.35rem;color:var(--gray-400);}
        .cp-upload-label{font-size:0.82rem;color:var(--gray-600);}
        .cp-save-btn{width:100%;padding:0.85rem;background:var(--indigo);color:white;border:none;border-radius:50px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
        .cp-save-btn:hover{background:#4f46e5;}
        .cp-hint{font-size:0.72rem;color:var(--gray-400);margin-top:-0.75rem;margin-bottom:1rem;}
        /* Save draft modal */
        .save-draft-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;}
        .save-draft-modal{background:white;border-radius:20px;width:580px;padding:2rem;text-align:left;}
        .sdm-title{font-size:1.15rem;font-weight:800;margin-bottom:0.6rem;}
        .sdm-sub{font-size:0.88rem;color:var(--gray-600);line-height:1.5;margin-bottom:1.5rem;}
        .sdm-actions{display:flex;gap:0.75rem;}
        .sdm-discard{flex:1;padding:0.8rem;border:1.5px solid var(--gray-200);background:white;border-radius:50px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.9rem;font-weight:700;color:var(--indigo);cursor:pointer;transition:all 0.2s;}
        .sdm-save{flex:2;padding:0.8rem;background:var(--indigo);color:white;border:none;border-radius:50px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
        .sdm-save:hover{background:#4f46e5;}
        /* Use this script sticky button */
        .use-script-sticky{position:fixed;bottom:2rem;right:2rem;padding:0.8rem 1.75rem;background:var(--black);color:white;border:none;border-radius:50px;font-family:'Cabinet Grotesk',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.2);transition:all 0.2s;z-index:100;}
        .use-script-sticky:hover{background:#2a2a2a;transform:translateY(-1px);}
        /* Old campaigns table */
        .campaigns-page{padding:2.5rem;max-width:1300px;margin:0 auto;}
        .campaigns-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;}
        .campaigns-header h1{font-size:2.1rem;font-weight:800;margin-bottom:0.3rem;}
        .campaigns-header p{color:var(--gray-600);font-size:0.9rem;}
        .campaign-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-bottom:2rem;}
        .csc{background:white;border:1.5px solid var(--gray-200);border-radius:14px;padding:1.25rem 1.4rem;}
        .csc-label{font-size:0.72rem;color:var(--gray-600);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.35rem;}
        .csc-value{font-size:1.9rem;font-weight:800;line-height:1;}
        .csc-sub{font-size:0.72rem;color:var(--gray-400);margin-top:0.25rem;}
        .campaign-tabs{display:flex;gap:0;border-bottom:2px solid var(--gray-200);margin-bottom:1.5rem;}
        .ctab{padding:0.7rem 1.35rem;font-weight:600;font-size:0.85rem;color:var(--gray-400);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s;white-space:nowrap;}
        .ctab.active{color:var(--black);border-bottom-color:var(--black);}
        .campaigns-list{display:flex;flex-direction:column;gap:1rem;}
        .campaign-card{background:white;border:1.5px solid var(--gray-200);border-radius:14px;padding:1.35rem 1.5rem;cursor:pointer;transition:all 0.2s;}
        .campaign-card:hover{border-color:var(--gray-400);box-shadow:0 4px 16px rgba(0,0,0,0.06);}
        .cc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.9rem;}
        .cc-title{font-size:1rem;font-weight:700;margin-bottom:0.2rem;}
        .cc-creator-name{font-size:0.8rem;color:var(--gray-600);}
        .status-badge{padding:0.2rem 0.7rem;border-radius:50px;font-size:0.7rem;font-weight:700;white-space:nowrap;}
        .s-pending{background:#FEF3C7;color:#92400E;}
        .s-inprogress{background:#DBEAFE;color:#1E40AF;}
        .s-delivered{background:#D1FAE5;color:#065F46;}
        .s-revision{background:#FEE2E2;color:#991B1B;}
        .s-approved{background:rgba(164,245,99,0.3);color:#3a8000;}
        .s-published{background:#EDE8FD;color:#4C1D95;}
        /* Applications panel */
        .app-card{background:white;border:1.5px solid var(--gray-200);border-radius:12px;padding:1rem 1.2rem;transition:border-color .2s;}
        .app-card:hover{border-color:var(--gray-400);}
        .app-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),#9333ea);color:white;font-weight:800;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .app-name{font-weight:700;font-size:.95rem;margin-bottom:2px;}
        .app-handle{font-size:.78rem;color:var(--gray-600);}
        .app-msg{font-size:.82rem;color:var(--gray-600);margin-top:.5rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
        .app-actions{display:flex;gap:.5rem;margin-top:.75rem;}
        .app-btn-accept{padding:.45rem 1rem;background:var(--black);color:white;border:none;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;transition:opacity .2s;}
        .app-btn-accept:hover{opacity:.8;}
        .app-btn-decline{padding:.45rem 1rem;background:var(--gray-100);color:var(--gray-600);border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:background .2s;}
        .app-btn-decline:hover{background:var(--gray-200);}
        /* Shipping modal */
        .ship-form-wrap{padding:1.5rem;}
        .ship-input{margin-bottom:1rem;}
        .ship-input label{font-size:.82rem;font-weight:700;color:var(--gray-600);display:block;margin-bottom:.35rem;}
        .ship-input input,.ship-input select{width:100%;padding:.6rem .85rem;border:1.5px solid var(--gray-200);border-radius:8px;font-size:.9rem;font-family:'Cabinet Grotesk',sans-serif;outline:none;}
        .ship-input input:focus,.ship-input select:focus{border-color:var(--black);}
        /* Revision note modal */
        .rev-form-wrap{padding:1.5rem;}
        .rev-note{width:100%;padding:.75rem;border:1.5px solid var(--gray-200);border-radius:8px;font-size:.9rem;font-family:'Cabinet Grotesk',sans-serif;outline:none;resize:vertical;min-height:100px;}
        .rev-note:focus{border-color:var(--black);}
        /* Video review player */
        .video-player-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:9/16;max-width:320px;margin:0 auto;}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        .s-published{background:#EDE8FD;color:#4C1D95;}
        .cc-meta{display:flex;gap:1.35rem;font-size:0.78rem;color:var(--gray-600);margin-bottom:1rem;flex-wrap:wrap;}
        .cc-progress{height:5px;background:var(--gray-100);border-radius:3px;overflow:hidden;margin-bottom:0.9rem;}
        .cc-progress-fill{height:100%;background:var(--lime-dark);border-radius:3px;transition:width 0.5s;}
        .cc-actions{display:flex;gap:0.6rem;flex-wrap:wrap;}
        .cc-btn{padding:0.4rem 0.9rem;border-radius:8px;font-size:0.78rem;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-200);background:white;font-family:'Cabinet Grotesk',sans-serif;transition:all 0.2s;}
        .cc-btn:hover{border-color:var(--black);background:var(--gray-50);}
        .cc-btn.primary{background:var(--black);color:white;border-color:var(--black);}
        .cc-btn.primary:hover{background:#2a2a2a;}
        .cc-btn.danger{color:var(--red);border-color:var(--red);}
        .cc-btn.danger:hover{background:#FEE2E2;}
        .timeline{display:flex;align-items:center;margin-top:1rem;}
        .tl-step{display:flex;flex-direction:column;align-items:center;flex:1;}
        .tl-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:700;border:2px solid var(--gray-200);background:white;color:var(--gray-400);position:relative;z-index:1;}
        .tl-dot.done{background:var(--lime-dark);border-color:var(--lime-dark);color:white;}
        .tl-dot.active{background:var(--indigo);border-color:var(--indigo);color:white;}

        .video-review-box{background:#0d0d0d;border-radius:10px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0.75rem;cursor:pointer;transition:all 0.2s;margin-bottom:1rem;position:relative;overflow:hidden;}

        .vrb-play{width:60px;height:60px;background:rgba(255,255,255,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.35rem;cursor:pointer;transition:transform 0.2s;}
        .vrb-play:hover{transform:scale(1.05);}
        .vrb-label{font-size:0.85rem;font-weight:600;color:var(--gray-600);}

        /* ===== MESSAGING ===== */
        .inbox-page{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 64px);}
        .inbox-sidebar{border-right:1px solid var(--gray-200);background:white;display:flex;flex-direction:column;overflow:hidden;}
        .inbox-sidebar-hdr{padding:1.1rem 1.35rem;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
        .inbox-sidebar-hdr h3{font-size:0.95rem;font-weight:800;}
        .inbox-conv-list{overflow-y:auto;flex:1;}
        .inbox-conv{display:flex;gap:0.7rem;padding:0.9rem 1.35rem;cursor:pointer;border-bottom:1px solid var(--gray-100);transition:background 0.15s;}
        .inbox-conv:hover{background:var(--gray-50);}
        .inbox-conv.ic-active{background:rgba(99,102,241,0.07);border-left:3px solid var(--indigo);}
        .ic-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),#9333ea);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:0.9rem;flex-shrink:0;}
        .ic-info{flex:1;min-width:0;}
        .ic-name-row{display:flex;justify-content:space-between;margin-bottom:0.15rem;}
        .ic-name{font-size:0.85rem;font-weight:600;}
        .ic-time{font-size:0.7rem;color:var(--gray-400);}
        .ic-preview{font-size:0.76rem;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .ic-unread-dot{width:7px;height:7px;background:var(--indigo);border-radius:50%;flex-shrink:0;margin-top:5px;}
        .inbox-chat{display:flex;flex-direction:column;background:var(--gray-50);}
        .chat-hdr{padding:0.9rem 1.35rem;background:white;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:0.75rem;flex-shrink:0;}
        .chat-hdr-name{font-weight:700;font-size:0.9rem;margin-bottom:0.1rem;}
        .chat-hdr-status{font-size:0.72rem;color:var(--green);font-weight:500;}
        .chat-messages{flex:1;overflow-y:auto;padding:1.35rem;display:flex;flex-direction:column;gap:0.85rem;}
        .bubble-wrap{display:flex;align-items:flex-end;gap:0.45rem;}
        .bubble-wrap.mine{flex-direction:row-reverse;}
        .bubble{max-width:66%;padding:0.65rem 0.95rem;border-radius:18px;font-size:0.86rem;line-height:1.5;}
        .bubble.theirs{background:white;border:1.5px solid var(--gray-200);border-bottom-left-radius:4px;}
        .bubble.mine{background:var(--indigo);color:white;border-bottom-right-radius:4px;}
        .bubble-meta{font-size:0.65rem;color:var(--gray-400);margin-top:0.2rem;}
