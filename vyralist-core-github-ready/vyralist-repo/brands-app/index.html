                    </div>
                    <div className="bm-service-card">
                        <div className="bm-service-head">
                            <span style={{fontSize:'1.1rem'}}>🎵</span>
                            <span className="bm-service-name">TikTok</span>
                        </div>
                        <div className="bm-service-desc">Organic video post on the creator's TikTok account</div>
                        <div className="bm-service-link">View creator profile</div>
                        <div className="bm-service-price"><sup>$</sup>{Math.round(basePrice * 0.44)} <span style={{fontSize:'0.72rem',color:'var(--gray-500)',fontWeight:600}}>USD</span></div>
                    </div>
                </div>

                <div className="bm-subsection">Partnership ads</div>
                <div className="bm-service-grid" style={{marginBottom:'0.75rem'}}>
                    <div className="bm-service-card">
                        <div className="bm-service-head">
                            <span style={{fontSize:'1.1rem'}}>Ⓜ️</span>
                            <span className="bm-service-name">Meta partnership ads</span>
                            <span className="bm-service-badge">Content-level</span>

                                            })}
                                            {editQty > 0 && (
                                                <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.82rem',marginBottom:'0.5rem'}}>
                                                    <span style={{color:'var(--gray-600)'}}>✂️ Editing ×{editQty}</span>
                                                    <strong>${editQty*65}</strong>
                                                </div>
                                            )}
                                            <hr className="oe-divider" style={{margin:'0.75rem 0'}}/>
                                            <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
                                                <span className="oe-total-label">Total</span>
                                                <span style={{fontSize:'1.4rem',fontWeight:800,color:'var(--indigo)'}}>${totalPrice.toLocaleString()}</span>
                                            </div>
                                            <div style={{fontSize:'0.72rem',color:'var(--gray-400)',textAlign:'right',marginBottom:'1rem'}}>{totalVideos} video{totalVideos!==1?'s':''}</div>
                                        </>
                                    )}
                                    <div className="oe-note" style={{background:'rgba(99,102,241,0.07)',border:'1.5px solid rgba(99,102,241,0.2)',borderRadius:8,padding:'0.65rem 0.85rem',display:'flex',gap:'0.5rem',alignItems:'flex-start',fontSize:'0.78rem',color:'var(--gray-700)'}}>
                                        <span>ⓘ</span><span>Funds will be deducted after approving the creator.</span>
                                    </div>
                                </div>

                                {/* Wallet balance info */}
                                <div style={{marginTop:'1rem',padding:'0.85rem 1rem',background:'white',borderRadius:12,border:'1px solid var(--gray-200)',fontSize:'0.82rem'}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                        <span style={{color:'var(--gray-600)',fontWeight:600}}>💳 Wallet balance</span>
                                        <strong>${walletBalance.toLocaleString('en-US',{minimumFractionDigits:2})}</strong>
                                    </div>
                                    {totalPrice > 0 && walletBalance < totalPrice && (
                                        <div style={{marginTop:'0.5rem',color:'var(--red)',fontSize:'0.75rem',fontWeight:600}}>⚠ Insufficient funds. Please top up before publishing.</div>
                                    )}
                                </div>
                            </div>
                        );
                    })()}
                </div>
            </div>
        );
    }

    // ─── Payment Modal (Lemon Squeezy) ───────────────────────────────────────────
    function PaymentModal({ context, onClose, onSuccess }) {
        const [method,    setMethod]    = useState('lemonsqueezy'); // 'lemonsqueezy' | 'wire'
        const [loading,   setLoading]   = useState(false);
        const [stage,     setStage]     = useState('form');         // 'form' | 'processing' | 'success'
        const [errMsg,    setErrMsg]    = useState('');

        // ─── Lemon Squeezy config ─────────────────────────────────────────────────
        // Set your store slug and the correct variant IDs for each wallet pack.
        // You can find these in your Lemon Squeezy dashboard → Products → Variants.
        const LS_STORE = 'vyralist';   // your Lemon Squeezy store slug

        // Map dollar amounts to Lemon Squeezy variant IDs (configure per your products)
        const LS_VARIANT_MAP = {
            '500':  'YOUR_VARIANT_ID_500',
            '1000': 'YOUR_VARIANT_ID_1000',
            '2500': 'YOUR_VARIANT_ID_2500',
            '5000': 'YOUR_VARIANT_ID_5000',
        };
        if (Object.values(LS_VARIANT_MAP).some(v => v.startsWith('YOUR_'))) console.error('[Vyralist] LemonSqueezy variant IDs are not set — payments will fall back to generic checkout page.');

        const parseAmount = (str) => {
            if (!str) return 0;
            const num = parseFloat(String(str).replace(/[^0-9.]/g, ''));
            return isNaN(num) ? 0 : num;
        };

        const txnRef = React.useMemo(() => 'VYR-' + Date.now().toString().slice(-8) + '-' + Math.random().toString(36).slice(2,6).toUpperCase(), []);
        const amountNum = parseAmount(context.amount);

        // ─── Launch Lemon Squeezy overlay ────────────────────────────────────────
        const launchLemonSqueezy = () => {
            setErrMsg('');

            // Determine variant ID from amount
            const amtKey = String(Math.round(amountNum));
            const variantId = LS_VARIANT_MAP[amtKey] || context.lsVariantId || null;

            if (!variantId || variantId.startsWith('YOUR_')) {
                // Fallback: open the Lemon Squeezy store checkout page directly
                // Replace with your actual checkout URL
                const checkoutUrl = `https://${LS_STORE}.lemonsqueezy.com/checkout`;
                window.open(checkoutUrl, '_blank');
                // Listen for the LemonSqueezy event (fired by lemon.js when payment succeeds)
                window.addEventListener('lemon-squeezy:checkout:success', handleLSSuccess, { once: true });
                return;
            }

            // Use the Lemon Squeezy JS SDK overlay (requires lemon.js)
            if (typeof window.LemonSqueezy !== 'undefined') {
                window.LemonSqueezy.Setup({
                    eventHandler: (event) => {
                        if (event.event === 'Checkout.Success') {
                            handleLSSuccess(event);
                        }
                    },
                });
                window.LemonSqueezy.Url.Open(
                    `https://${LS_STORE}.lemonsqueezy.com/buy/${variantId}?embed=1&media=0&checkout[custom][tx_ref]=${txnRef}`
                );
            } else {
                // lemon.js not loaded yet — open in new tab as fallback
                const url = `https://${LS_STORE}.lemonsqueezy.com/buy/${variantId}?checkout[custom][tx_ref]=${txnRef}`;
                window.open(url, '_blank');
                setErrMsg('Checkout opened in a new tab. Return here once payment is complete and click 201cI2019ve paid201d.');
            }
        };

        const handleLSSuccess = async (event) => {
            setStage('processing');
            try {
                await onSuccess(amountNum, 'lemonsqueezy', '');
                setStage('success');
            } catch(e) {
                setErrMsg(e.message || 'Wallet update failed. Contact support.');
                setStage('form');
            }
        };

        // ─── Manual "I've paid" fallback (for new-tab flow) ──────────────────────
        const handleManualConfirm = async () => {
            setStage('processing');
            try {
                await onSuccess(amountNum, 'lemonsqueezy_manual', '');
                setStage('success');
            } catch(e) {
                setErrMsg(e.message || 'Wallet update failed. Contact support.');
                setStage('form');
            }
        };

        // ─── Wire transfer ────────────────────────────────────────────────────────
        const handleWire = async () => {
            setErrMsg('');
            setLoading(true);
            setStage('processing');
            await new Promise(r => setTimeout(r, 800));
            try {
                await supabase.from('wallet_topup_requests').insert([{
                    brand_id: context.brandId || null,
                    amount:   amountNum,
                    method:   'wire',
                    tx_ref:   txnRef,
                    status:   'pending',
                }]);
                setStage('success');
            } catch(e) {
                setErrMsg(e.message || 'Could not record request. Please contact support.');
                setStage('form');
            } finally { setLoading(false); }
        };

        const methods = [
            { id:'lemonsqueezy', icon:(
                <svg width="22" height="22" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="20" fill="#FFD234"/>
                    <ellipse cx="20" cy="22" rx="9" ry="11" fill="#FFF" opacity="0.25"/>
                    <circle cx="20" cy="14" r="5" fill="#FFF" opacity="0.9"/>
                    <path d="M14 24c1.5 4 10.5 4 12 0" stroke="#FFD234" strokeWidth="1.5" strokeLinecap="round" fill="none"/>
                </svg>
              ), name:'Card / PayPal', sub:'Visa · Mastercard · PayPal — via Lemon Squeezy' },
            { id:'wire', icon:(
                <svg width="22" height="22" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="#334155"/><rect x="11" y="17" width="18" height="10" rx="2" fill="white" opacity="0.9"/><rect x="15" y="13" width="10" height="6" rx="1" fill="white" opacity="0.6"/></svg>
              ), name:'Wire Transfer', sub:'Business accounts · 1–2 business days' },
        ];

        return (
            <div className="overlay" onClick={stage==='processing' ? undefined : onClose}>
                <div className="modal-wide" style={{maxWidth:520}} onClick={e => e.stopPropagation()}>

                    {/* ── HEADER ── */}
                    <div className="modal-hdr" style={{borderBottom:'1px solid var(--gray-100)'}}>
                        <div>
                            <div style={{fontWeight:800,fontSize:'1.15rem',fontFamily:"'Cabinet Grotesk',sans-serif"}}>
                                {stage==='processing' ? '⏳ Processing…' : stage==='success' ? '✅ Payment complete' : (context.title || 'Add Funds')}
                            </div>
                            {stage==='form' && <div style={{fontSize:'0.78rem',color:'var(--gray-400)',marginTop:'0.15rem'}}>{context.desc}</div>}
                        </div>
                        {stage !== 'processing' && <button className="modal-close" onClick={onClose}>×</button>}
                    </div>

                    {/* ── PROCESSING ── */}
                    {stage === 'processing' && (
                        <div style={{padding:'3.5rem 2rem',textAlign:'center'}}>
                            <div style={{width:72,height:72,margin:'0 auto 1.5rem',position:'relative'}}>
                                <div style={{position:'absolute',inset:0,border:'3px solid var(--gray-100)',borderRadius:'50%'}}/>
                                <div style={{position:'absolute',inset:0,border:'3px solid transparent',borderTopColor:'var(--black)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
                                <div style={{position:'absolute',inset:'18px',background:'#FFD234',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.1rem'}}>🍋</div>
                            </div>
                            <h3 style={{fontWeight:800,marginBottom:'0.5rem'}}>Verifying payment…</h3>
                            <p style={{color:'var(--gray-500)',fontSize:'0.88rem'}}>Crediting your wallet. Please don't close this window.</p>
                        </div>
                    )}

                    {/* ── SUCCESS ── */}
                    {stage === 'success' && (
                        <div className="pay-success">
                            <div className="pay-success-icon">{method==='wire' ? '🏦' : '🎉'}</div>
                            <h3>{method==='wire' ? 'Wire instructions saved' : 'Payment successful!'}</h3>
                            <p style={{marginBottom:'1rem'}}>
                                {method==='wire'
                                    ? 'Use the wire details below. Your wallet will be credited within 1–2 business days once confirmed.'
                                    : `Your wallet has been topped up with ${context.amount}. Start inviting creators or launching campaigns right away.`}
                            </p>
                            {method==='wire' && (
                                <div style={{background:'var(--gray-50)',borderRadius:12,padding:'1rem',marginBottom:'1.5rem',fontSize:'0.88rem',textAlign:'left',width:'100%'}}>
                                    {[['Bank','First Bank Nigeria'],['Account Name','Vyralist Ltd'],['Account No.','3012345678'],['Sort Code','011'],['Amount',context.amount],['Reference',txnRef]].map(([l,v])=>(
                                        <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'0.4rem 0',borderBottom:'1px solid var(--gray-200)'}}>
                                            <span style={{color:'var(--gray-600)'}}>{l}</span>
                                            <span style={{fontWeight:700,fontFamily:l.includes('No.')||l==='Reference'?'monospace':'inherit'}}>{v}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                            {method !== 'wire' && (
                                <div style={{display:'flex',alignItems:'center',gap:'0.5rem',fontSize:'0.75rem',color:'var(--gray-400)',marginBottom:'1.25rem'}}>
                                    <span>🍋 Secured by</span>
                                    <span style={{fontWeight:800,color:'#c89b00',fontSize:'0.82rem'}}>Lemon Squeezy</span>
                                    <span>· Ref: <span style={{fontFamily:'monospace',fontWeight:700,color:'var(--black)'}}>{txnRef}</span></span>
                                </div>
                            )}
                            <button className="btn btn-black btn-full" style={{borderRadius:10}} onClick={onClose}>Done</button>
                        </div>
                    )}

                    {/* ── FORM ── */}
                    {stage === 'form' && (
                        <div className="payment-modal-body">

                            {/* Amount */}
                            <div style={{textAlign:'center',padding:'1.25rem 0 0.75rem'}}>
                                <div style={{fontSize:'2.75rem',fontWeight:800,fontFamily:"'Cabinet Grotesk',sans-serif",letterSpacing:'-1px'}}>{context.amount}</div>
                                <div style={{fontSize:'0.8rem',color:'var(--gray-400)',marginTop:'0.2rem'}}>USD · Secured by Lemon Squeezy · 256-bit SSL</div>
                            </div>

                            {/* Method selector */}
                            <div className="pm-methods" style={{marginTop:'0.75rem'}}>
                                {methods.map(m => (
                                    <div key={m.id} className={`pm-method ${method===m.id?'pm-selected':''}`} onClick={() => { setMethod(m.id); setErrMsg(''); }}>
                                        <div className="pm-icon">{m.icon}</div>
                                        <div className="pm-name">{m.name}</div>
                                        <div className="pm-sub">{m.sub}</div>
                                    </div>
                                ))}
                            </div>

                            {/* ── LEMON SQUEEZY info ── */}
                            {method === 'lemonsqueezy' && (
                                <div style={{marginTop:'1.25rem'}}>
                                    <div style={{display:'flex',alignItems:'center',gap:'0.6rem',background:'#fffef0',border:'1.5px solid #FFD234',borderRadius:10,padding:'0.7rem 0.9rem',marginBottom:'1rem'}}>
                                        <span style={{fontSize:'1.2rem'}}>🍋</span>
                                        <div style={{fontSize:'0.8rem',color:'#78580d',lineHeight:1.4}}>
                                            <strong>Powered by Lemon Squeezy.</strong> You'll be taken to a secure checkout to complete payment with your card or PayPal. Your details are never stored by Vyralist.
                                        </div>
                                    </div>
                                    <div style={{background:'var(--gray-50)',borderRadius:10,padding:'0.85rem 1rem',fontSize:'0.82rem',color:'var(--gray-600)'}}>
                                        <strong>What you get:</strong>
                                        <ul style={{marginTop:'0.35rem',paddingLeft:'1rem',lineHeight:1.8}}>
                                            <li>Instant wallet credit on payment confirmation</li>
                                            <li>Automatic receipt sent to your email</li>
                                            <li>Card, PayPal, and bank transfer accepted</li>
                                            <li>Full refund available within 30 days if unused</li>
                                        </ul>
                                    </div>
                                    {errMsg && errMsg.includes("I've paid") && (
                                        <button
                                            className="btn btn-outline"
                                            style={{width:'100%',borderRadius:10,marginTop:'0.75rem',fontSize:'0.88rem'}}
                                            onClick={handleManualConfirm}>
                                            ✅ I've paid — credit my wallet
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* ── WIRE FIELDS ── */}
                            {method === 'wire' && (
                                <div style={{marginTop:'1.25rem'}}>
                                    <div style={{background:'var(--gray-50)',border:'1px solid var(--gray-200)',borderRadius:12,padding:'1rem',fontSize:'0.82rem',marginBottom:'0.75rem'}}>
                                        {[['Bank','First Bank Nigeria'],['Account Name','Vyralist Ltd'],['Account No.','3012345678'],['Sort Code','011'],['Amount',context.amount],['Reference',txnRef]].map(([l,v])=>(
                                            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'0.35rem 0',borderBottom:'1px solid var(--gray-200)'}}>
                                                <span style={{color:'var(--gray-600)'}}>{l}</span>
                                                <span style={{fontWeight:700,fontFamily:l.includes('No.')||l==='Reference'?'monospace':'inherit'}}>{v}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div style={{fontSize:'0.75rem',color:'var(--gray-400)',lineHeight:1.5}}>Wallet credited within 1–2 business days once confirmed by our team. Contact <strong>hello@vyralist.com</strong> with your transfer receipt to expedite.</div>
                                </div>
                            )}

                            {errMsg && !errMsg.includes("I've paid") && (
                                <div style={{background:'#FEE2E2',color:'#991B1B',padding:'0.7rem 0.9rem',borderRadius:8,fontSize:'0.82rem',margin:'0.85rem 0 0'}}>{errMsg}</div>
                            )}

                            <button
                                className="btn btn-black btn-full"
                                style={{borderRadius:10,padding:'0.9rem',marginTop:'1.25rem',opacity:loading?0.7:1,display:'flex',alignItems:'center',justifyContent:'center',gap:'0.5rem'}}
                                disabled={loading}
                                onClick={method==='wire' ? handleWire : launchLemonSqueezy}>
                                {method === 'wire' ? 'Save wire details & notify team' : (
                                    <>
                                        <span>🍋</span>
                                        Pay {context.amount} via Lemon Squeezy
                                    </>
                                )}
                            </button>
                            <p style={{textAlign:'center',marginTop:'0.7rem',fontSize:'0.72rem',color:'var(--gray-400)'}}>
                                🔒 256-bit SSL · PCI-DSS compliant · Powered by{' '}
                                <span style={{color:'#c89b00',fontWeight:700}}>Lemon Squeezy</span>
                            </p>
                        </div>
                    )}
                </div>
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
